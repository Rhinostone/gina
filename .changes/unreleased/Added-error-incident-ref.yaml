kind: Added
body: 'Incident ref on error responses: every `throwError` JSON error body now carries a top-level `ref` field - a short voice-relayable correlation code (6 uppercase hex, or a relay-safe caller-supplied value), present in ALL scopes - and ONE server-side error-level log line pairs that ref with the full error detail (message + stack + cause) plus the request correlation id BEFORE the stack-egress gate strips the wire copy, so support can resolve a user-relayed ref to the exact server-side failure even in production. The HTML error surfaces (custom error page data and the inline fallback page) carry the same ref. Also closes two logging gaps: a production API error thrown through the controller previously lost its stack server-side entirely (stripped before the only log line), and message-only server errors logged method/code/url without the message. Always-on, additive and backward-compatible - consumers parsing status/error are unaffected until they adopt the ref.'
