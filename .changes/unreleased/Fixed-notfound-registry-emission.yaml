kind: Fixed
body: 'Client-side routing helper no longer swallows its own "route not found inside your view" diagnostic: when a rendered 404 marker or an alternate-route lookup identifies a route missing from the running table, the composed message is now emitted via console.warn on the first sighting of each route (the gina.notFound registry still dedups repeats), and the alternate-route arm now records its registry entry so repeat counts accumulate instead of resetting. Server-side miss logging is unchanged. (#B462)'
