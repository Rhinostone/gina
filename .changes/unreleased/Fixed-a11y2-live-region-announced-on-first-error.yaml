kind: Fixed
body: 'Blur-time validation errors are now reliably announced to assistive technology the first time a form reports one. The form''s polite live region was created, inserted into the page and given its text in a single synchronous step, which reaches a screen reader as one change on an element it has never seen before and is commonly not spoken at all; the practical effect was that the first error announced on any form, the one most likely to matter, was the one least likely to be heard, while every later announcement worked. The region is now stood up when the form is bound, so by the time an error occurs it has been present all along. A region that still has to be created at announcement time defers its first write by a tick so the insertion and the text no longer land together. That second half matters because the region lives inside the form and a subtree replacement destroys it: a popin re-render or a fragment swap leaves the next announcement to re-create the region, which previously reproduced the original problem silently. Announcements on an already-bound region are unchanged and still write synchronously, and while a deferred write is pending a newer error replaces the pending text so the most recent message is the one spoken. The region deliberately remains a child of the form rather than moving to document level: a popin renders its form inside a native dialog opened with showModal(), which leaves everything outside the top layer inert, so a document-level region would go unspoken for exactly those forms. Browser-bundled - consumers re-bake at pickup.'
