kind: Added
body: 'New DuckDB connector — embedded analytical (columnar / OLAP) SQL over the standard entity wiring. A `"connector": "duckdb"` entry opens a file-backed or `":memory:"` database (`file` is optional and defaults to `~/.gina/{version}/{database}.duckdb`); entity methods load from `models/<database>/sql/` with `@param` casting and `@return` shaping, and row-returning detection covers the analytical dialect (`WITH` CTEs, `FROM`-first, `SUMMARIZE`, `PIVOT`/`UNPIVOT`, `DESCRIBE`, `SHOW`) so CTE-heavy queries return rows instead of being routed to the write path. Large numeric types (BIGINT / HUGEINT / DECIMAL) and dates arrive as JSON-safe strings; writes report `{ changes }`. `readOnly: true` opens the database read-only so any number of processes can share one file. The `@duckdb/node-api` driver installs in your project, and the `connector:*` CLI group plus the connectors.json schema recognise the new type.'
