kind: Fixed
body: 'A bundle whose release tree cannot be linked now refuses to boot with a message naming the bundle, the env and the scope, instead of an opaque `TypeError` (#B372). The config loader links each registered bundle''s release target for a non-dev env and, when that fails, builds a `[ releaseError ]` carrying the offending path — but the receiving callback never inspected its error argument and dereferenced the (absent) configuration object instead, so the useful reason was discarded and the process died on `TypeError: Cannot set properties of undefined (setting ''env'')` as an uncaughtException. The server never binds, so a startup probe sees only a refused connection, and the error points at framework internals rather than at the path an operator has to fix. Because the configuration load is shared across the project, ONE bundle''s missing release tree took down EVERY bundle in it. The error is now propagated and reported through the same sink the bundle-configuration loader already used — logged, flushed synchronously to stderr so the reason survives on an async pipe, then a clean exit 1. Note that a registered bundle still cannot be declared "not deployed for this scope": omitting its `releases.<scope>` entry produces this same refusal rather than skipping the bundle, and the only supported way to exclude one is to leave it out of the project manifest entirely, which removes it from every scope.'
