kind: Fixed
body: 'The Inspector''s View tab could show two badges instead of three, dropping the page-weight badge until the Inspector was refreshed, and its Flow tab could be missing the template-compile, execute, response-write and total bars (#B386). Both came from one cause: the dev statusbar mirrors the page payload into `localStorage` for the Inspector''s fallback data channel, and it does so before the render delegates append their late-bind patch script above `</body>`. That patch only mutates the in-memory object, so the mirror kept the emit-time payload forever, with the page weight left null (it is unknown at emit, since the response body length is not final until the render completes) and the late timeline entries absent. The asymmetry is what made it look intermittent rather than broken: the server-side processing time IS known at emit, so the load badge always rendered while the weight badge silently did not, and only whenever the browser-side Performance reading was also unavailable — which is the normal case for an Inspector window that is not reading its opener directly. All three patch sites (both swig paths and nunjucks) now re-sync the mirror at the end of the patch, after the values are written. The nunjucks site additionally now injects its patch through a function replacer rather than a string one, so that a timeline entry containing a dollar-sequence can no longer corrupt the emitted script. Development-mode only; no configuration change is required.'
