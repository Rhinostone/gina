kind: Fixed
body: 'Gina now requires `@rhinostone/swig` `^2.8.2` in both manifests. Up to 2.8.1, swig compiled a group whose operator binds more loosely than the operator outside it without its parentheses, so a template rendered a different value with no error: `{{ (1 + 2) * 3 }}` gave 7, `{{ 10 - (2 + 3) }}` gave 11, and `{% if (a or b) and c %}` took its branch with `a` true and `c` false. A comparison grouped inside a comparison and a subscript on a `+` group read wrong too, and `{{ -(-x) }}` did not compile. A group followed by a filter, a member read on a filtered group, `not (...)`, `!(...)` and parentheses around a whole condition rendered right before as well. 2.8.2 also ends its prototype-chain guard errors with « (prototype-chain guard) » instead of « (CVE-2023-25345) » and requires its control options to be strings. Upgrading gina installs 2.8.2 (a project copy loaded through `swig.useProject` keeps its own version); restart the bundle. (#B940)'
