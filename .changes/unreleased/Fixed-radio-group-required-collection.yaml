kind: Fixed
body: 'Fixed client-side form validation never adjudicating an unchecked radio group: no collection arm admitted a radio without a checked member, a boolean-shaped value, or an `isBoolean` rule, so an `isRequired` rule on the group never ran -- and a form whose only named controls were radio groups skipped the whole client validation pass and submitted its XHR unvalidated (a zero field count reads as nothing-to-validate on both submit paths). Both collectors (`getFormValidationInfos` and the native-submit inline copy) now collect an unchecked non-boolean radio group whose rule declares a truthy `isRequired` as an empty value, so the standard emptiness test rejects it: the empty submit is blocked, the rule message renders, and picking a value re-enables the send. Enforcement-tightening disclosure: forms that silently submitted with nothing picked now genuinely gate on the pick; groups with no rule, `isRequired: false`, or an `isBoolean` declaration keep the legacy absent-when-unchecked shape, and checked members post exactly as before.'
