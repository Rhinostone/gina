kind: Fixed
body: 'Fixed server auto-validation throwing a `TypeError` when a rule set still carried a `$` after field substitution — a regex end-anchor in an `is` condition (`/^(alpha|beta)$/`), a `$` inside a human-readable message string, or a `$` in any array-rule element after the first. The second substitution loop is a DOM fallback that reads each field from the live element, and the server has no DOM to read; it now skips in that case, exactly as it no-ops on the client once the first loop has consumed every known field token. Verdicts and substitutions on every rule set that already worked are unchanged. One `$` placement is deliberately out of scope and still throws: a token in an array rule''s FIRST argument that names no field (`isInList: ["$100"]`), which fails further downstream at a separate substitution site.'
