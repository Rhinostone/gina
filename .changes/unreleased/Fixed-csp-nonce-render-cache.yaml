kind: Fixed
body: 'Fixed CSP useNonce nonces diverging between the Content-Security-Policy header and the framework-injected inline bootstrap script on cache-enabled routes: the bootstrap nonce was frozen at first compile inside the per-view compiled-template cache (and the persisted layout cache) while the header rotated per request, so every cache-path response failed nonce validation under an enforcing policy. The bootstrap nonce is now injected as a render-time template conditional (re-evaluated per response), stale pre-fix layout-cache files are healed in place on the next compile, and cache HITS re-mint: the serve path rewrites the stored CSP header and body with a fresh per-response nonce on both engines, so header and markup nonces match and rotate on misses and hits alike.'
