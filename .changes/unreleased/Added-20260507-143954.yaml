kind: Added
body: 'Added `gina i18n:add <culture>` CLI command (#I18N1 slice 4 part 2). Seeds a new culture catalog at `<bundle>/locales/<culture>.json` by copying the structure of an existing source culture and prefixing every string value with `[TODO] ` so translators can grep / search-replace through the file. Three positional shapes: `gina i18n:add <culture> @<project>` (every bundle in the project), `gina i18n:add <culture> <bundle> @<project>` (single bundle), `gina i18n:add <culture> <bundle> @<project> --from=<src>` (explicit source culture). Source-culture resolution order per bundle: `--from=<culture>` → `<bundle>/config/settings.json > region.culture` → `process.env.GINA_CULTURE` → `''en''`. Refuses to overwrite an existing target catalog unless `--force` is passed; `--dry-run` prints what would be written and exits without touching the disk. Creates `<bundle>/locales/` recursively when missing. Recursion preserves nested catalogs and CLDR plural-form objects (every `zero` / `one` / `two` / `few` / `many` / `other` form gets the `[TODO] ` prefix); arrays / numbers / booleans / null pass through unchanged. Refuses when source culture equals target culture (caller would seed onto itself). Writes via `lib.generator.createFileFromDataSync` for parity with the rest of the framework''s file emitters; serialises with 4-space indent + trailing newline. For project-wide invocations, iterates the `manifest.json` bundle list in sorted order and reports per-bundle ok / skipped counts at the end. Tests at `test/lib/i18n-add.test.js` — 51 source-inspection + pure-logic + sandbox-write assertions covering module shape, argv parsing, source-culture resolution priority chain, `seedCatalog` transformation (string / nested / plural / non-string leaves / array passthrough / key-order preservation), guarded write path (source-equals-target / missing source / malformed source / target exists / dry-run / mkdir), multi-bundle iteration, and a sandbox round-trip that asserts the on-disk output JSON.parses back with the `[TODO] ` prefix in place. Full local suite green: 4347 / 4347. Slice 5 (`gina i18n:export` / `gina i18n:import` for PO / CSV / JSON translator round-trip) follows.'
