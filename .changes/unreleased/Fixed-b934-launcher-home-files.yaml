kind: Fixed
body: '`gina-container` reads `~/.gina/<version>/settings.json`, `projects.json` and `ports.reverse.json` as the CLI does: `//` comments are ignored and a trailing comma is accepted with a warning. A hand edit leaving one stopped the launcher with an uncaught `SyntaxError` that named no file. A file that is still not JSON, or cannot be read, now stops it with exit code 1 and `[ gina-container ] <file> cannot be used: <reason>`, the reason naming the path; `main.json` is read the same way and still only warns, now naming the file. Past the launcher, a bundle read `projects.json`, `ports.reverse.json` and `ports.json` with `require()` at boot, so the same comma stopped the bundle there; it now reads them with `requireJSON()`. Outside dev mode (`NODE_ENV_IS_DEV` not `true`), that boot now reads `projects.json` and `ports.reverse.json` from disk twice: `require()`''s cache used to serve the second read. `gina-init` parses its configuration file (`GINA_INIT_CONFIG` or `--config`) the same way, its error now naming the file, and a trailing comma in the previous `settings.json` no longer resets the `bind_host` it keeps to the loopback default. The launchers read their code at each start; restart a running bundle for its boot change. (#B934)'
