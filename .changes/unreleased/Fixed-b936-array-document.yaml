kind: Fixed
body: '`formatDataFromString()` now parses a top-level JSON array into the array of its elements. It returned a circular value instead, every element replaced by the array itself, so a route that rendered the parsed data answered 500 (« Converting circular structure to JSON »). Two request shapes reached it: a GET or HEAD whose only query parameter is `inheritedData=[…]` (on Express also with other parameters beside it), and a `[`-leading POST body not labelled `application/json`, such as a `fetch()` that posts `JSON.stringify([…])` without a content type. An element that is an object is now parsed like a document of its own (its bracket keys nest, and a `__proto__`, `constructor` or `prototype` key is dropped), and any other element is kept as it is: `[{"a[b]":"1"},2]` gives `[ { a: { b: ''1'' } }, 2 ]`. Nothing that worked before changes: an object document, an array inside a value, and an `application/json` body are parsed as they were. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B936, #B594)'
