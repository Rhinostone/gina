kind: Fixed
body: 'Fixed `gina.setOptions()`, which merged its options into an orphan object nothing ever read and was therefore silently ignored for every key since it shipped — the documented `loadingAttribute` rename (`gina.setOptions({ loadingAttribute: ''data-loading'' })`) could not work. It now merges options into the exposed `gina.config` — the object every plugin and library reads — in place, with override semantics (a top-level scalar replaces, a top-level object merges one level deep, keys absent from the options are never removed). An identity guard keeps the framework boot''s own call a no-op, so page-load behaviour is unchanged. Note that anything a project was already passing to `setOptions()` and silently having ignored will now take effect. The `data-gina-config` script-tag attribute, which was documented alongside the rename but is parsed by nothing, is no longer documented.'
