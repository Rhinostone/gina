kind: Security
body: 'Fixed prototype pollution on the request path. Client-supplied bracket-notation field names such as `__proto__[x]`, `constructor[prototype][x]` and their percent-encoded forms reached an unguarded property assignment in the data helper key-path nesting, and `merge()` copied an own `__proto__` key — the shape `JSON.parse` produces — through its `for...in` loops. Both key paths are now rejected, and `merge()` no longer copies inherited enumerable source properties. The sources were reachable from query strings, urlencoded and JSON request bodies, and multipart text-field names; a polluted prototype could influence outbound request options and safe-method or exemption checks. The affected modules also ship in the browser bundle, so consuming bundles need a rebuild as well as a restart.'
