kind: Fixed
body: 'Per-request culture negotiation was skipped on cached routes: the negotiated `req.culture` (whispered to the browser as `gina.config.culture`) was resolved only on the first (uncached) request to a URL and left empty on every subsequent cached request. So a warm page reload lost the negotiated culture, and any client-side culture-gated behaviour (such as localised form-validator labels) reverted to the default. The routing cache serves the second and later hits to a URL from a fast-path that ran before the negotiation step; the culture is now re-negotiated per request on that path too, and is never cached with the route (it varies per request by cookie and Accept-Language). Precedence is unchanged: URL prefix, cookie, Accept-Language, bundle culture, GINA_CULTURE, then en.'
