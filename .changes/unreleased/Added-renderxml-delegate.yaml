kind: Added
body: 'renderXML delegate (#FIN2): first-class XML responses, the outbound counterpart to verbatim XML request handling. Call self.renderXML(xmlContent) from a controller action to send a pre-serialised document — gina does not build XML any more than it parses it, so you serialise with the library of your choice and the delegate owns the wire concerns. The content type defaults to application/xml (RFC 7303 recommends it over text/xml) with the charset taken from the bundle encoding, and an optional second argument covers the suffix family: self.renderXML(doc, "application/soap+xml"), atom+xml for a feed, or a vendor tree. The status code comes from response.statusCode rather than the payload — an XML string has no envelope for the renderJSON status convention — so set it upstream or answer errors with self.throwError(). HEAD requests get the headers including a byte-accurate content-length with no body, HTTP/2 responses carry the status as a pseudo-header with upstream headers folded into the frame, and opt-in HTTP/2 trailers work as they do for every other delegate. A route using idempotency keys records its response envelope here too, so a retried XML mutation replays rather than re-executing.'
