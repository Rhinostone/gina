kind: Security
body: 'Credentials carried in a request URL no longer reach the logs in plaintext (#B433). The HTTP access line — and 45 sibling sites across both engines, every render delegate and the CSRF filter — log the URL as received, so a password-reset token, a signed download link or a one-time invite was written to stdout verbatim, with no seam to redact it. Every log message is now redacted BEFORE it is rendered and dispatched, at the logger''s single pre-render point, so stdout, `gina tail`, the file transport and the Inspector all receive the same masked line and a JSON-mode line cannot be corrupted. Configured per bundle in `settings.json > log.redact` and ON by default: a built-in set masks JSON Web Tokens, URL userinfo passwords, `Bearer`/`Basic` credentials, named credential query keys (`token`, `access_token`, `api_key`, `secret`, `password`, `signature`, `otp`, …, keeping the key and masking the value) and api-key style headers — measured at zero false positives over 433k real log lines and about a microsecond per line; every value the secrets resolver substituted for a `${secret:KEY}` placeholder is masked verbatim wherever it appears; and `patterns` takes your own rules (a regex source string, or `{pattern, flags, replacement}`), always applied with the `g` flag. A bare long-hex path segment is deliberately not a default — a content-address key and an opaque credential look the same — so add `\b[0-9a-f]{64}\b` yourself when your credentials take that shape. An unknown key, a non-boolean flag or an invalid / empty-matching pattern refuses the boot, because a rule dropped silently would be a leak. Behaviour change: masked values now appear in logs where the raw value used to; set `log.redact.enabled` to `false` to opt out. Restart your bundles to pick it up; no rebuild is needed. Also new: `lib.secrets.getResolvedValues(conf)` and `console.setRedaction(block, options)`.'
