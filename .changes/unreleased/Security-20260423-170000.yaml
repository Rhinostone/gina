kind: Security
body: >-
  Removed optional connector drivers from the root `package.json`
  `peerDependencies` block (couchbase, mongodb, mysql2, pg, ioredis,
  `@scylladb/scylla-driver`, openai, `@anthropic-ai/sdk`). These were
  declared with `peerDependenciesMeta.optional = true` but supply-chain
  analyzers (Socket.dev, npm audit, Dependabot) were still aggregating
  them into gina's dependency graph — surfacing 7 extra packages as
  gina's supply-chain surface even though gina never loads any of them
  by default. The version ranges are still authoritative in the
  `DRIVER_MAP` / `AI_DRIVER_MAP` tables in `lib/cmd/connector/add.js`
  and `lib/cmd/connector/list.js`, which is where `connector:add
  --install` has been reading them all along. No runtime behaviour
  change — when a bundle requires an uninstalled driver,
  `require('<driver>')` throws the same `MODULE_NOT_FOUND` it always
  did. Users who want a given connector install the driver in their
  own project via `gina connector:add <name> @<project> --install` or
  by hand.
