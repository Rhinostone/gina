kind: Fixed
body: 'FormValidator reused one shared `XMLHttpRequest` for every form submit, and re-opening it replayed the previous submit''s completion handler — visibly, submitting form B after form A had completed re-disabled A''s submit button and re-stamped its `data-gina-form-loading`, with nothing ever releasing them (the lock was armed in four places and released in one). Every send now builds its own XHR, and a `loadend` listener releases the submit trigger and loading flag on success, error, timeout and abort alike. Along the way, `$form.isSending` now genuinely spans the request (it used to be cleared almost immediately, at the first readyState transition), and a timed-out form has its `data-gina-form-loading` removed instead of being left holding the truthy string `"false"`.'
