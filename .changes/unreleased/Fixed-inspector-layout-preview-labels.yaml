kind: Fixed
body: 'Fixed the dev Inspector''s tab-layout preview rendering the two newest tabs (Stream, Events) as the literal text "undefined". Both tabs were added to the layout presets when they shipped, but the preview''s label and color maps were not extended, so their pills showed "undefined" with a broken pill color. The maps now cover all eight tabs, and the preview resolves labels and colors through fallbacks — a future tab missing from the maps renders its capitalized name in a neutral color instead of "undefined". Same stale-roster family, also fixed: the saved custom tab order was validated against a hardcoded six-tab maximum, so with seven or eight tabs visible a custom drag-reordered layout was silently rejected on the next load and never survived a reload; the bound now derives from the preset roster itself. Dev-tool only, served from the framework — a bundle restart picks it up, no asset rebuild needed.'
time: 2026-08-01T18:32:35+01:00
