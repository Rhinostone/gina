kind: Security
body: 'Added `gina.plugins.ReferrerPolicy({ value })` — opt-in middleware that emits the `Referrer-Policy` response header on every response to control referrer leakage (#HDR3). The `Referer` request header reveals the previous page URL — path and query string included — to the destination, which can leak session tokens, internal paths, account IDs, and search queries. The eight valid tokens per the W3C Referrer Policy spec: `no-referrer`, `no-referrer-when-downgrade`, `origin`, `origin-when-cross-origin`, `same-origin`, `strict-origin`, `strict-origin-when-cross-origin` (default — matches modern browsers since ~2021), `unsafe-url` (dangerous — leaks paths and queries). Settings: `referrerPolicy.value` (defaults to `strict-origin-when-cross-origin`). Caller options always win over settings; values are normalised to lowercase per the W3C spec''s case-insensitive matching (so `"NO-REFERRER"` is accepted and emitted as `no-referrer`). Invalid tokens throw at factory call time with the full eight-token list + W3C spec URL in the message (mirrors the #HDR2 throw-on-invalid pattern — fast-fail at bootstrap). Idempotent — first-writer-wins. Files: `core/plugins/lib/referrer-policy/{src/main.js, package.json, README.md}`, registered in `core/plugins/index.js`. Settings template seeds `referrerPolicy: { value: "strict-origin-when-cross-origin" }` with the comment header listing all eight tokens. Boilerplate `core/template/boilerplate/bundle/index.js` advertises the adoption example alongside the #HDR1/#HDR2 examples. 56 unit tests in `test/core/referrer-policy-plugin.test.js` (full suite 5574/5574, prior 5518 + 56). Third of the four Phase 1 plugins on the `#HDR` Web Security Headers track; leaves #HDR4 HSTS as the final Phase 1 plugin (with the browser-parity invariant on `preload`).'
