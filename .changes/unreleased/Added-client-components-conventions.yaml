body: 'Client-side components — standards-based Web Components conventions with zero dependencies: `gina view:add` scaffolds now ship a reference custom element (a server-rendered light-DOM partial paired with a behavior-only class — HTML and JS stay separated, repeatable markup clones from a server-rendered `<template>`), and the conventions are documented end-to-end (placement in `public/js/` + one `templates.json` entry, SSR hydration via attributes + a JSON `data-*` payload, data-down/events-up communication, SEO-first light DOM, strict-CSP compatibility, the reserved `gina-*` tag prefix). Components upgrade automatically inside popin/XHR-injected content — no rebinding; e2e coverage locks the popin auto-upgrade, strict-CSP, SSR-hydration, and no-JS crawler-equivalence contracts.'
