kind: Fixed
body: 'A bundle with `engine: "express"` now boots and serves on Express 5, and the supported range is declared for the first time (#B211). Express 5 broke the engine twice over: its router rejects the bare-string `''*''` catch-all at mount time (the bundle aborted with `TypeError: Missing parameter name` before ever listening), and it turned `req.query` into a prototype getter, so even past the mount every request died on the framework''s strict-mode query assignment. The catch-all now mounts a RegExp (accepted and verified live-dispatching on Express 4 AND 5 — no version branching; inert on the default isaac engine, which never reads the pattern), and the Express adapter shadows `query` on the per-app request prototype with a writable property (a measured no-op on Express 4). The adapter also logs the detected Express version at engine construction — supported range `>= 4 < 6`, both majors verified live — and an out-of-range major logs a loud warning but still boots. Express remains consumer-provided: it is deliberately not a dependency of the framework, and not a peerDependency either, since npm 7+ auto-installs peers.'
