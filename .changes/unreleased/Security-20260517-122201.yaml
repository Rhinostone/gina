kind: Security
body: 'Added gina.plugins.XDownloadOptions() — opt-in middleware that emits the literal header X-Download-Options: noopen on every response (#HDR11). Phase 1.5 (helmet-parity gap-fill) continues. IE-legacy: prevents Internet Explorer 8+ from opening downloads in the site security context — an old IE vulnerability shape where the "Open" button on a download dialog opened the file in the SITE origin, allowing XSS-equivalent via downloaded HTML from a trusted site. The "noopen" value tells IE to remove the "Open" button entirely, forcing the user to "Save" the download before viewing it. Modern browsers (Chrome / Firefox / Safari / Edge) ignore the header silently; only IE10 / IE11 honour it (both EOL since June 2022) — effectively no-op in modern browsers. Defense-in-depth + helmet-parity narrative; ships for the vanishingly-rare IE11 holdout (enterprise legacy intranet, etc.). "noopen" is the only valid value per MSDN — there is no "open" alternative. No tunable options (mirrors helmet no-opts shape + the #HDR1 XContentTypeOptions / #HDR10 XXssProtection plugin shape). Idempotent — first-writer-wins via res.getHeader. 35 unit tests in test/core/x-download-options-plugin.test.js.'
