kind: Fixed
body: 'Fixed two cross-request defects in the streaming render delegate under production concurrency: a finishing stream released a concurrent request''s req/res refs mid-stream instead of its own (leaving its own unreleased), and a stream error was reported through the concurrent request''s controller. The per-request dependencies are now function-scoped.'
