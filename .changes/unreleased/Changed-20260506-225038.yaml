kind: Changed
body: 'Bumped `@rhinostone/swig` from 1.6.0 to 2.0.0 (`framework/v*/package.json`). The fork''s 2.0.0 release carved internals into `@rhinostone/swig-core` and ships a self-contained pre-built esbuild bundle at `dist/swig.js`. Phase 7 of the asset build now copies the upstream esbuild bundle directly into `dist/swig.min.js` instead of running Closure Compiler on `bin/swig.js` — Closure does not follow npm `require()`, so post-2.0.0 the Closure path would carry unresolved `swig-core` requires. The framework''s swig-resolver `DEFAULT_MIN` floor (`lib/swig-resolver/src/main.js`) shifts from `1.6.0` to `2.0.0`; bundles that opt into a project-pinned swig (`swig.useProject: true`) must now pin `>= 2.0.0` of `@rhinostone/swig` for the resolver to honour the override. Server-side API is unchanged — same entry points, same compiled output.'
time: 2026-05-06T22:50:38.406254+01:00
