kind: Fixed
body: 'A required field left empty while also carrying an `is` (custom condition) rule no longer reports a second `Condition not satisfied` message beside `Cannot be left empty` (#B233). `is` was the one rule outside the empty-value contract every other data rule already follows: an empty value is adjudicated by `isRequired` alone, so a required+empty field records one message rather than two. Form validity is unchanged in BOTH directions — an empty required field was invalid and stays invalid, an optional empty field was valid and stays valid — so nothing that used to submit now fails, and nothing that used to fail now submits; only the message list a user sees changes. The empty test is strict: only the literal empty string bypasses the condition, while `0`, `false` and `null` remain real values and are still evaluated by it. A form whose UI renders every error message for a field will show one fewer line on that state; a form that renders only the first message is unaffected. Also drops a dead `isApiError` entry from the built-in error-label catalogue — nothing ever consulted it (the API-error path renders the server''s own message directly), so a project that had overridden or translated that label was silently getting no effect from it.'
