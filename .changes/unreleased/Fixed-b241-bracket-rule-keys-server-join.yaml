kind: Fixed
body: 'Server-side form-body validation now enforces rules authored on bracket-notation keys (`account[username]`) and on nested rule trees — previously such fields were silently skipped with no warning (fail-open), for every rule-keyed directive alike: checks (`isRequired`, `isEmail`, …), the `exclude` drop, and value transforms. Both production wire shapes join now: flat bracket keys (the client posts its name-keyed data as JSON) and nested objects (the multipart and urlencoded parsers expand bracket names). Error keys come back under the DOM-name bracket form the client renders against, and the validated data output keeps its shape with exclusions and transforms applied. Cross-field `$` references keep resolving off the raw posted names, all-flat payloads are byte-identical in behaviour, and the no-rules path still returns the payload verbatim. Behaviour change by design: a bracket-keyed rule that never fired before now enforces — a form relying on the old silent skip will start rejecting or dropping those fields (#B241).'
