kind: Fixed
body: 'Fixed the documented `setFlash` rule form `[null, "message"]` silently losing its custom message in the browser (#B226): `lib/merge` classified a `null` array element as an object (the `typeof null` trap) and refused to carry it through every no-override merge — the client-side rules path re-merges the whispered rules (the `data-gina-form-rule` bind merge, the `gina.hasValidator` instance re-merge, the `_case_` condition merges), so the engine received a one-element array, bound the message to the ignored first argument, and rendered the built-in label instead, while `["", "message"]` survived — `null` was the only casualty because empty strings, `false` and `0` are primitives. Merges now preserve `null` array elements as values framework-wide: arrays that were silently compacted keep their `null` slots (the index-merge branch also stops manufacturing `{}` from a `null` source element), the published `setFlash` example works as documented on the client, and `["", "message"]` keeps working byte-identically.'
