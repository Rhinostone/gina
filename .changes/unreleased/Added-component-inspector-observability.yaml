kind: Added
body: 'Dev Inspector component observability: the View tab now shows a component census — instances per custom-element tag, with a red indicator for undefined components awaiting upgrade (a typo''d tag name or a missing/failed definition script is no longer a silent failure) — and the Events tab surfaces client-side component protocol events (composed bubbling `<tag>:<verb>` CustomEvents) captured by a dev-only statusbar dispatchEvent wrap: event name, emitting element and timestamp always; `detail` values only when `settings.inspector.events.captureArgs` is opted in (the existing server-side knob, now whispered to the browser) and always passed through the Inspector''s redaction rules. The census and events follow XHR/popin fragment renders over the per-tab Inspector channel.'
