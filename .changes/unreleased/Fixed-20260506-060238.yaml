kind: Fixed
body: 'FormValidator restoring the wrong radio option on form-reset for HTML5 form-reassociated controls — sister fix to the `updateRadio` parse-time IDL/attribute reconciliation. `bindForm`''s `fieldsSet[id].defaultChecked` cache now reads the IDL `defaultChecked` property (which mirrors the HTML `checked` content attribute) instead of the live `.checked`. For form-reassociated radios hit by Chromium''s parse-time IDL desync, `.checked` reads FALSE at bind time despite the attribute being present, so the cache would hold the wrong default and a `type="reset"` action on the form would clear the originally-checked option. No-op for the normal single-form-owner shape.'
time: 2026-05-06T06:02:38+01:00
