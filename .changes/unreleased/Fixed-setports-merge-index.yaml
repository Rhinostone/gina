kind: Fixed
body: 'The port-setup merge that folds newly seen protocols and schemes into a project''s registry lists read the wrong array — the project''s own list indexed by the contextual list''s position — so once the contextual list outgrew the project''s, the overshoot read `undefined` (#B380). No user-visible consequence was demonstrated (a scene built to arm the overshoot produced none), so this ships as a correctness fix: the merge now reads the contextual list by its own index, exactly as the environment merge beside it always did, and it admits only values the framework supports — the contextual list also grows from `ports.json` keys, which can retain protocols a framework update removed, and those no longer re-enter the project''s lists.'
