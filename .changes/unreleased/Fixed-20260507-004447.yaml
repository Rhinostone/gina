kind: Fixed
body: 'Fixed `prepare_version.js` writing `settings.json`''s `version` field without also updating `settings.json`''s `def_framework` field. The original block at line 482 set `mainConfig.def_framework` but only `settingsConfig.version` (not `settingsConfig.def_framework`), producing a `version:<new> + def_framework:<old>` split inside settings.json (and in gina.db''s settings/<short> blob via StateStore) on every npm publish. Mirrors the safe writer pattern already in `post_publish.js:413-421` (bumpVersion writes both `settings.version` AND `settings.def_framework` together). The defensive pre-publish gate added earlier in the same release window catches the symptom at publish time; this fixes the root cause for settings.json drift specifically. The `~/.gina/main.json` def_framework drift observed in the same v0.3.10 forensic snapshot (main.json showed `def_framework: "0.3.9"` while the framework dir on disk was at `v0.3.10-alpha.2`) is NOT fully explained by this fix — `main.json` gets `def_framework=targetedVersion` correctly at line 483 of the same block — so the trigger for main.json drift remains under investigation as a separate follow-up.'
time: 2026-05-07T00:44:47.390918+01:00
