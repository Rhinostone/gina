kind: Security
body: 'A query field named `__proto__` no longer changes the prototype of `req.delete`. On the default engine (isaac), the query parser assigned every field with `request.query[name] = value`, so a `__proto__` field holding a JSON value (`__proto__=%7B%22polluted%22%3A1%7D&a=1`) re-pointed the prototype of the parsed query, and the DELETE branch handed that object over as `req.delete`. On every DELETE to a path after the first (the routing loop copies the bag on a cold route only), a property read such as `req.delete.polluted` returned the injected value while `Object.keys`, `hasOwnProperty` and `JSON.stringify` did not see it, and an injected `count`, `hasOwnProperty` or `toString` made `req.delete.count()`, `req.delete.hasOwnProperty()` or a string conversion throw: a 500 for that request. It stayed within that one request object. Measured on a booted bundle. The parser now drops a field named `__proto__`, `constructor` or `prototype`, as the data helper already did for GET and for bodies (#B592), and the DELETE branch hands over a plain object holding the query''s own fields, on every engine. A query field literally named `constructor` or `prototype` no longer reaches `req.delete`, as on GET. Server-side only: restart the bundle, nothing to re-bake (#B848)'
