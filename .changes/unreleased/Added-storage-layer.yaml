kind: Added
body: 'Pluggable object storage. A storage block in settings.json declares named drivers (an adapter crossed with a strategy), and gina.storage() returns one. The local adapter with the sharded strategy publishes every object atomically under a date-and-ULID key, and records its metadata (original name, content type, size) through a pluggable store seam - an embedded SQLite file by default, or a connectors.json entry when several processes share one root. Storage keys are opaque, so a later layout change cannot break stored references. A driver root that sits inside a web-served directory refuses the boot, since objects there would be publicly fetchable. The existing upload path is unchanged.'
