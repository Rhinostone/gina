kind: Fixed
body: 'Fixed `npm install -g gina@<older>` regressing `~/.gina/main.json`''s `def_framework` field to the older tarball''s version. `script/post_install.js:822` previously had no semver-newer guard — any reinstall with an older version unconditionally overwrote the scalar `def_framework`. Combined with the self-perpetuating abort loop at `script/prepare_version.js:449` (once the scalar pointed to a framework dir that had been renamed away, every subsequent prepare aborted before reaching the writer that would correct it), this could leave `~/.gina/main.json` stuck pointing at a missing version. Triggered exactly this shape on the v0.3.10 stable publish (2026-05-06), where the scalar was at `0.3.9` while the framework dir on disk was at `v0.3.10-alpha.2`. Fix adds a strict-semver pre-release-aware comparator (`script/version_compare.js`, 35 unit tests + 6 source-structure pins) and gates the `def_framework` write at `post_install.js:822` so older-version reinstalls preserve the newer state and emit a `Skipping def_framework update` console.info instead. The `frameworks` LIST is still updated on regression skip (additive history). The defensive gate at `script/check_def_framework_consistency.js` (added in the same release window) continues as the publish-time safety net; this removes the trigger.'
time: 2026-05-07T01:49:33.141774+01:00
