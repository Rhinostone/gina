kind: Added
body: 'The storage layer can now keep its metadata on Couchbase, which is what makes a driver root shareable: the embedded SQLite default is documented single-process-per-root, so two bundles — or two replicas of one — could not share a root until now. Point a driver''s `store` at a `connectors.json` entry whose `connector` is `couchbase` (SDK major 3 or 4, installed in your own project — the framework still declares no dependency on it) and every metadata row, inline payloads included, lives on the cluster instead of in `<root>/.meta.db`. Per-key atomicity comes from Couchbase''s own CAS, so the `cas` strategy''s reference counting behaves exactly as it does on the embedded store — two concurrent identical uploads still yield one blob with two references — and the GC sweep needs no election layer or extra configuration when several replicas run it at once: the claim step is itself compare-and-set, so each blob is collected exactly once and the losing sweeper simply moves on. Rows are namespaced by driver name, so several drivers may share one connectors entry without colliding, which matters under `cas` where identical bytes always mint the same key. The two secondary indexes the maintenance verbs need are created at boot when missing; if the account may not create them the boot still succeeds and the exact `CREATE INDEX` statements are logged to run by hand, because Couchbase errors on an unindexed query rather than merely running it slowly. Inline payloads are stored base64-encoded inside the document (Couchbase cannot query a binary value), which costs about a third more space and puts a practical ceiling near a 14MB `inlineThreshold`. Mutations use the SDK''s default durability unless the entry sets `durability` to `majority`, `majorityAndPersistToActive` or `persistToMajority`.'
