body: 'An unticked checkbox whose rule declares `isBoolean` together with `"isRequired": false` was left out of the posted data; it now posts `false`, as every other unticked boolean checkbox already did. A handler that tested for the field''s presence now receives `false`. A disabled checkbox is still left out, and so is an unticked checkbox that carries a value other than `true` or `false` with no `isBoolean` rule. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B916)'
