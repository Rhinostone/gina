body: 'Fixed `${secret:GINA_*}` placeholders never resolving in CLI-process contexts — the env backend now reads the framework environment first, then `process.env`, so a shell-exported GINA_-prefixed secret resolves in `mcp.json`, in connector CLI commands, and in `audit:verify`; the CSRF plugin''s `GINA_CSRF_SECRET` tier and the audit-chain boot lint message were aligned with the same two-tier read'
