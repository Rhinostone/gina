kind: Changed
body: 'The config-source walk behind `secrets:scan` and `secrets:check` now lives in `lib.secrets` as `getProjectRequiredKeys(projectPath, {scope, bundle})` (with `loadManifest`, `readJsonSafe` and `resolveBundleSrc` exported alongside for single-file reads). The two CLI handlers previously each carried their own near-identical copy of the walk and now delegate to the one shared implementation, so the two commands - and any future boot-time consumer - enumerate the same config sources by construction and cannot drift apart. CLI behaviour and report output are unchanged by this relocation.'
