kind: Fixed
body: 'The connector:add --help output and the AI connector JSDoc examples now show the working ${secret:KEY} placeholder for injecting an API key or password into a connector entry, instead of a bare ${ENV_VAR} form. A bare ${ENV_VAR} placeholder is never substituted at config-load time — only ${secret:KEY} placeholders are resolved from the environment — so the previous examples would have produced a connector that used the literal placeholder string as its credential.'
