kind: Fixed
body: 'Boot-time bundle mounts are now idempotent, atomic and concurrency-safe (#B381). A mount symlink that already resolves to the intended source is kept untouched, so the steady-state boot writes nothing; a wrong or missing link is published atomically (temp sibling + rename), so the mount name never disappears mid-rewrite; and a concurrent process publishing the identical link is treated as success instead of killing the boot. Previously every boot re-created every declared bundle link in two non-atomic steps (unlink, then create) with no mutual exclusion — with several processes booting one shared project tree (e.g. replicas over a POSIX network filesystem), the contended rewrites could fail a boot outright or abort the shared config load for every bundle. The project bundles/tmp/cache directories and the generator path creation are race-free now as well (recursive create instead of check-then-create). Behaviour note: a real directory occupying a mount path is no longer silently deleted and re-linked — the boot refuses loudly instead.'
