kind: Fixed
body: 'An exception thrown while the framework parses the data of a request is answered as a `500` instead of ending the bundle. The query of a `GET`, `HEAD` or `DELETE` request, the end of the `PUT` body branch and the hand-off to the dispatch that follows on the same stack ran with no `try`, so an exception raised there reached the process as an `uncaughtException` and the bundle exited (code 143): the path three earlier defects took, each fixed at its cause (#B546, #B591, #B792). The call that runs this parse is now guarded, as the `POST`, `PUT` and `PATCH` body branches already were: the request is answered through `throwError()` with a `500` (JSON for an XHR or API request, the bundle''s own error page for an HTML one) and an incident ref, and one error-level log line pairs that ref with the stack. No input is known to raise such an exception today: the guard is a net under the parse, and what it catches is logged so that its cause is fixed. Both engines. A `multipart/form-data` request never runs that call and is not covered by it. Restart the bundle; nothing to re-bake (#B793).'
