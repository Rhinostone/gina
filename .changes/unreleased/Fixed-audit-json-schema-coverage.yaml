kind: Fixed
body: 'The `settings.json` schema now describes the `audit` block, so the audit trail configuration gets the same editor support as the rest of the file. All five keys — `enabled`, `file`, `store`, `actorKey` and `events.authz` — were undeclared, so an editor offered no completion, no type checking and no description on hover, and a mistyped key or a wrong type surfaced only as a boot refusal at the next restart. The declaration mirrors the boot lint rather than merely permitting the keys: `enabled` and `events.authz` are strictly boolean (a truthy string such as "true" would leave the trail silently off), `file` and `store` are non-empty strings and mutually exclusive, and unknown keys are rejected — so an editor now flags the same shapes the boot would refuse. Runtime behaviour is unchanged; the schemas are editor tooling, never enforced at boot.'
