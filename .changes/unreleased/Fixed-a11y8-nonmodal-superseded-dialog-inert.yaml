kind: Fixed
body: 'A popin opened while another one is still open no longer leaves the first reachable behind it. Non-modal is the framework default for the `data-gina-dialog` API, and opening a popin never closes the one it supersedes, so both stay in the page — but a non-modal `<dialog>` gets none of the background `inert` that native `showModal()` provides, and gina restores it by hand. That restoration skipped the shared popin container wholesale, and every popin lives inside that container, so a superseded dialog kept its links, buttons and form fields in the tab order behind the dialog actually on screen: a keyboard or screen-reader user could tab straight out of the popin they were looking at and into a stale one. The container is now descended into, and sibling open dialogs are inerted individually. Closed ones are deliberately left alone — a `<dialog>` without the `open` attribute is already `display: none` per the user-agent stylesheet, so it is unreachable without help. Teardown needed no change and still restores everything it marked, including an `inert` a project set itself, which gina never claims.'
