kind: Changed
body: 'renderStream() is now byte-serving-capable, the engine-side groundwork for HTTP Range on stored objects: on non-SSE content-types, Buffer chunks pass through verbatim instead of being UTF-8-decoded (binary payloads previously arrived corrupted — every invalid-UTF-8 byte replaced with U+FFFD; valid-UTF-8 Buffers re-encode byte-identically, so text consumers are unaffected and SSE keeps its decode); HEAD requests answer headers-only without consuming the iterable, the same render-layer body suppression every other delegate already honours (a destroyable source is destroy()ed instead of leaking its handle); and the delegate''s default headers (cache-control, connection, x-accel-buffering) now yield to values the caller pre-set instead of silently clobbering them on both engines.'
