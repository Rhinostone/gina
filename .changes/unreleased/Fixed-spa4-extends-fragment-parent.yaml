kind: Fixed
body: 'Fixed negotiated fragment responses arriving content-empty for `{% extends %}` templates: the layoutless render persisted its (empty) nolayout shell over the shared cached-layout parent before compiling, so the child''s blocks extended a block-less parent and were discarded — and one fragment request could transiently blank the full-page layout other renders compile from (dev). A layoutless render of an extends template now targets its own `fragments/` cache namespace, primed from the child''s own block roster so its blocks render, with the shell tail (xhr inputs / scripts) composed after them, and the compiled-template cache key carries a `:fragment` shape suffix so fragment and full-page compiles never collide in cached mode. Full-page renders are byte-identical; a popin pointed at an extends-template route changes from empty to content. On the nunjucks engine the same request class instead returns the full page (layoutless is honored for asset filtering only) — tracked separately. (#SPA1)'
