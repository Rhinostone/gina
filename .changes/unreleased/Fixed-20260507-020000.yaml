kind: Fixed
body: 'Fixed cross-bundle leak under reverse-proxy sub-path mounts where the routing.json fetch would land on the wrong upstream. `core.js::getDependencies` (in `gina.min.js`) runs from the gina script-tag onload handler BEFORE `window.onGinaLoaded` populates `gina.config`, so `gina.config.webroot` was undefined at fetch time and the URL collapsed to `/_gina/assets/routing.json` — answered by whichever upstream served `/` rather than the bundle that rendered the page. Fix: `loader.js` now exposes `window.__ginaWebroot` synchronously at script parse time (whispered server-side from `page.environment.webroot`, which already includes any `X-Forwarded-Prefix` composition from the previous slice). `core.js` reads `window.__ginaWebroot` first, falling back to `gina.config.webroot` then `''/''` for backward compat. The synchronous global is reliably available because `gina.onload.min.js` is injected into `<head>` BEFORE `gina.min.js` by every full-page render path in `controller.render-swig.js` (`:1185-1194` dev, `:1262-1271` prod). +13 tests in `test/core/controller.test.js` § 10 (loader + core source pins, pure-logic resolution-chain replica, dist-equivalence check).'
