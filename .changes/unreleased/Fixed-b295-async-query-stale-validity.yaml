kind: Fixed
body: 'A form whose last rule is an async `query` — the uniqueness check a registration
  form typically carries — no longer stays marked invalid after that check comes back
  clean. The async completion path decided the form''s validity from a single field''s
  result, and its update step only ran when that field FAILED, so a form that had just
  become valid was never re-examined: the submit trigger kept its `aria-disabled`
  marker and `gina.validator.$forms[id].errors` kept listing the field. Until 0.6.4
  that was invisible, because nothing read the marker; since the submit gate began
  reading it, the first click after the query settled was silently swallowed and only
  a second click got through. The verdict now comes from a fresh whole-form pass, the
  same one already used when the async field is not the last to validate, which also
  clears the stale error message. A form with another field still invalid stays
  correctly blocked.'
