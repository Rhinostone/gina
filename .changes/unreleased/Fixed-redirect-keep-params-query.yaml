kind: Fixed
body: 'A redirect route no longer discards the caller''s query string when it declares `keep-params: true`, and the redirect gina generates for a non-root `server.webroot` now sets that flag itself (#B352). Previously a bare-webroot request such as `/dashboard?token=abc` was answered `302 /dashboard/` with the parameter gone, so any flow carrying a signed token, a redirect target or any other parameter into a bundle lost it whenever the URL was written without a trailing slash — the application saw an absent value rather than a bad link, and nothing on screen or in its own logs pointed at the URL. `keep-params` had been documented as a redirect-route key since before the project moved to GitHub but was never implemented: the value was read and then dropped, so every `control: "redirect"` route silently discarded the query. It is now honoured, and still defaults to false — existing redirect routes are unaffected. Only a local target inherits the query: an absolute `param.url` names another origin, so the flag is ignored there rather than disclosing the caller''s parameters to a third party, and CR/LF are stripped so a crafted query cannot split the `Location` header. Note that setting `webrootAutoredirect` to false never avoided this loss — that setting only controls whether the site root also redirects to the webroot; the bare-webroot redirect happens either way.'
