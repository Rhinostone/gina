kind: Fixed
body: 'Fixed cross-request leak of the X-Forwarded-Prefix-derived webroot prefix. `process.gina.PROXY_PREFIX` was set by `server.isaac.js` inside a `!isProxyHost && headers[''x-forwarded-host'']` gated block — the gate stops firing after the first proxied request flips `isProxyHost` to globally true via `setContext(''isProxyHost'', true)`, so subsequent requests never re-derived the prefix and the value stayed at the FIRST proxied request''s value forever (until worker restart). This bit any worker handling a mix of proxied + direct calls (e.g. internal services hitting the bundle without going through the proxy — direct calls inherited the leaked prefix and rendered with the wrong webroot) and bundles behind a proxy that mounts them at multiple paths. Fix moves the prefix processing OUT of the gated block so it runs on every request, and switches the slot from process-global `process.gina.PROXY_PREFIX` to per-request `request._ginaProxyPrefix`. Reader at `controller.js` `set(''page.environment.webroot'')` setter site updated to read `local.req._ginaProxyPrefix` (with `local.req && typeof != ''undefined''` defensive guard). Normalisation steps (trim / strip trailing slashes / prepend leading slash / drop empty / drop ''/'') unchanged. +9 tests across `test/core/server.isaac.test.js` (1 new positive: writer outside gated block; 1 new negative: process.gina.PROXY_PREFIX is no longer written; 2 existing source pins re-aimed at request._ginaProxyPrefix) and `test/core/controller.test.js` § 09 (5 per-request isolation tests including the cross-request-leak repro: req A sets prefix, req B without header gets undefined and bundle-internal webroot; 1 new negative: process.gina.PROXY_PREFIX is no longer read; 2 existing source pins re-aimed at local.req._ginaProxyPrefix). Full local suite 4050/4050 green.'
