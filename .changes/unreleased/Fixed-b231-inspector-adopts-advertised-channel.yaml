kind: Fixed
body: 'Fixed the dev Inspector silently rendering bundle-global data when opened without its statusbar link (#B231): a direct-URL, bookmarked, or pre-bound-mode Inspector window fell back to the shared localStorage slot plus the worker-wide `/_gina/agent` stream, so any background request to the bundle overwrote the page-scoped popin/XHR overlay within seconds — a warmed popin open never appeared to update the Query tab. Such a window now adopts the statusbar-advertised tab channel at boot (bound mode, guarded by a liveness handshake so a stale advert from a closed tab falls back cleanly to the legacy acquisition), and a new footer badge names the active data-source mode — `bound` / `agent` / warn-tinted `global` with a tooltip pointing at the statusbar link — so a degraded mode is visible instead of silent.'
time: 2026-08-03T15:09:38+01:00
