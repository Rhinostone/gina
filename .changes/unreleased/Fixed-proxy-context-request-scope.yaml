kind: Fixed
body: 'Fixed absolute URLs poisoned by port-less internal calls (#B152): a request whose Host carries no port — a container health probe on an app route, a service-mesh hop, a sibling-bundle call addressed by service/DNS name — was classified as reverse-proxied and rewrote the worker''s proxy-host context, so later renders'' `getUrl`/`url` filter output and cross-bundle redirect / error-fallback targets could emit the internal host. The template filters (swig + nunjucks) and both redirect/error-fallback URL builders now prefer the emitting request''s own per-request classification on both engines (Express included — the per-request slots are now filled engine-agnostically); the worker-global remains the fallback for renders without a request.'
