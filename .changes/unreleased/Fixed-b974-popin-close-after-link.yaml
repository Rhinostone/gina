kind: Fixed
body: 'A popin can be closed again after a link inside it loaded a page. A plain link in popin content (an `<a href>` with no `id`, no `#` and no `target`) loads its page into the same popin; after such a load, landed or failed, Escape closed the `<dialog>` while the popin stayed open (no `close` event, and its trigger could no longer show it), Escape on a non-modal popin did nothing, and `gina.popin.close(name)`, a form''s `close()` and a client navigation (which closes the open popin through that call) did nothing at all. The same held after `gina.popin.load()` reloaded an open popin, after a link load into a `data-gina-dialog-target` popin, after a link with a `target`, and after a form''s redirect into its own popin. A close while such a load was in flight let the late answer fill the closed popin, or reopen a declarative one. Since 0.7.6 every close works once the load has settled, Escape and the close button also close while it is in flight, and a close drops the late answer; `gina.popin.close(name)` and a form''s `close()` are still ignored while the load is in flight. Browser-bundled: restart the bundle and re-bake it (`gina bundle:build`) to pick it up. (#B974, #B975)'
