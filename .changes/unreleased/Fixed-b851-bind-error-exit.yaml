kind: Fixed
body: 'A bundle that cannot bind its port now ends its boot with exit code 1. When another program held the port (`EADDRINUSE`) or the bind was refused (`EACCES`), the default engine only logged the error and the boot went on: the readiness line `Bundle started !` was printed on its timer and, with nothing listening, the process then exited 0, so `gina-container` exited 0 and the framework read the bundle as started (measured on a booted bundle); on the express engine the error was not handled at all. Until the server listens, a bind error now prints `[ FRAMEWORK ] abort: could not listen on port <port>: <code> (…)` on stderr and the bundle exits 1, and `Bundle started !` is printed only once the server listens. An error the server reports once it listens is handled as before. Pickup: restart the bundle (#B851)'
