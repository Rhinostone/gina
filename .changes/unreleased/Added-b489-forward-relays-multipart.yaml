kind: Added
body: '`self.forward()` now relays a `multipart/form-data` request as multipart, uploads included. It handed `req[method]` to `self.query()`, which JSON-encodes its `data` and forces the outbound content-type to the json mime, so a forwarded upload reached the target as a JSON object of its text fields and `req.files` never travelled at all. A new `lib/multipart` encoder rebuilds one RFC 7578 body from the parsed text fields — re-flattened to bracket notation, the exact inverse of the parser''s nester — and from the staged files read at their staged paths, under a CSPRNG boundary re-drawn until it occurs in no part; that body travels through `query()`''s new `options.body` raw-body pass-through, so the caller''s own content-type survives on both transports and the HTTP/2 request prep no longer relabels it with the incoming request''s boundary. The body is buffered and therefore bounded: by the source bundle''s `upload.maxFieldsSize` when the parser stamped a usable cap, else by a 16 MB default, checked against the field bytes plus the on-disk sizes before a single byte is read — a breach answers 413 naming both numbers. Files forwarded under a method that carries no body answer 400, an unreadable staged part answers 500 naming the path, and staged files are read but never deleted, so the source''s own cleanup still owns them. Server-side only; pickup is a bundle restart. (#B489)'
