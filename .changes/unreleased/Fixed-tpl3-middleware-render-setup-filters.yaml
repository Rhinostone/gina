kind: Fixed
body: 'A template that a route middleware renders with `self.render()` now sees the filters, tags and extensions the bundle registers in `controllers/setup.js`, from the first request after a boot. The router runs `setup.js` only for a request that reaches a controller action, after the route middlewares, so such a template answered a 500 `Invalid filter` until a request had reached an action in the same process, and on every request for a route set whose middleware renders them all. A swig render now runs `setup.js` on its engine when that engine has not run it yet, with the members the router hands it; an action request still runs it once, and a filter named like one of gina''s own still loses to gina''s. Restart your bundles (#TPL3).'
