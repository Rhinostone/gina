kind: Fixed
body: 'Merged-process projects (several bundles sharing one port, served by one process): the first cross-bundle getUrl no longer permanently replaces the target bundle''s routing table with the starting app''s — previously every cross-bundle link to that bundle rendered the literal 404:[<METHOD>]<rule>@<bundle> marker instead of a URL, and merged-mode inbound statics dispatch could match requests against the wrong bundle''s table. Each bundle now keeps its own routing table (the hostname share is preserved); projects with distinct per-bundle ports were never affected.'
time: 2026-07-20T09:22:56+01:00
