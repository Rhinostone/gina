kind: Fixed
body: 'Fixed the dev Inspector''s XHR/popin overlay churn (#B225): a preload-consumed (hover- or focus-warmed) popin open never set the toolbar''s XHR overlay — its queries and data stayed invisible to the Query/Data tabs while the tab badge blinked page-count to xhr-count and back — and the Inspector''s refresh button leaked a passive /_gina/agent SSE stream into statusbar-bound windows, applying bundle-wide payloads over the page-scoped ones. Both preload-consume branches now mirror the cold-click dev gate (updateToolbar right before dispatch), the refresh reopen gate skips bound windows, and the Query-pane re-renders (filters, search, live-index refetch) derive from the live payload instead of a cache that survived closed overlay eras — a refresh no longer resurrects a closed popin''s badge count. Disclosed: warmed popin opens now set the badge/overlay for the open''s duration, exactly like cold opens always did.'
