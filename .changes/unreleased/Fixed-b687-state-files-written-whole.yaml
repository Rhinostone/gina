kind: Fixed
body: '`gina-init`, `gina-container` and the install step (`npm install gina`) now write the `~/.gina` files they update whole. `gina-init` rewrote `projects.json`, `ports.json`, `ports.reverse.json` and its `settings.json` in place, `gina-container` rewrote `main.json` in place when it updated `def_framework`, and the install step did the same when it updated `def_framework`, the frameworks list or `def_global_mode`; a `gina` command or a bundle reading the file at that moment, such as another container sharing `~/.gina`, could find it empty or cut short and stop. Each file is now written to a temporary file in the same directory and renamed into place, as the other `~/.gina` writes already were, and an existing file keeps its permissions. Nothing to change: the temporary files exist only while a file is written. (#B687)'
time: 2026-10-17T08:52:57+01:00
