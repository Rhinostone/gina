kind: Security
body: 'Gina now requires `@rhinostone/swig` `^2.9.1` in both manifests. Up to 2.9.0, swig''s `striptags` filter ran in time quadratic in the length of its input: on text with many `<` and no `>` after them, 100,000 characters took about four seconds, so a template that applied `striptags` to request data could be made to block the event loop. 2.9.1 runs it in linear time with the same output; see swig''s 2.9.1 release notes. Gina''s own code and templates never call `striptags`. Upgrading gina installs 2.9.1 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version, so update it there: 2.9.1 also fixes filters of the Twig, Jinja2 and Django frontends); restart the bundle. (#B963)'
