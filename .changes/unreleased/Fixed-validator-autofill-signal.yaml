kind: Fixed
body: 'FormValidator now reacts to a browser or password-manager autofill (#B478). A fill lands without any keystroke, and on Chrome without an input or change event until a later gesture, so the live check never re-ran: the submit control kept the gated look it was given at bind time on a form the user could see was complete, and an autofilled invalid value showed no error. The default stylesheet now gives every autofilled control a 1ms keyframe named gina-autofill-start, and the validator routes the resulting animationstart into the field''s own live check: a readable value is validated like a typed one (the gate opens, or the field shows its error), while a value the browser still withholds from script (Chrome, until the first gesture) no longer counts against the gate and renders no false required error. The submit-time check is unchanged, so a value still withheld at click time is refused and never posted empty. Browser-bundled: rebuild each consuming bundle to pick it up.'
