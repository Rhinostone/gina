kind: Fixed
body: 'The couchbase connector now normalises the types it reads from `@return` and `@param` annotations, and bounds both captures to the first brace pair (#B413). Both extracted types feed exact-match comparisons whose arms are all lowercase - the return type against the branch chain that dispatches the declared shape, and each param type against the switch in the parameter cast - so a capitalised or space-padded type such as `{Number}` or `{ number }` matched nothing and was SILENTLY skipped: the caller received the raw row array instead of the declared shape, and the parameter was left uncast. Both are now trimmed and lowercased at extraction, exactly as the mysql, postgresql, scylladb and sqlite connectors already did. The two captures were also greedy, so a second brace pair on the same line bled into the extracted type (`@param {a} and {b}` yielded `a} and {b`), which then matched no cast arm either; both are bounded to the first brace pair. Behaviour change worth knowing: annotations that previously fell through silently now reach their branch, so a query declaring `@return {Number}` begins returning the declared shape rather than the raw row array. The `@options` annotation deliberately keeps its greedy capture and is pinned as such - it holds a nestable object literal rather than a single type token, so bounding it would truncate a nested object and break the parse.'
