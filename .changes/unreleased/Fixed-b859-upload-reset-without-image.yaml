kind: Fixed
body: 'A reset or a delete now removes a file shown without an image. Both acted only on the `<img>` children of the preview container. A staged file whose staging answer is not an image and carries no `preview` gets no `<img>`, so its reset left its inputs in the form and did not ask the server to remove the staged copy, and the save posted the file the user had removed. In a `<ul>` container, where gina wraps each preview in an `<li>`, the reset did nothing at all. A reset now acts on the input''s files. On an edit form, a stored file the page shows without an image is found when its node carries `data-upload-original-filename` naming the file; its delete link was bound to nothing. An `<img>` still works as before. Browser-bundled: rebuild bundles to pick it up (#B859).'
