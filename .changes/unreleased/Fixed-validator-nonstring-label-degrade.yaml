kind: Fixed
body: 'A form error label that is not a string no longer takes the form down. The validator engine now discards it, warns once naming the rule, and renders that rule''s English default instead — covering all four sources a label can arrive from: a bundle catalog''s `_validator` node, a `gina.validator.setErrorLabels()` override, a rule''s `errorMessage` argument, and a field''s `error`. Only the first was caught by the boot lint. Previously the engine threw `TypeError: target.match is not a function`, and nothing on the path catches it: the validation pass aborted, so no error message rendered, the form never submitted through gina, and because the boot-time pass throws out of an unguarded form-binding loop, every later form on the page was left unbound — the page silently fell back to native browser submits with no client-side validation at all. Separately, `compileError()` no longer throws when a backend field error carries no `{{placeholder}}` (a plain string such as "Already taken" made `String.match` return `null`, and the null was dereferenced), and the query rule keeps its resolved label when a backend field error is not a string.'
