kind: Added
body: 'New: a general-purpose key-value primitive (#KV1) — declare namespaces under `settings.json > kv.namespaces` and reach them as `gina.kv(''<namespace>'')` (or `gina.kv()` for `kv.default`). The handle is promise-native with 13 operations: `get` / `set` / `del` / `has` / `ttl` / `expire` / `setnx` (set-if-absent) / `consume` (atomic read-and-delete — one-shot tokens: the second reader gets null) / `incr` / `decr` (integer counters, TTL on create only) / `delIfEquals` (compare-and-delete, the safe lock-release primitive) / `clear` / `getOrSet` (fetch-or-compute with per-process single-flight). Values are JSON-serialized — null and undefined are refused on every write, a stored null being indistinguishable from a miss; TTLs are milliseconds and must be positive (`ttl: 0` refuses rather than meaning no-expiry). Namespaces are strict-declared: an unknown name throws at the call site instead of silently minting an empty store, and the whole feature is dormant with no `kv` block. Each namespace owns its failure policy (`failMode` `closed`, the default, rejects on backend errors; `open` degrades every operation to its miss-shaped result with a warning). Ships with three backends: in-memory (zero config), redis and SQLite, the latter two selected by pointing a namespace''s `store` at a `connectors.json` entry — atomic set-if-absent, consume, compare-and-delete and TTL-on-create-only counters are all server-side, and `GETDEL` is used when the server supports it with a Lua fallback below redis 6.2. Naming a connector that has no kv-store implementation still refuses the boot rather than degrading silently to memory. Deliberately NOT a redis client: no data structures, batch operations, key scanning, binary values, or first-class locks.'
