kind: Fixed
body: 'Handle-mode query error deliveries now reach the app''s `onComplete` listener (#B404): every error-path `query#complete` emit is single-argument — mirroring the callback form''s `callback(err)` contract — while both facades'' `(err, data)` dispatch dereferenced `data.status` unconditionally, so a transport error or non-2xx outcome crashed the facade and answered 500 with a marker misattributing the failure to the app callback; the listener never fired. A guard in both facades (HTTP/1.1 and HTTP/2) now delivers the single-argument payload as the error — `cb(err)` on failure with the same shapes as the callback form, `cb(false, data)` on success — and the host-missing emitter branch gained the `return` its callback twin always had. Action required if a handle-mode query could fail: the listener is NOW INVOKED with the error (previously the framework answered 500 before it could run) — the app owns the outcome, like the callback form.'
