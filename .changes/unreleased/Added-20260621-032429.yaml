body: 'gina now runs on the Bun runtime. Install with `bun add -g gina`; `engine.bun` declares the supported range (`>= 1.2`), and a CI Bun smoke validates a clean install, bundle boot, and HTTP 200 response under Bun on every push to develop and master.'
