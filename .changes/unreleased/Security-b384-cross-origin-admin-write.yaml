kind: Security
body: 'Closed a cross-site request forgery hole in the admin `/_gina/*` control endpoints (#B384), present in every release up to and including 0.6.9. These endpoints authorise callers by IP allowlist alone (`app.json` `admin.allowFrom`, loopback by default) and a browser attaches that ambient credential automatically, so an operator browsing from an allowlisted machine could be lured to a page that silently issued writes to `/_gina/storage/gc`, `/_gina/cache/clear`, `/_gina/release/rebuild` or `/_gina/maintenance`. The first three read their whole input from the query string and never read a body, so the attack needed no JavaScript and no CORS involvement at all: a plain auto-submitting form was enough. A cross-origin write to any `/_gina/*` endpoint is now refused with 403 on both engines, consulting `Sec-Fetch-Site` where the browser sends it and comparing `Origin` against the connected authority otherwise, never against a forwarded header. Two things are deliberately unaffected: requests carrying no browser origin signal (curl, the gina CLI, deploy scripts) still work, so operator tooling is unchanged; and safe methods (GET, HEAD, OPTIONS, TRACE) are untouched, so the Inspector cross-origin SSE and GET channels keep working. No configuration change is required.'
