kind: Security
body: 'Absolute URLs built by an application-level `getRoute().toUrl()` no longer inherit another request''s proxy context. After one request carrying a port-less `Host` (an orchestrator probe, a sibling-bundle call, any client sending `Host: name` with no port) had reached a worker, every later direct request on that worker built its URLs from a worker-global: on an http/1.1 bundle the port vanished, and on an http/2 + https bundle the last port-less client''s host was emitted verbatim — a host the client chooses, so a host-header-injection class for application-built links and redirects. `getRoute()` now resolves the proxied classification and proxy hostname from the request itself, through a per-request store the server enters on every request in every log mode; only req-less callers (boot, CLI, cron) still read the worker-global. The router''s classification defers to isaac''s pre-port-strip stamp, so direct requests no longer rewrite the worker-global, and isaac''s port-less scheme chain matches the router''s (X-Forwarded-Proto, then the proxy scheme, then the bundle''s own). On earlier versions, `server.proxy.requireForwardedHeaders` closes the port-less-Host path only — it never gated `X-Forwarded-Host`, so a client with direct reach to a bundle could still supply the host; the complete interim there is a fronting proxy that overrides both headers before the bundle. Pickup: a bundle restart and a re-bake — the client bundle''s bytes change although its behaviour does not. (#B502)'
