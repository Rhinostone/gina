kind: Changed
body: 'Dialogs opened via the new `data-gina-dialog` API default to non-modal (the native `<dialog>.show()` path). Set `data-gina-dialog-modal` on a trigger, or `gina.config.popin.modal: true` project-wide (then opt individual dialogs out with `data-gina-dialog-modal="false"`), to make them modal. Legacy `data-gina-popin-*` popins are unaffected and still open modal. Non-modal dialogs ship the accessibility affordances that native `showModal()` provides for free but `show()` does not — Escape-to-close, body scroll-lock, background inert, and initial focus — plus native open/close and backdrop transitions via `@starting-style` and `transition: ... allow-discrete` (replacing the Safari repaint hack), gated behind prefers-reduced-motion.'
