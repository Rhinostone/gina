kind: Added
body: 'Maintenance mode — a bundle can now be closed to the public without being stopped, via `settings.json > server.maintenance` (#MAINT1). When active, every request EXCEPT the `/_gina/*` family is answered `503` with `Retry-After` and `Cache-Control: no-store`, carrying a self-contained maintenance page for a browser navigation and the framework''s standard `503` JSON body for XHR / SPA-fragment / json-only callers. The gate runs on BOTH engines, placed after every `/_gina/*` handler and before the webroot filter, static-asset serving, both render/output-cache serve points and routing — so unlike a route middleware (which only runs once a route has matched) it also covers static assets and unmatched URLs. `/_gina/health/check` deliberately keeps answering 200 so an orchestrator does not restart pods over a declared window. Config is `{enabled, retryAfter, message, bypassKey, allowFrom}`; `enabled` must be a strict boolean, every other key falls back per key with a boot warning, and a malformed block never refuses a boot. Two bypasses let chosen visitors through an open window: `bypassKey` (constant-time compare, presented as the `x-gina-maintenance-key` header or once as `?gina-maintenance-key=`, which sets a stateless 12h HttpOnly cookie and redirects to the same URL without the secret) works under ANY topology, while `allowFrom` is honoured only for requests that do not classify as proxied — behind a reverse proxy every socket address is the proxy''s, so an unconditioned IP allowlist would admit either everyone or no one. Flip it at runtime with the admin-gated `GET/POST /_gina/maintenance` (optional `ttlSeconds` dead-man switch); a runtime override is not persisted, and an expired TTL reverts to the configured state rather than to off, so a forgotten timer can never re-open a site that configuration says is closed. Scope is per bundle, so merged-process projects isolate correctly. Server-side only — no browser-bundle change, so pickup is a bundle restart with no re-bake.'
