kind: Added
body: 'controller:remove (and its controller:rm alias) removes a namespace controller from a bundle, but only after a reference-aware safety scan. Because a routing rule that names a namespace with no matching controller file silently falls back to the default controller.js rather than erroring, a bare delete is unsafe: controller:remove scans routing.json (both the rule-level namespace and param.namespace) plus requireController() calls across the bundle, and REFUSES the removal if any still point at the controller, listing each one so you can repoint it first. It never edits routing.json. When clean, it confirms interactively, then deletes the controller file and its templates/html/<name>/ tree. --dry-run previews the plan and any blockers, --force deletes the file even with blockers (leaving the references for you to clean up by hand), and --format=json emits a machine-readable envelope. Offline CLI command — no bundle rebuild.'
