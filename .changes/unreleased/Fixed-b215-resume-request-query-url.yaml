kind: Fixed
body: 'Fixed `resumeRequest()` replaying a halted GET without its query string whenever any URL-path param had been captured: the recomposed route URL only carried query keys declared in BOTH a rule''s `requirements` AND `param` blocks, so a key bound in `param` only (`"mode": ":mode"` with no requirements entry) or an entirely undeclared key (`?returnTo=...`) was dropped from the replay — the replayed request then matched anyway and rendered literal `:key` template paths as a 500, including on the framework''s own `requireAuth` login replay, and the `inheritedData` flash could not heal it because it merges back into `req.get` only AFTER route matching. With a live session the GET replay (plain, XHR and popin flavors alike) now redirects to the byte-exact halted URL, query string included — `pauseRequest()` has always stamped it, so snapshots taken before this fix replay correctly too, and the session key `haltedRequestUrlResumed` now records that exact URL. Session-less custom-storage replays keep the recomposed URL, where the composed query params remain the halted data''s only travel channel. (#B215)'
