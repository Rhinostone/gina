kind: Fixed
body: 'Fixed #B399 — an exception in a controller''s reserved-action hooks (`onReady`, the `setup` controller) could vanish without a response or a visible log line: both dispatch sites invoked the hooks outside the guarded band, so a synchronous throw escaped to the process level (on the built-in engine: uncaughtException killing the whole bundle process; Express answered its own 500 — engine-asymmetric) and an asynchronous rejection was unowned (the request could hang to client/proxy timeout while work after the throw silently never happened). Both hook loops now run inside the dispatch try and every hook''s returned promise is owned with the same `.catch` → 500 guard the main action carries, naming the failing hook in the error detail; the synthesized `setup` wrapper now returns the app call''s own result so an async `setup.js` rejection reaches the guard. Behaviour change: a rejecting or throwing hook now answers 500 (with the #ERRREF correlation ref) where it previously crashed the process, hung, or let the action''s own response mask the failure. The hooks are still dispatched without awaiting, in the same synchronous frame as the action — a hook rejection does not prevent the action from running, so its side effects may already have executed when the 500 reaches the client; treat retries of non-idempotent actions accordingly.'
