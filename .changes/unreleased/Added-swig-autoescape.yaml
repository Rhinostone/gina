kind: Added
body: 'Added `settings.swig.autoescape` (boolean, default false) to opt in to HTML-escaping of Swig `{{ variable }}` output as an XSS defense, mirroring the existing `settings.nunjucks.autoescape` (default true). Swig''s escaping default is unchanged in this release — set the flag to true per bundle to enable it. A non-boolean value now refuses bundle startup, so the security toggle can never be silently mis-typed.'
time: 2026-07-23T05:33:18+01:00
