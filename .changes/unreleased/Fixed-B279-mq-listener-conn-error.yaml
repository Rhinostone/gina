kind: Fixed
body: 'A gina command no longer dies when an MQ speaker disconnects abruptly. Every CLI invocation starts the MQ listener on the shared log port, so commands running side by side connect to one another as speakers. When one of them ended or was killed, the listener still held its connection socket and the next write to it raised EPIPE or ECONNRESET on that socket — which had no error listener, so Node threw the event and took the whole command down mid-run. The failure was silent and looked like the command had simply not done its work: a bundle:add killed this way exited non-zero after registering its ports but before writing the rest of its state, leaving a half-created bundle. Connection sockets now handle their own errors, dropping the departed speaker''s session (an abruptly-killed peer may never emit end, which is what otherwise clears it) and carrying on. The listener-wide error handler was never a substitute: in Node every accepted connection is its own emitter, so it never saw these.'
