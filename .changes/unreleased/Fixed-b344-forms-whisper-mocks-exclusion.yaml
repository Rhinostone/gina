kind: Fixed
body: 'The page whisper no longer exports the forms mocks group (#B344). The RFC5987-encoded page.environment.forms export - parsed by the client loader into gina.forms - now ships the bundle forms catalog minus the mocks group (dev fixture data walked from a bundle forms/mocks/ directory) in EVERY environment, trimming page weight and keeping the client contract uniform across envs; rules and custom validators still ride the whisper unchanged. Server-side surfaces (page.forms, templates, server-side validation, the Inspector forms catalog card) keep the complete catalog, and the shared catalog object is never mutated (shallow copy at export only). ACTION REQUIRED only if your own client code read gina.forms.mocks - the framework client bundle never consumed it; whisper the data yourself from a controller if you need it in the browser. Server-side change: pickup is a bundle restart, no client-bundle rebuild.'
time: 2026-08-24T14:44:18+01:00
