kind: Fixed
body: 'Fixed the optional digit bounds on the `isInteger` validation rule being silently ignored whenever the value reached it as a real number rather than a string: no error was recorded, no warning was emitted, and the field was reported valid. Numbers arrive that way from JSON request bodies — including `validator::{}` routing requirements, which merge the parsed body into the validated data — and from a preceding `toInteger`, so a `toInteger` then `isInteger` chain was affected in the browser too. The bounds now measure the value''s string form, matching the behaviour `isNumber` has always had. This TIGHTENS enforcement: a value that previously slipped past a declared `isInteger` bound now correctly fails, so review any rule declaring `"isInteger": N` or `"isInteger": [min, max]` on a field that can carry a numeric value. Note a negative number counts its sign toward the length, exactly as it already did when the same value arrived as a string. `isString` and `isNumber` are unchanged.'
