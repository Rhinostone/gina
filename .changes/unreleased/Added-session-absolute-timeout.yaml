kind: Added
body: 'Opt-in absolute session timeout — `session({ absoluteTimeout: <ms> })` on the Session plugin, or `settings.json > session.absoluteTimeout` as the deployment default with bundle code winning (`absoluteTimeout: false` disables it). An authenticated session older than the cap — measured from login, the anchor `req.login()` stamps at session-id rotation; manually-bound sessions are anchored one request later — is destroyed on its next request regardless of activity, and the request proceeds with a fresh anonymous session, exactly as a naturally-expired record behaves. Fail-closed: when the record cannot be destroyed the authentication is still dropped. This is the fixed-cap half of session-lifetime control; idle expiry already existed (the cookie maxAge and the store-record TTL both roll with activity) and composes with it. Anonymous sessions are never touched, preserving `saveUninitialized: false` semantics, and without the option the plugin returns express-session''s middleware unchanged. Declared in the published settings.json schema.'
