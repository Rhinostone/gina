kind: Fixed
body: 'Application log lines reach the local MQ listener again when the framework home names another machine — the MQ speaker and file log containers dialled `host_v4` verbatim, so on a `~/.gina` shared across hosts (each host rewriting `settings.json` at boot) or after a stale address was left behind, every runtime log frame was silently shipped off-host while all connection lines read healthy, leaving container logs with only boot output. The two intra-host transports now resolve their dial from the bind side only (`GINA_BIND_HOST`, then `settings.bind_host`): a concrete non-wildcard local bind is dialled, anything else stays on loopback. Pointing `host_v4` at a remote machine to ship logs cross-host was never a supported topology (the listener binds loopback by default) and no longer affects these two clients; `gina tail` and the command socket keep their remote-capable resolution (#B320)'
