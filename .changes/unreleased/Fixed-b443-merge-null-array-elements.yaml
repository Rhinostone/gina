kind: Fixed
body: '#B443 - merge() no longer throws when an id-keyed array carries a null element. typeof null is object, so a null element passed every typeof test and the next property access dereferenced it: seven shapes threw a TypeError across five distinct sites in the array merger - both collection entry guards null-checked only the source operand (a null FIRST target element threw inside the guard itself), both id-roster loops dereferenced every element (a null at any LATER index threw after the guard had passed), the override walk dereferenced both operands per step, and the per-element collection tests null-checked only the target side. Because every configuration overlay and collection merge travels through this lib, any such shape was a whole-merge kill. A null element now behaves like an element with no key: it matches nothing, blocks nothing and contributes nothing, and every previously-working shape is pinned byte-identical by the regression suite. This closes the read-side residual of the 0.6.20 fix, which had guarded the write side only. The browser bundle carries the array merger, so pickup is a bundle restart AND a re-bake.'
