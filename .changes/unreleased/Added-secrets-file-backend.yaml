kind: Added
body: 'Bundle configs can resolve `${secret:KEY}` placeholders from `.env`-style files as well as from the environment. Declare `secrets.file` in the bundle `settings.json` — one path, or an array of them — using the usual config tokens, e.g. `["${homedir}/secrets.env", "${homedir}/${scope}/secrets.env"]`. Files are layered UNDER the environment: a non-empty environment variable always wins, so a Kubernetes secret, a `sops exec-env` invocation or a CI-exported value can never be shadowed by a stale file left on disk. A variable that is set but EMPTY counts as absent and the file fills it — which keeps the common `environment: ["X=${X}"]` passthrough working — and that fall-through warns, naming the key. Within the array, later entries win over earlier ones, so a shared base file and a per-scope file combine. A declared file that does not exist contributes nothing rather than failing, resolution stays fail-closed when a key is in neither source, and a config that does not declare `secrets.file` behaves exactly as before. `lib.secrets` also gains `parseEnv` / `parseEnvFile`, which `secrets:check --env-file` now shares so that the CI gate and the runtime can never disagree about how a file is read. This is a convenience for plaintext and pre-decrypted deployments, not a secrets-management integration: for SOPS, Vault or a KMS, keep decrypting at the container entrypoint so values land in the environment.'
