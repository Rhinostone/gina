kind: Fixed
body: 'A bundle whose project `env.json` carries no configuration block for the environment it starts in now refuses to boot with a message naming the bundle, the environment, the resolved `env.json` path, and whether the file was found at all — instead of dying with an opaque `Cannot read properties of undefined` crash that named none of them. Covers all three shapes that produced the same failure: an `env.json` that is absent entirely, one that is empty, and one that declares only bundles the project manifest does not list. The refusal exits 1 through the same path as the missing `routing.json` refusal, so an external supervisor can retry while a release tree settles. A configuration that boots today is unaffected: the check can only fire where the boot already crashed.'
