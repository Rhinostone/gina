kind: Fixed
body: 'Concurrent `util.promisify(entity.method)` calls on the same entity method no longer cross-deliver results or leave a caller hanging (#B394). The promisify fast-path kept a single scalar callback slot: a second in-flight call overwrote the first, so the first result to arrive was delivered to the last caller to register (one caller receiving another''s record), and the displaced caller''s promise never settled at all — a request left hanging with nothing logged, and a read-modify-write variant that could persist one key''s document under another. The entity-context path already used a FIFO queue with a single persistent dispatch listener; the fast-path now uses the same shape, so every concurrent caller settles and, when the underlying operations complete in the order they were called, each caller receives its own result. When operations can complete out of call order, results are still paired by arrival order — give such a method true per-call identity by returning a Promise instead of emitting its trigger (see the Models guide''s concurrency note). Server-side only; pick it up with a bundle restart.'
