kind: Added
body: 'Opt-in client-side navigation module `gina/nav` (#SPA1): a page carrying a `data-gina-nav` region gets SPA-style navigation — same-origin link clicks whose URL first-matches a route declaring `negotiate: true` are fetched as layoutless fragments (`X-Gina-Navigate: fragment` + `X-Requested-With`) over a fresh XHR per navigation, swapped into the region with history/scroll/focus handling, fragment script re-injection, validator form rebinding and an optional `data-gina-nav-title` document title; every uncertainty (non-2xx, timeout, an un-negotiated answer, JSON redirects) falls back to a normal full-page navigation, links owned by the link/popin plugins are never touched, and a page without the marker stays byte-identical.'
time: 2026-08-02T16:08:26+01:00
