kind: Fixed
body: 'An `Error` passed to a log method now renders with its message, stack, own properties and `cause` chain (#B434). Both stdout writers routed any object argument through an enumerable-properties walk, and an Error''s `message` and `stack` are non-enumerable — so `console.error(err)` printed `{}` (or only the enumerable extras, such as `{"code": "ETIMEDOUT"}`), silently dropping the one thing the line was written to report. Errors — including ones minted in another realm — now render the way Node''s own console does, at the top level, nested inside a logged object or array, and on the raw `console.log` path alike; the rendered message still passes through log redaction. Every non-Error argument renders exactly as before, and passing `err.stack` as a string keeps working unchanged.'
