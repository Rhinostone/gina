kind: Fixed
body: 'A throw inside one of the listeners that parse a `multipart/form-data` request is answered as a `500` instead of ending the bundle. The `field`, `file` and `finish` listeners ran with no `try`, so an exception raised in one reached the process as an `uncaughtException` and the bundle exited (code 143) on Node.js 22. On Node.js 24 and later the outcome depended on the listener: an exception in the `field` listener was forwarded to the parser''s error listener, which answered a misleading `400` for a body that was not malformed; one in the `file` listener, raised where the file''s write stream is created, was answered that `400` and the bundle then exited; one in the `finish` listener got no answer and the bundle exited. The listeners are now wrapped — `busboy.on` is overridden in place for those three registrations and given back before the request is piped, so their registration is unchanged — and a throw is answered through `throwError()` with the same `500` `Could not evaluate <METHOD> request data.` on every supported Node version (JSON for an XHR or API request, the bundle''s own error page for an HTML one), with an incident ref and one error-level log line that pairs the ref with the stack. A genuinely malformed `multipart/form-data` body still answers `400`. The callbacks nested inside a file part run under the same wrapper (#B844): the `error` and `finish` handlers of the temporary file''s write stream, its close callback, the `end` handler of the file stream and the callback of the `autoTmpCleanupTimeout` timer. They ran outside it, so an exception raised in one of them ended the bundle on Node.js 22, 24, 25 and 26; a request that carries a file is handed to its action from the close callback, so the same exception that was answered `500` for a body without a file ended the bundle for a body with one. Such an exception is now answered with the same `500`, or logged with its stack when the request is already answered (a write error answers its own `500`; the cleanup timer runs after the answer). The guard''s own log line writes the exception message with its control characters as visible escapes. No input is known to raise such an exception today: the guard is a net, the companion of the request-data parse guard, and what it catches is logged so that its cause is fixed. Both engines. Restart the bundle; nothing to re-bake (#B843).'
