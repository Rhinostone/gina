body: 'The boot error of an https bundle that cannot read its certificates is spelled correctly: « You are trying to start a secured server (https) without sufficient credentials », where it read « wihtout suficient », so the troubleshooting guide''s quote of it now matches the log. A log search or alert written for the old spelling no longer matches. (#B903)'
