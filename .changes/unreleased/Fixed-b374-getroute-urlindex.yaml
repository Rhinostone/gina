kind: Fixed
body: 'lib.routing.getRoute(rule, params, urlIndex) composes the url that urlIndex names on a rule with several urls, the urlIndex a forward route declares in param.urlIndex included: when a value filled a placeholder, the first url was used whatever urlIndex said. A urlIndex that names no url of the rule (5 on a rule with two urls, -1, a non-integer) now throws an error naming the rule and its number of urls, where it composed undefined; a forward route answers it through throwError(). A numeric string such as "1" is accepted, and a rule with a single url still ignores urlIndex. (#B374)'
