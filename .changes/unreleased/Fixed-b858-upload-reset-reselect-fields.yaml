kind: Fixed
body: 'After a staged upload is reset, the next file chosen in the same input is posted again. The hidden `<name>[i][…]` inputs that carry a staged file''s metadata were built only for the input''s first selection; a reset removed them from the form, so the next selection was staged and previewed but the save posted no file, and a later selection with more files than the first got no inputs for the new ones, which the save dropped. The inputs are now built on every selection. The declared `[preview][*]` inputs, and any other `<name>[i][…]` input of the page, that a reset or a delete removes come back, empty, with the next selection, so a form that declares the preview posts the new file''s. A page that removes the virtual upload form after a reset, to work around this, keeps working. Browser-bundled: rebuild bundles to pick it up (#B858).'
