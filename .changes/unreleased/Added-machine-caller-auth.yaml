kind: Added
body: 'Machine-caller authentication for app routes (MS3): a request presenting `Authorization: Bearer <key>` matching a caller named in `settings.json > auth.machine.callers` now passes the authorization gate without a session — it satisfies `requireAuth`, its configured roles match route `roles` exactly like a session user''s, and route policies receive it as `{ name, roles, machine: true }`. Session wins when both are present. Strictly opt-in and fail-closed (`auth.machine.enabled` defaults false; the boot lint refuses malformed shapes); keys support `${secret:KEY}` placeholders and are compared in constant time against boot-computed sha256 hashes — raw keys are not retained after boot. A presented-but-invalid key gets a clean 401 with `WWW-Authenticate: Bearer` (never the login bounce); audit records carry the caller name as the actor key plus `machine: true`, and `self.hasRole()` answers the caller''s configured roles.'
