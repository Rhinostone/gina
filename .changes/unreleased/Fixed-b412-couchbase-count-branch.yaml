kind: Fixed
body: 'The couchbase connector no longer hangs a request when a `@return {number}` COUNT query does not match its alias parser (#B412, consumer-reported). The branch parsed the COUNT alias out of the query text and dereferenced the match without a guard, so `SELECT COUNT(DISTINCT a.b) AS n` (the pattern could not span the space inside the parentheses) and an unaliased `SELECT COUNT(*)` both produced a null match and threw. Because the throw happened inside the connector''s own result callback, the failure did not surface as a 5xx: a promisified caller never settled and the request hung until the client or proxy timed out, leaving only an uncorrelated log line, and behind an HTTP/2 inter-bundle client the stall was then retried. It was also invisible in development, where only the first comment block is stripped from the query text, so a commented-out parsable COUNT elsewhere in the file kept the parser satisfied locally while production - which strips every comment - threw on the identical file. The branch now derives the count from the first projected column with no regex at all, guarded against empty result sets, empty rows and null payloads, exactly as the mysql, postgresql, scylladb and sqlite connectors already did and as the documented contract (first key of first row) already stated. Also fixed on the same path: the `@return` annotation parser was greedy, so a second brace pair later on the same line over-captured (`@return {object} note {x}` yielded `object} note {x`) and the resulting unknown return type fell through every branch silently, handing the caller the raw row array instead of the declared shape; it is now bounded to the first brace pair like the sibling connectors. Behaviour change worth knowing: for a multi-column projection whose COUNT is not the first column, the returned value is now the first column rather than the aliased one - consistent with every other connector.'
