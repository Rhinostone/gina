kind: Fixed
body: 'A reset now removes the inputs of a staged file whose upload input sets `data-gina-form-upload-prefix`. It removed the inputs named after the input''s `name`, so the `<prefix>[i][…]` inputs stayed in the form after the server had been told to remove the staged file, and the save posted a file that was no longer there. Browser-bundled: rebuild bundles to pick it up (#B862).'
