kind: Added
body: 'Size tiering for the storage layer. Objects strictly under a driver''s inlineThreshold (a unit-suffixed string, default "64KB"; "0B" disables it per driver) are stored inline in the metadata store in a single transaction instead of the file tree — measured 2.7-13x faster than per-file writes at and below the default threshold. Keys keep the same shape in both tiers, stat() and release() behave identically, resolve() answers {kind:''inline''} for tiered objects, and capabilities.inline says whether a driver tiers. Changing the threshold affects only new writes: existing objects stay readable on either side, and a metadata database created before tiering is migrated in place. Two tradeoffs to know: sub-threshold objects are not individually visible on disk, and the metadata store now carries their bytes — losing it loses those objects, so back it up with the driver root (the embedded database already lives inside it).'
