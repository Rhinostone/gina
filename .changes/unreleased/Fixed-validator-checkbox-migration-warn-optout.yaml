kind: Fixed
body: 'FormValidator #B125 — the #49 checkbox migration warnings now name the payload-only remedy and can be silenced with an explicit form-level declaration. The tick-direction warn false-positived on legitimate post-#49 markup (a checkbox authored `value="true"` with no `checked`, intended to render unticked) where neither listed remedy applied. Both warn messages now name the measured third remedy — remove the `value` attribute; a boolean-classified checkbox posts its live checked state either way — and an explicit `data-gina-form-checkbox-value-as-state="false"` on the form declares the current state model and silences the migration warnings for that form (any explicit value counts; "false" is otherwise behavior-inert). Browser-bundled: consumers pick the change up at their next bundle re-bake.'
