kind: Security
body: 'Added `gina.plugins.XFrameOptions({ value })` — opt-in middleware that emits the `X-Frame-Options` response header on every response to defend against clickjacking (#HDR2). Controls whether the page may be rendered inside a `<frame>`, `<iframe>`, `<embed>` or `<object>`. Two valid values per RFC 7034: `DENY` (page may never be framed, even by same-origin pages) and `SAMEORIGIN` (default — page may be framed only by same-origin pages). Settings: `xFrameOptions.value` (defaults to `SAMEORIGIN`). Caller options always win over settings; values are normalised to uppercase (so `"deny"` is accepted and emitted as `DENY`). The legacy `"ALLOW-FROM <uri>"` value is rejected at factory call time with a dedicated error pointing at the modern `Content-Security-Policy: frame-ancestors` replacement — modern browsers ignore ALLOW-FROM (Chrome / Edge / Safari never honoured it cross-vendor, Firefox dropped it in 70). Invalid values throw at factory call time with a clear error listing the expected tokens (mirrors the #CSRF1 SameSite=None+Secure invariant and the planned #HDR4 preload-list invariant — fast-fail at bootstrap). Idempotent — if an earlier middleware already set the header, the existing value is preserved and `next()` is called immediately (first-writer-wins, safe to stack with helmet-style upstream gates). Files: `core/plugins/lib/x-frame-options/{src/main.js, package.json, README.md}`, registered in `core/plugins/index.js`. Settings template seeds `xFrameOptions: { value: "SAMEORIGIN" }` with the comment header explaining the default + the ALLOW-FROM rejection. Boilerplate `core/template/boilerplate/bundle/index.js` advertises the adoption example alongside the #HDR1 example. 51 unit tests in `test/core/x-frame-options-plugin.test.js` (full suite 5518/5518, prior 5467 + 51). Second of the four Phase 1 plugins on the `#HDR` Web Security Headers track; introduces the throw-on-invalid pattern that #HDR3 and #HDR4 will mirror.'
