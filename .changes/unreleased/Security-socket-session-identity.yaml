kind: Security
body: 'An engine.io socket''s session identity is now derived SERVER-side instead of being asserted by the client (#B365). The socket''s `sessionId` — the value every targeted `self.push()` matches against — used to be set from `payload.session.id`, a field the browser sends, on every message, never checked against the connection''s own session. Any client could therefore claim another user''s session and receive the pushes addressed to it; and because a rendered page carries the BARE session id in its bootstrap script while the cookie carries the signed form, claiming one required strictly less than stealing the cookie. Affects every published release that attaches `server.ioServer`. The binding now happens once, at connection, from the upgrade request''s own cookie: gina replays the bundle''s OWN session middleware over that request, so the same secret, store and cookie name apply with no new configuration and no framework access to the secret — and it works whether or not the bundle adopted `gina.plugins.Session()`. The response handed to that middleware is inert, so a socket upgrade can never emit `Set-Cookie` or persist a session. It fails CLOSED: no session middleware, no cookie, or a cookie that does not verify leaves the socket with no id, and an id-less socket matches no targeted push — it receives only deliberate broadcasts. A client that still asserts an id is logged and ignored, which doubles as an impersonation detector. This is the receiver half of the axis #B364 left open: that fix decided who a SENDER may aim at, this one decides how a RECEIVER proves who it is.'
