kind: Added
body: 'image:list and image:rm — inspect and remove OCI images on the container host image:build targets. Both resolve the host with image:build''s own precedence (GINA_CONTAINER_HOST env override, then native buildah, then the container.host setting), so image:list always shows what image:build would build onto. image:list prints an aligned table or --format=json ({ host, images: [{ ref, id, size, created }] }); an untagged image reports <none>:<none> and a multi-tagged image yields one entry per tag. image:rm takes an explicit image reference or id (--force removes one a container still references); there is no bulk delete, and the reference is charset-gated before it reaches the host'
