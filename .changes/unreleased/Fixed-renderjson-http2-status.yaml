kind: Fixed
body: 'The `status` key in a `renderJSON()` payload now reaches the wire over HTTP/2: the body path built its header frame with a hardcoded `:status: 200`, so every JSON error rendered on a genuine HTTP/2 stream was served as HTTP 200 with the error payload in the body (HTTP/1.1 was unaffected; the HEAD branch and the HTML delegates already honoured the resolved code). The `errno` half of the status branch is also guarded like its swig/v1 siblings: an `errno`-only payload with no usable `status` used to poison the status code — the response was silently never sent on HTTP/1.1 and turned into a 500 on HTTP/2 — and is now served as a normal 200 with the payload in the body.'
time: 2026-07-30T02:28:36+01:00
