kind: Fixed
body: 'The `{% extends %}` extraction no longer overruns its own directive. Both quantifiers were greedy, so a one-line directive followed by another quoted tag ran the directive match to the last closing delimiter on the line and the quoted-path match to the last quote, producing a corrupted layout path that matched nothing — the layout-cache re-point then silently never happened and the page extended the raw layout. Both quantifiers are lazy, so the extraction stops at the directive it came from. (#B484)'
