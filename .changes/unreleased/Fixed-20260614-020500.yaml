kind: Fixed
body: 'When a ${secret:KEY} placeholder cannot be resolved during config load, the framework now logs the failing key name and the bundle/environment config path at debug level, so operators can pinpoint which secret is unset. Previously the load failed with a generic "Secret resolution failed" message that named neither the key nor the bundle. The propagated error message still intentionally omits the key.'
