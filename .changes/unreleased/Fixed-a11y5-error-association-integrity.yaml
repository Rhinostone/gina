kind: Fixed
body: 'Validation messages stay reachable to assistive technology while they are hidden from view. gina hides a committed error''s message whenever the field it belongs to regains focus, but it kept `aria-invalid="true"` asserted on that field — so the `aria-errormessage` association pointed at an element that `display: none` had removed from the accessibility tree, announcing a field as invalid with no retrievable reason. Both hide paths now clip the message out of view instead of out of the tree, and the `.hidden` class is still applied so consumer CSS keyed on it keeps matching. Re-announcing the same error also works now: a polite live region ignores a byte-identical rewrite, so blurring a field that still fails the same rule announced nothing the second time. Finally, moving focus to the first invalid field no longer stops on a control that cannot take focus — every element has a `focus` method, including a custom element with neither `tabindex` nor `delegatesFocus` whose `focus()` does nothing, so the search now confirms focus actually moved and continues otherwise.'
