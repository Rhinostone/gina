kind: Fixed
body: 'A Couchbase N1QL query parameter the SDK cannot serialize no longer aborts the whole bundle process (#B243). The SDK maps JSON.stringify over the parameter list, and for a bare `undefined`, a function, or a Symbol that yields no string at all; the native driver then coerces it to an empty string, fails to parse it as JSON on an internal thread and calls abort() — which no try/catch, uncaughtException or unhandledRejection handler can intercept, so the bundle died outright instead of the request failing with a 500. The most reachable case needed no misuse of the driver: a query method called one argument short with a trailing callback put the CALLBACK itself into a parameter slot, and the arity check could not catch it because it only fires when the last argument is not a function. The connector now refuses an unserializable parameter before dispatch and surfaces a TypeError (code GINA_COUCHBASE_UNSERIALIZABLE_PARAM) naming the offending position and the likely cause, routed through the query callback when there is one and thrown otherwise. Serializable values are untouched: null, 0, empty strings, false and objects carrying undefined properties all still reach the SDK unchanged.'
