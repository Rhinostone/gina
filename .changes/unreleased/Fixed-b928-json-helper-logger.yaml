kind: Fixed
body: '`gina-container` and `gina-init` accept a trailing comma in a JSON file they read, with a warning, as `requireJSON()` and `parseJSONWithComments()` document: a `manifest.json` with one stopped `gina-container` with « manifest.json cannot be used », and `requireJSON()` threw on a malformed file where it logs `emerg` and exits. In every gina process, a trailing comma in `~/.gina/<version>/settings.json` no longer loses its `log_level` while the logger starts, and one in `~/.gina/user/extensions/logger/default/config.json` no longer keeps the logger from loading. Cause: `lib/logger` loads the helpers before it sets its exports, so `helpers/json` had kept the logger''s empty first exports; it now reads the logger when it is called, and while the logger is still loading its warning goes to Node''s console. (#B928)'
