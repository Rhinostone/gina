kind: Fixed
body: 'The query() basic-auth option is now honoured on HTTP/2 — and can no longer leak. `options.auth` ("user:password") was consumed by node''s own request() on HTTP/1.x only; on the HTTP/2 path the option-copy loop forwarded it into the outgoing header block as a literal `auth:` header (the strip set did not list it) and no `Authorization` header was ever minted, so the credential travelled in a nonstandard header while authentication silently never happened. The option is now minted into `Authorization: Basic <base64>` before dispatch on BOTH transports through one code path — a caller-supplied authorization header always wins, matching node''s HTTP/1.x behaviour — and the option itself is deleted pre-dispatch (and listed in the HTTP/2 strip set as a belt), so an empty or malformed credential cannot travel as a header either. If anything downstream relied on receiving the literal `auth:` header on HTTP/2, that was the defect, not a contract. (#B465)'
time: 2026-09-03T17:18:17+01:00
