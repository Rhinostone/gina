kind: Added
body: 'The MQ log speaker now reconnects on its own. It previously dialled the listener exactly once, ever, so anything that ended that connection — a daemon restart, an OOM-killed listener, a container probe — left the bundle logging nowhere, with no error after the first and nothing in the logs to say so. It now redials when the connection closes, backing off exponentially to a 30 second ceiling, and logs a `reconnected` notice when it recovers; a failure is reported once per outage rather than once per attempt. The retry timer is unreferenced, so short-lived CLI processes still exit immediately instead of waiting out a backoff. Frames emitted while the transport is down are dropped rather than queued, which keeps memory bounded during a long outage — the `default` flow still carries those lines to stdout.'
