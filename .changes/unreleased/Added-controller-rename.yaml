kind: Added
body: 'controller:rename renames a namespace controller in place, rewriting the structured references to the old namespace so nothing dangles. It moves controllers/controller.<old>.js to controller.<new>.js, moves the templates/html/<old>/ tree, and rewrites the old namespace at the two sites it can do safely: the routing.json namespace values (both the rule-level namespace and param.namespace, via anchored comment-preserving string edits — comments and ordering survive) and every requireController() call. Unlike controller:remove, rename DOES edit routing.json, but only those values. A full plan is shown first, then it confirms interactively before applying all-or-nothing (snapshot-guarded rollback on failure). Anything a static rewrite cannot resolve — a variable namespace, a non-literal requireController() argument, or the cosmetic controller class name — is REPORTED for you to fix by hand, never rewritten. --dry-run previews, --force applies without the prompt, and --format=json emits a machine-readable envelope. Offline CLI command — no bundle rebuild.'
