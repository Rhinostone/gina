kind: Security
body: 'self.push() chose its recipient from the request body, so a caller could aim a push at any session by sending a session id — and omitting that id broadcast the payload to EVERY connected client. The payload itself also defaults to request input, so on any route that reaches push() an unprivileged caller could deliver arbitrary content to every connected socket, or to a chosen victim''s socket. This affects every release up to and including 0.6.7. The recipient is now decided server-side: an explicit option.sessionID wins, otherwise the payload goes to the caller''s own session; with neither a resolvable session nor a deliberate { broadcast: true }, push() now sends nothing and warns, where it previously fell open to everybody. The request body can no longer influence the recipient at all. A type guard that compared a negated constructor name against a string — always false, so it had never once skipped a non-socket entry — was corrected in the same pass. ACTION REQUIRED: if your bundle exposes any route that calls push(), treat prior traffic as untrusted and review it; callers that relied on the request body choosing a recipient must pass { sessionID } explicitly from server-side state, and callers that relied on the implicit fan-out must now pass { broadcast: true }.'
