kind: Fixed
body: 'self.push() now delivers, and its recipient is decided server-side. Two defects shipped together and had to be fixed together: the send site referenced an identifier that exists nowhere in scope, so every call threw before sending — push() had never delivered a packet in any published release — and the recipient was read from the request body, where an absent session id meant "send to every connected client". Repairing only the first would have turned a dormant design flaw into a live broadcast primitive any caller could aim, so the recipient contract changes in the same commit: an explicit option.sessionID wins, otherwise the payload goes to the caller''s own session, and reaching every client now requires a deliberate { broadcast: true }. With neither a resolvable session nor an explicit broadcast, push() sends nothing and warns, where it previously fell open to everybody. The request body can no longer choose recipients at all. A type guard that had never once skipped a non-socket entry — it compared a negated name against a string, which is always false — was corrected in passing. Nothing was exposed by this in a release: the API could not send, so there is no vulnerable version to upgrade away from, and because it never delivered, the new recipient contract cannot break existing callers.'
