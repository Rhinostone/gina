kind: Security
body: 'self.push() chose its recipient from the request body, so a caller could aim a push at any session by sending a session id — and omitting that id broadcast the payload to EVERY connected client. The payload itself also defaults to request input, so on any route that reaches push() an unprivileged caller could deliver arbitrary content to every connected socket, or to a chosen victim''s socket. This affects every release up to and including 0.6.7. The recipient is now decided server-side: an explicit option.sessionID wins, otherwise the payload goes to the caller''s own session; with neither a resolvable session nor a deliberate { broadcast: true }, push() now sends nothing and warns, where it previously fell open to everybody. The request body can no longer influence the recipient at all. A type guard that compared a negated constructor name against a string — always false, so it had never once skipped a non-socket entry — was corrected in the same pass. ACTION REQUIRED, and read this before upgrading if you push at all: any route that called a bare self.push() and relied on the request choosing the recipient now resolves to the caller''s own session, so a push driven over an HTTP hop by a background worker — a job runner reporting progress to the user who queued it, threading that user''s session id through the request — stops delivering and warns instead. That pattern is exactly the vulnerability, so it cannot be preserved; but be aware the framework does not yet offer a sanctioned replacement for it. push() is reachable only from a live request-bound controller (it returns early once the request is released) and nothing else can reach the socket set, so there is no in-process call a worker can make instead. Until an explicit out-of-request push channel exists, out-of-request progress must go through polling GET /_gina/jobs/:id, or through a transport your application owns. In-request callers are unaffected unless they depended on the implicit fan-out, which now needs { broadcast: true }.'
