kind: Fixed
body: 'Fixed the rule engine conflating loosely-empty values with the empty string: five sites tested emptiness with loose equality, and since `0`, `-0`, `false` and `[]` all compare loosely equal to `''''`, those values rode the empty-value bypass. Concretely, `isEmail`, `isJsonWebToken` and `isFloat` reported such a value as VALID outright — a JSON body carrying `{"email": 0}` passed email validation — and the digit bounds on `isInteger` and `isNumber` were skipped for the number zero (for `isNumber` even the string `"0"`, which its entry cast turns into a number). All five sites now compare strictly, so only the literal empty string bypasses — exactly what the designed contract (an empty value is adjudicated by `isRequired` alone) always meant, and that contract is preserved byte-for-byte: an empty string behaves precisely as before on every rule. This TIGHTENS enforcement: review fields ruled `isEmail`, `isJsonWebToken` or `isFloat` that can legitimately receive a numeric or boolean value from a JSON body, and bounds-carrying `isInteger`/`isNumber` fields that can receive zero. `isString`, `isInList`, `isDate` and the `is` condition rule are unchanged.'
