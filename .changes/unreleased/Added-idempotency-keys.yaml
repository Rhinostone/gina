kind: Added
body: 'Idempotency keys (#FIN6): opt-in Idempotency-Key request deduplication at the router band, per the IETF draft. Arm it with settings.json server.idempotency (a declared kv namespace + keyField) and opt routes in with routing.json top-level idempotency true (or required true to answer 400 when the header is missing). The first request bearing a key reserves the operation and executes; its rendered JSON response is recorded, and a retry with the same key and payload is answered with the recorded response plus Idempotency-Replayed true. A duplicate while the original is in flight gets 409 + Retry-After; the same key with a different payload gets 422. Anonymous callers are skipped (a stored response never crosses principals), 5xx and oversize responses release the reservation so retries re-execute, and the dedup scope follows the kv namespace backend (memory per process, redis/sqlite replica-shared).'
