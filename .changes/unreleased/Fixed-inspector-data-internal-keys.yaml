kind: Fixed
body: 'Inspector Data tab no longer lists the framework-internal `__ginaFlow` and `__ginaQueries` transport keys. They are embedded in JSON responses in dev mode only, so a calling bundle can merge the upstream query log and timeline, and they are already shown first-class by the Query and Flow tabs — but they also appeared as top-level rows in the Data tree, in raw-JSON mode and in the download dialog. Any root key prefixed `__gina` is now hidden across every Data tab surface, including the payload size badge, which measures what the tab actually displays. Nested keys carrying the prefix are treated as application data and stay visible, and the response body on the wire is unchanged.'
time: 2026-08-11T23:13:44+01:00
