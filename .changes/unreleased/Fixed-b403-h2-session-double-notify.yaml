kind: Fixed
body: 'Fixed #B403 — an HTTP/2 transport failure could be answered twice: the app callback received the typed error from the stream-level delivery while the SESSION error handler independently answered the same request through `throwError`, racing graceful degraded-mode handling (the framework 500 could reach the wire before the app response) — and on a reused session the handler could answer with the CREATING request context, since session listeners bind once at connect. The session-level answer is retired: session cleanup and logging stay, and request notification is owned solely by the stream-level deliveries (request error/close/end typed terminals), which fire for every live stream when a session fails. With a Node-style callback, a connection failure now notifies exactly once; HTTP/1.1, which has no session layer, already behaved this way.'
