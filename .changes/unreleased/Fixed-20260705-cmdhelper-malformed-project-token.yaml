kind: Fixed
body: 'CLI: an @<project> token starting with a character outside [a-z0-9_.] (an uppercase letter, a dash, or a bare @) was silently ignored by the shared command bootstrap — the command then ran against the current-directory project or all projects with exit code 0, and a mutating task like bundle:add could target the wrong project while reporting success. Such tokens are now rejected with the standard `is not a valid project name` error and exit code 1, across all command groups.'
time: 2026-07-05T20:55:58+01:00
