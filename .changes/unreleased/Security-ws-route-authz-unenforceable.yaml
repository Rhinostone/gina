kind: Security
body: 'A `method: "ws"` route that declares `param.requireAuth`, `param.roles` or `param.policy` now refuses to boot. A WebSocket handshake is answered by the engine''s extended-CONNECT handler and never reaches the authorization gate, so those keys could never be enforced — yet the route linted clean, started, and was counted in the "Registered N authorization-gated route(s)" boot line, actively confirming protection that did not exist. Authenticate inside the `wsHandler` instead: it receives the full request and can inspect headers and cookies before accepting the socket. Relatedly, `auth.requireAuthByDefault` no longer counts WebSocket routes among the routes it gates, and names them at boot instead, since the mode cannot reach them either. ACTION REQUIRED: a bundle declaring an authorization key on a ws route will not start until the key is removed.'
