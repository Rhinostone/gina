kind: Added
body: 'Soak probes for the Couchbase metadata store behind the object-storage layer now ship in the package, at `script/soak/storage-couchbase/` — beside the existing `couchbase-soak.js`, and operator-invoked in the same way. They exist because the unit suite drives a fake SDK that pattern-matches statement shapes without ever parsing N1QL or evaluating a compare-and-swap, so a whole class of defect is invisible to it: a reserved word in a statement reached a release that way. `probe-cas.js` needs no framework code at all and reports the error class a stale-CAS `mutateIn` actually raises on your server, using two genuinely separate connections and a fresh-CAS positive control so a throw cannot be mistaken for a bad path or a missing permission. `probe-store.js` drives the store itself and covers an identical-put storm (run it cross-process for the real case), zero-reference accounting, the barrier race on the CAS claim, and the sweep path near its grace boundary. Everything is configured by environment variable, so nothing is pinned to a particular deployment. Requires a reachable cluster, a bucket and index-create rights; deliberately never run in CI, which has no cluster.'
