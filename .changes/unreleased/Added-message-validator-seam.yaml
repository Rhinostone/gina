kind: Added
body: 'Message-schema validation seam (#FIN3): routes can now run the raw request body through an application-supplied validator before the controller action. Declare param.messageValidator: "<name>" on a route and ship a factory module at message-validators/<name>.js — the factory runs once at bundle boot (compile your XSD or open your sidecar pool there; a broken module refuses the boot instead of silently skipping validation), and the returned validate(document, req) function — sync or async — receives the verbatim body string on every matching request. Return { valid: true } to proceed, or { valid: false, status, errors } to refuse: 422 by default (schema-invalid, with your errors array forwarded on the response body), 400 for a document that does not parse at all, or 503 with an optional retryAfter when the checker itself is unavailable. A thrown error fails closed as a 500 — a request never proceeds unvalidated. The framework ships no schema engine and takes on no XML or JSON-Schema parser surface: the validator is yours (an XSD library, a Schematron sidecar, a JSON-Schema engine), the hook, ordering and refusal shape are gina''s. The gate runs after authorization, rate limiting and idempotency, and before DTO field validation; routes without the declaration are byte-identical.'
