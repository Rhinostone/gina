kind: Added
body: 'Added gina framework:update to reconcile the local ~/.gina state files (main.json def_framework and the frameworks list, plus the per-version settings.json) to the installed framework version. It runs as a dry run by default; pass --fix to apply, --to-version=<v> to target a specific version, or --format=json for machine-readable output. A strict-semver guard never regresses the recorded version, and the per-version metadata maps stay owned by framework:init. This automates the post-merge state check that previously had to be performed by hand.'
time: 2026-06-20T13:35:00+01:00
