kind: Security
body: 'Added gina.plugins.XXssProtection() — opt-in middleware that emits the literal header X-XSS-Protection: 0 on every response, DISABLING Chrome legacy XSS auditor (#HDR10). Phase 1.5 (helmet-parity gap-fill) continues. The value "0" is deliberate — not a typo. Chrome XSS auditor itself had its own vulnerabilities (cross-site information disclosure); MDN recommendation is to DISABLE rather than enable. Use Content-Security-Policy (#HDR5) with a strong policy for the actual XSS defense; this header is defense-in-depth + helmet-parity narrative only. Browser status in 2026: Chrome dropped the auditor in v78 (2019); Edge follows Chrome; Firefox / Safari never implemented; IE11 honoured but is EOL — effectively a no-op header in modern browsers. No tunable options (mirrors helmet no-opts shape + the #HDR1 XContentTypeOptions plugin shape). Idempotent — first-writer-wins via res.getHeader; if an upstream middleware accidentally emits the unsafe "1; mode=block", this plugin does NOT override it (mount BEFORE the upstream to win). 37 unit tests in test/core/x-xss-protection-plugin.test.js including a negative-invariant lock pinning HEADER_VALUE is NOT any "1" variant + a string-not-number "0" emission lock + an idempotency assertion against upstream "1; mode=block" preservation.'
