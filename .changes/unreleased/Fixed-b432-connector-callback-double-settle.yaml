kind: Fixed
body: '#B432 — an entity query callback is no longer invoked twice when the callback itself throws. The sqlite, mongodb and scylladb connectors delivered a result by calling your callback inside a `try` (sqlite, whose driver is synchronous) or inside a `.then()` followed by a trailing `.catch()` (mongodb, scylladb). Application callbacks throw for ordinary reasons that have nothing to do with the query — a template error, a null dereference in a handler — and that exception landed in the very error path the connector had set up for driver failures, which called the same callback a SECOND time. The consequences are worse than a duplicate: the second call arrives with an Error, so the canonical `if (err) { return next(err); } render(data);` shape runs BOTH branches for one query, and the error it reports is the caller''s own exception dressed up as a database failure — so the misleading message points at the connector rather than at the handler that actually threw. On mongodb a second, narrower path had the same shape: a pipeline file whose `op` is not one of the recognised operations reaches an unknown-op branch that settles inside a `try` whose `catch` settled again, and nothing validates `op` against the recognised list at load time, so any typo installs the method and reaches it at query time. Every settle now runs through one per-call guard that delivers at most once and reports a callback exception (tagged with the query trigger) instead of replaying it; a native Promise resolver was never affected, because a promise settles once. Not affected, measured: mysql, postgresql, duckdb and the AI connector. The same shape was present in the session stores, where the callback belongs to express-session: every store method (couchbase v3 and v4, mongodb, redis, scylladb, sqlite) now wraps its callback in the same guard at entry, so a throwing session callback can no longer be re-invoked by the method''s own error path. The async-job stores (mongodb and sqlite) are guarded the same way, and there the misdelivery read as a data problem: a callback that threw while the SQLite store was handing a record back came home to the caller as `could not parse job record`, blaming the stored data for the handler''s own exception. The mongodb and scylladb connectors carried the shape on their connection-ready path, and there it was worse than a duplicate: the ready handler is the model layer''s boot continuation, so an exception thrown downstream at boot — while your models load, for instance — rejected the connect chain, whose error path re-invoked the handler with a fabricated `Connection failed: <that exception''s own message>`; the fault was reported as a database connection failure, and the connector registry then cached that fabricated failure, with no connection, for the life of the process. The handler is now invoked once and its exception is reported under the connector''s name; a real connection failure still arrives as `Connection failed`. The sqlite connector''s Inspector index listener carried the same shape and is guarded for consistency (its caller has no throwing path today). The storage-store layer follows separately. Server-side only — pickup is a bundle restart, no re-bake.'
