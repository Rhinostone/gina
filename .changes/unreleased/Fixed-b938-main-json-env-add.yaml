kind: Fixed
body: 'Every offline CLI command (all but `bundle:start`) and `gina start` read `~/.gina/main.json` with `require()` as they started, so a `//` comment or a trailing comma left by a hand edit stopped all of them with node''s `SyntaxError`, although `bundle:start` already accepted both. They now read it with `parseJSONWithComments()`: a comment is ignored and a trailing comma is accepted with a warning naming the file, and the step rewrites `main.json` as plain JSON, so neither stays in it. A `main.json` that is still not JSON, or cannot be read, stops the command with exit code 1 and `Error: main.json cannot be used: <reason>`, the reason naming the path, and is left as it was. `env:add <env> @<project>` stopped the same way on a comment or a trailing comma in `~/.gina/ports.json` or `ports.reverse.json`, right after the command had warned about it; it now adds the environment. Each command picks this up the next time it runs; a running framework needs no restart. (#B938)'
time: 2026-10-21T09:59:39+01:00
