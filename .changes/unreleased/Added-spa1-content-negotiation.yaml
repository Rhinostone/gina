kind: Added
body: 'Routes can opt into content negotiation with `negotiate: true` in routing.json (#SPA1). A request that then carries the `X-Gina-Navigate: fragment` header receives that route rendered without its layout — the content region alone — instead of the full page, so a client can fetch a page fragment over the same URL without a second route, a duplicated controller, or a query-string convention. Any other header value, or no header at all, renders exactly as before, so the vocabulary can be extended later without breaking existing clients. A negotiable route always advertises `Vary: X-Gina-Navigate` (appended to any existing Vary, never replacing it) so shared caches know the URL varies even on a response that did not itself vary. Deliberate limitation: a negotiable route does not participate in the render cache — the cache key carries no shape dimension and the cache is consulted before the shape is resolved, so a stored entry could otherwise replay a fragment to a browser asking for a full page; pairing `negotiate` with `cache` therefore keeps the route out of the cache rather than risking the wrong body. Routes that do not declare the flag are unaffected: no new header, no behaviour change, no cache impact.'
