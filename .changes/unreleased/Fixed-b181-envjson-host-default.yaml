kind: Fixed
body: 'A project `env.json` block that did not itself declare `host` left the `${host}` token unsubstituted inside the TLS credentials paths, so an https or HTTP/2 bundle refused to start with an ENOENT naming a literal `${host}` path segment and an error pointing at the server settings rather than at the missing key. `host` was the only value the per-bundle configuration reads that had no framework-side default: it was written solely by the CLI into the project `env.json`, so a hand-written or partial block never received one. The framework env template now carries the same `localhost` default the CLI already writes, so a block that sets only a subset of keys resolves correctly, and a bundle whose project `env.json` omits `host` logs a warning naming the bundle and env instead of defaulting silently. Projects that declare `host` are unaffected.'
