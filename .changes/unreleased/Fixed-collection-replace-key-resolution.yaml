kind: Fixed
body: '`Collection.replace()` no longer silently discards the write when the stored entry carries an internal `_uuid` and the caller''s `set` object does not (#B393, gh issue #64). The comparison key was resolved by inspecting the stored entry alone, so in that one combination neither the `id` fallback nor the "no comparison key" refusal applied and the comparison became `<storedUuid> == undefined` — never true. Nothing matched, nothing was replaced, no error was raised, and the call returned a result that looked successful: a silent, lossy write. A stored `_uuid` is present exactly when the caller re-loaded an array a previous chained call had returned, which is why the failure looked intermittent rather than constant. The key is now resolved from BOTH sides — the stored entry and the `set` — falling back to `id` when both carry one, and the call now refuses loudly when the two sides share no usable key at all, so the one unmatchable combination is no longer the only one that stays quiet. An explicitly named comparison key is still honoured exactly as given, and the resolved key is scoped per entry rather than shared, so a fallback taken for one entry can no longer apply to the entries examined after it. Every previously-working call is unaffected. Browser-bundled: rebuild your bundles to pick it up.'
