kind: Fixed
body: 'FormValidator: a field that both carries its own rules and drives a `_case_` block now keeps its collected value through every full-form pass, whatever its declaration position. Previously any such driver except the last-declared one had its stored value dropped the moment its own rules were checked, and later readers re-read it from the DOM — for a radio group the FIRST member''s value regardless of which member was picked — so conditions could match a choice the user never made (spuriously requiring the wrong flow''s fields, or blocking a correctly-completed form), and the driver''s own condition block matched nothing at all in the same pass. Conditions now resolve from the value the user actually picked, consistently across scan and direct-case paths, including inside condition recursions. Forms whose drivers carry no rules of their own are byte-identical. This fix is in the browser bundle: rebuild your bundles at pickup — a server restart alone will not deliver it.'
