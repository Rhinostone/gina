kind: Fixed
body: 'The client no longer stays half-booted on a light page. `core.js` attached its `ginaloaded` listener only after the async `routing.json` fetch resolved, while the `core` RequireJS factory — which the loader defers by a 4 ms `nextTick` — is what constructs gina and dispatches the event: whenever the fetch lost that 4 ms race the event fired with no listener, the whispered `onGinaLoaded` loader was never invoked against the constructed instance, `isFrameworkLoaded` never flipped, and the popin, validator and nav boot pollers gave up — every `data-gina-nav` hop degraded to a full navigation and no form ever bound. A page registering a `gina.ready()` handler had a second route to the loader through the ready scheduler, which is why heavier pages booted; a page without one had only the listener. The listener is now attached at parse time, above the `core` module definition, and resolves the loader lazily at dispatch (the server-whispered `onGinaLoaded`, or the built-in fallback), so it precedes the dispatch by construction; the #B414 gate-release order is byte-identical. Browser-bundled: pickup is a bundle restart and a re-bake. (#B483)'
