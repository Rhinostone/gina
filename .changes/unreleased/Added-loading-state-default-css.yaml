kind: Added
body: 'Gina now ships a default look for the loading state it writes, so the feature is visible without you writing any CSS. A trigger carrying `data-gina-loading="true"` gets a `progress` cursor and a gentle opacity pulse. The pulse is gated on `prefers-reduced-motion: no-preference`; anyone who has asked for reduced motion gets a static dimmed state instead, rather than no signal at all. It is deliberately minimal, and two omissions are on purpose: there is no injected spinner, because one would stack with a spinner you already ship and would force a positioning change on a trigger gina does not own; and there is no `pointer-events: none`, because a link deliberately accepts a second click while its request is running and supersedes the first. Overriding takes one rule of your own — the selector is a single attribute, so any class beats it — and `animation: none` drops just the motion. Renaming the attribute with `gina.setOptions({ loadingAttribute: ''data-loading'' })` opts out of the default styling entirely, since it is keyed on the default name.'
