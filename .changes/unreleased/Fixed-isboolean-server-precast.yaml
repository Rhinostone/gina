kind: Fixed
body: 'Fixed server auto-validation coercing every non-boolean string to `false` before the `isBoolean` rule could run — junk like `nope` or the HTML checkbox default `on` validated clean and persisted as `false`, and the number `1` stored as `false`. The engine is now the single adjudicator on every surface (the same contract the routing requirements surface always enforced and the reference documentation already promised): it accepts `true`/`''true''`/`1` and `false`/`''false''`/`0`, and anything else records an `isBoolean` error instead of silently becoming `false`. The boolean pre-cast survives only in dynamised-rules mode, where a referenced boolean field must splice into stringified `is` conditions as an unquoted operand.'
