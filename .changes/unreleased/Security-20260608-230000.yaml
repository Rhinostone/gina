kind: Security
body: 'The default Swig render path now keeps the swig-core CVE-2023-25345 path-traversal confinement active: `{% include %}` / `{% extends %}` / `{% import %}` resolution is confined to the bundle templates root, so a traversal target such as `{% include "../../../etc/passwd" %}` is rejected by the loader. To restore that confinement without an opt-out, the processed-layout cache was relocated under the bundle templates root (a `.gina-layout-cache` directory, auto-ignored via a generated `.gitignore` so it never surfaces in a project repo) and the dev inspector statusbar is now inlined into the layout instead of being included from outside the root.'
time: 2026-06-08T23:00:00.000000+01:00
