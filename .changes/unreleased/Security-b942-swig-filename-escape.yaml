kind: Security
body: 'Gina now requires `@rhinostone/swig` `^2.8.3` in both manifests. Up to 2.8.2, swig wrote the including template''s filename into the compiled template without escaping it: a double quote in a template''s path made a template that includes, imports or extends another fail to compile, and an async `import`, `from` or `extends` wrote a backslash in the path as it was, which corrupted it. 2.8.3 escapes the filename wherever it is written (advisory GHSA-q89c-947c-m7xr). Upgrading gina installs 2.8.3 or later (a project copy loaded through `swig.useProject` keeps its own version, so update it there); restart the bundle. (#B942)'
time: 2026-10-21T10:09:00+01:00
