kind: Fixed
body: 'The dev-mode Inspector now follows the monitored tab across the bundles of a proxy-routed multi-bundle project: each applied payload''s environment.webroot re-points the server-side channels (the /_gina/logs stream and the passive /_gina/agent stream) at the bundle actually serving the page, closing the previous stream. Hitting that bundle''s Inspector endpoints activates its per-process dev capture, so the Flow and Query tabs stop showing "No timeline data for this request." for every page served by a bundle the Inspector was not opened from — previously the channels stayed pinned to the open-time bundle and a sibling bundle''s capture never latched; server logs also kept streaming from the wrong bundle after a crossing. The pid staleness guard now compares webroots too, so a legitimate bundle crossing is no longer swallowed as a stale snapshot. The first page rendered on a newly-visited bundle still lacks flow (it rendered before capture activated) — data appears from the next render on (#B205)'
time: 2026-08-02T01:52:57+01:00
