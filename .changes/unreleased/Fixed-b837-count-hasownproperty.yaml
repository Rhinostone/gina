kind: Fixed
body: 'A request field named `hasOwnProperty` reaches the action like any other field. gina''s `count()` helper on `Object.prototype` tested each key with `this.hasOwnProperty(key)`, an ordinary property lookup: on an object with its own `hasOwnProperty` key that is not a function, such as a parsed request carrying a field of that name, the call threw and the helper returned 0, with no error. The request pipeline decides from that count whether to hand the parsed data over, so with such a field the action received an empty `req.get` on GET and HEAD and an empty `req.delete` on DELETE, and on POST and PATCH `req.body` stayed the raw body string (`req.post` and `req.patch` were complete). The helper now tests each key with the built-in `Object.prototype.hasOwnProperty`: such an object is counted like any other, and so is an object with no prototype (`Object.create(null)`, `querystring.parse()`) reached through `Object.prototype.count.call()`; every other count is unchanged. A `req.post.count()` in your own code counts that field too now. The same applies to `functionCount()`, which threw on both kinds of object, and to the validator''s `is` rule, which answered « could not evaluate » when the data it validated held a field named `hasOwnProperty`. Restart the bundle and re-bake each bundle: the browser bundle carries its own copy of the helper and of the validator (#B837).'
