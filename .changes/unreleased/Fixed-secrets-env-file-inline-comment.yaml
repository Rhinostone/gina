kind: Fixed
body: 'A trailing `#` comment in a declared secrets file is no longer read as part of the secret. `DB_PASSWORD=s3cret # rotated May` resolved to the literal `s3cret # rotated May`, and a quoted value followed by a comment kept its quote characters too — `DB_PASSWORD="s3cret" # note` became `"s3cret"`. The parser now strips a trailing comment the way a POSIX shell does when sourcing the same file, which is what the documented container-entrypoint pattern (`set -a; . secrets.env; set +a`) already did — so the same file no longer means two different things depending on which route delivered it. Two cases deliberately keep their hash, because stripping them would corrupt a legitimate password: a `#` with no whitespace before it (`abc#def`) and any `#` inside quotes (`"abc # def"`), which makes quoting a complete escape hatch. One consequence is worth checking before you upgrade: `KEY= # comment` is now an empty value rather than the string `# comment`, and an empty value counts as unset — so a key written that way now fails closed at bundle start, and `gina secrets:check` reports it `UNSET` instead of `SET`. That reversal is the point: the shell always delivered it empty, and the previous `SET` was a false green.'
