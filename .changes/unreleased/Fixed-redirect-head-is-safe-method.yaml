kind: Fixed
body: 'A redirect no longer treats HEAD as a wrong method (#B353). HEAD is a safe method — GET without a response body — but the guard that stops an unsafe method being replayed against a redirect target tested only for GET, so HEAD was handled like POST or PUT: it drew a "trying to redirect using the wrong method" warning even on a route that explicitly lists HEAD among its own methods, it was answered 303 (telling the client to re-issue as GET and fetch a body it had deliberately not asked for), and because the method was switched it also received a copy of the request parameters that the same request as a GET never gets — carried through the session where one is mounted, or appended to the redirect target in clear as the session-less fallback. HEAD is now admitted alongside GET, so it behaves exactly as GET does: the route''s configured status code, the same Location, and no warning. Unsafe methods are unchanged — POST, PUT and DELETE still get the warning, the switch to GET and the 303. Note this is wire-visible: a HEAD request against a redirect route now answers the route''s own code (302 for the framework-generated webroot redirect) rather than 303, so a monitor asserting 303 on a HEAD health-check needs adjusting.'
