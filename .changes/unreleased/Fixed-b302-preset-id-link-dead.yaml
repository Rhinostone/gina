kind: Fixed
body: 'A link marked with data-gina-link no longer does nothing when you give it your own
  id. Previously gina kept the id you wrote but dispatched only the links whose id it had
  generated itself, so markup like <a id="my-link" data-gina-link>Open</a> registered
  normally and was then silently ignored on every click — and because gina had already
  suppressed the default action, the click did nothing at all: no request, no navigation,
  no error. Links left without an id were unaffected, as were links wrapping an element
  such as a span or an image, whose clicks reach the plugin by a different internal route
  — which is why this could sit unnoticed. The id you set is preserved rather than
  overwritten, so anything targeting it from CSS or your own scripts keeps working.'
