kind: Fixed
body: '#B422 — a route whose URL structurally matches but whose `requirements` REJECT the request no longer drops the connection once the route cache is warm. The route cache is keyed `method:pathname` and (on the isaac engine) the query string is stripped before dispatch, so every query variant of one pathname shares one cache entry; the warm path re-evaluated `requirements` on each hit but discarded the verdict, force-matching the rejected request and dispatching it with no routing description — an unhandled promise rejection at the dispatch target deref, the connection dropped with no HTTP response at all. The warm path now honors the verdict: a rejecting (or throwing) requirement evaluation is treated as a cache miss and falls through to the routing scan, which answers correctly — 404 when nothing matches, the sibling rule when one does, or a 500 naming the rule when a `validator::` requirement throws (previously also a dropped connection). The cache entry is kept — variants the requirements accept stay warm. Defence in depth: the router now answers a named 500 instead of throwing when dispatched without a resolved `param.control`. Server-side only — pickup is a bundle restart, no re-bake.'
