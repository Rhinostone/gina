kind: Fixed
body: 'A popin''s close button now closes the popin whatever id you give it, and wherever
  inside it you click. Two shapes were silently inert before. Giving the button your own
  id — for styling, a test hook or an aria reference — stopped it working, because gina
  recognised its close buttons by an id it had assigned itself and yours replaced it. More
  commonly, putting an icon inside the button broke it too: a click landing on the inner
  icon rather than the button''s own edge was not recognised, so the ordinary markup of a
  close affordance with an svg or a span inside it did nothing. Neither case reported an
  error, and because gina suppresses the button''s default action either way, nothing at
  all happened on click. A close button that also acts as a trigger for another popin is
  unaffected and still behaves as before.'
