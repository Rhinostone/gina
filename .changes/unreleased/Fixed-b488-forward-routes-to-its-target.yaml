kind: Fixed
body: '`self.forward()` now forwards to the route it resolves. It used to compute the target route and discard it, sending the request to the target bundle''s webroot alone — or, for a raw host, to the port number as the path — with placeholder values taken from the routing declaration (`":id"`) instead of the captured URL parameters, an inverted `project` override, and a credentials read that could throw on a bundle without any. The resolved route url is now the forwarded path, placeholder values come from the request, a string answer is relayed verbatim with `renderTEXT()` instead of being re-encoded as JSON, and an unknown target is answered through `throwError()`. `multipart/form-data` bodies are still not relayed. (#B488)'
time: 2026-09-06T02:51:01+01:00
