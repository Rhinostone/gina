kind: Fixed
body: '#B442 - `route.request()` now settles its callback exactly once on every outcome, and an outbound request that fails can no longer take the bundle down. The `ClientRequest` returned by `http(s).get` was discarded, so nothing could attach an `error` listener to it: a dial failure whose code is carved out of the process-level handler left the caller waiting forever with nothing logged, while a code that is not carved out (`ETIMEDOUT`, `EHOSTUNREACH`, `ENETUNREACH`) escalated to an uncaughtException and terminated the bundle. A response stream that died mid-body behaved the same way for a different reason: the error was assigned to a local and delivery waited on an `end` event that never arrives. All four exit paths now run through a single-settle latch, so the callback receives an ordinary error argument - the shape consuming code already handles - and can never be invoked twice. `options.timeout` is honoured for the first time: it reached `http(s).get` and Node emitted `timeout` without destroying the socket, and the request object was unreachable, so the option silently did nothing; on expiry the request is now destroyed and the callback settles with an Error carrying `code` set to `ETIMEDOUT`. A request sent without a callback logs a warning on a dial failure instead of throwing. The browser bundle carries `lib/routing`, so pickup is a bundle restart AND a re-bake.'
