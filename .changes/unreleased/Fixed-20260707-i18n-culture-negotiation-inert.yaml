kind: Fixed
body: 'Per-request culture negotiation was inert: the negotiated `req.culture` (whispered to the browser as `gina.config.culture`) always resolved to `en` or empty, regardless of the bundle or environment culture. The framework moves `GINA_*` variables off `process.env` at init, so the negotiator environment-default step and the swig/nunjucks `t` filter fallbacks read a variable that was always undefined, and the per-request call never supplied a bundle default. The negotiator now reads the bundle `settings.region.culture` as the default and the `GINA_CULTURE` process default through the live accessor, so a configured culture reaches every request. Precedence: URL prefix, cookie, Accept-Language, then bundle culture, then `GINA_CULTURE`, then `en`.'
time: 2026-07-07T09:58:23+01:00
