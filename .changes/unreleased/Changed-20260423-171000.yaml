kind: Changed
body: >-
  Extracted `DRIVER_MAP` + `AI_DRIVER_MAP` into a new
  `lib/connector-registry/` module — single source of truth for the
  connector driver → npm package + semver range mapping. Previously
  duplicated inline in `lib/cmd/connector/add.js` and
  `lib/cmd/connector/list.js` and kept in sync by hand; the two copies
  had already drifted (list.js knew about `mongodb` and `scylladb`,
  add.js did not). Both cmd handlers now read from
  `lib.connectorRegistry.getDriver(type)` /
  `.getAIDriver(scheme)` / `.getDriverTypes()` / `.getAISchemes()`, so
  adding a new connector upstream means editing one table instead of
  three (root `package.json` `peerDependencies` was the third, removed
  in the previous commit). Public CLI behaviour is unchanged — the
  registry exposes the same tables, the install hint and
  `--install` resolution use the same ranges. 28 new source-inspection
  + behavioural tests in `test/lib/connector-registry.test.js`; the
  inline-map tests in `test/lib/connector-add.test.js` and
  `test/lib/connector-list.test.js` now assert registry consumption
  instead.
time: 2026-04-23T17:10:00Z
