kind: Fixed
body: 'A custom error page rendered over HTTP/2 now carries the config-declared CSS/JS `rel=preload` entries in its final `link` header, and — when scripts are not in defer mode (`javascriptsDeferEnabled: false`, the only mode in which the framework injects external plugins into the head) — its head carries the scripts declared with `isExternalPlugin: true`, like every other page. The custom-error render built its options with a copy of the template config, so what the framework accumulated for the error page while resolving its assets never reached the header and the head the render read — error pages had never carried either since both existed. The custom-error render now shares the request''s template object and re-seeds `h2Links` and `externalPlugins` first, so an error struck after the failing route''s assets were already resolved (a template compilation error) does not double the preload entries or the plugin tags. Pickup is a bundle restart. (#B497)'
