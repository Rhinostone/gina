kind: Changed
body: 'Replaced the transitive `object-assign` dependency (`engine.io` → `cors` → `object-assign@4.1.1`, dormant since 2017) with `@socketregistry/object-assign` via npm `overrides` — a maintained two-line re-export of the native `Object.assign`, with zero runtime change (the replaced package already delegated to the native implementation at require time on any modern runtime). SCOPE, so nobody reads more into this than it does: npm and bun alike honor `overrides` only in a project own root manifest, so this cleans the gina tree itself and NOT your install — a project that depends on gina still resolves `object-assign@4.x` beneath `cors`, unchanged. Add the same `overrides` entry to your own root `package.json` to get it in your tree; the consumer-reaching fix is upstream (expressjs/cors#430, filed).'
time: 2026-08-03T03:04:58+01:00
