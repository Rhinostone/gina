kind: Fixed
body: 'A non-string field value no longer aborts the whole form validation pass. The isEmail, isJsonWebToken and trim rules called a string method on the field value without checking its type, so a value like 123, true or [] - reachable from a JSON request body, or from a checkbox on the client - threw, and the rule driver re-threw, killing every remaining field: server-side the request went unvalidated, client-side the boot-time binding loop died and later forms silently lost validation and CSRF token injection. All three now leave a non-string untouched: isEmail and isJsonWebToken record a normal rule error for it (it is invalid, not silently accepted), and trim passes it through untransformed, matching how isFloat already behaved. Whitespace trimming of real strings is unchanged.'
