kind: Fixed
body: 'Fixed the static directory-to-index redirect on HTTP/1.x: outside dev mode, a request for a directory URL containing an index.html answered 200 with a Location header — browsers rendered a blank page instead of following it. The branch now sends 301 unconditionally, matching the HTTP/2 path; the no-cache headers remain dev-only.'
