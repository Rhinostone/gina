kind: Security
body: 'A route that declares both an authorization key (`param.requireAuth` / `param.roles` / `param.policy`) and `cache` now refuses to boot. The render cache is read before the authorization gate runs and its key carries no user identity, so the first authenticated response was replayed verbatim to every later unauthenticated caller. The boot refusal names the route and the remedy; as a second layer, the render delegates never store a body for a gated route even if the configuration bypassed the lint. `auth.requireAuthByDefault` already refused this pairing for mode-gated routes — it now covers explicitly gated ones too. ACTION REQUIRED: a bundle pairing an authorization key with `cache` will not start until you drop `cache` or open the route.'
time: 2026-07-25T20:45:00.000000+02:00
