kind: Fixed
body: 'The path helper''s file copier — the byte-writer behind `_().cp()` and `PathObject.mv()`, which CLI copy, build and rename paths ride — no longer destroys or truncates the destination on a failed copy (#B227). Bytes now stage to a temp sibling in the destination''s directory and publish with an atomic rename, so a reader never observes a partial file and a pre-existing destination is replaced only on success (previously it was unlinked BEFORE the copy started); a source-side read error is now handled instead of raising an unhandled `error` event that killed the process; a failed copy settles the callback exactly once (previously a destination-side failure settled twice — the second time as a success, which forked directory-copy recursion); and failures propagate a real `Error` (previously a plain string, so callers printing `err.stack` logged `undefined`). Contract note: a consumer matching the exact pre-existing failure string `Error on Path.cp(...): Not found ...` now receives an `Error` whose message names the copy that failed.'
