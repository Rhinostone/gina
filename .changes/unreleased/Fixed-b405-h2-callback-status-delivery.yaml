kind: Fixed
body: 'Fixed #B405 — an HTTP/2 query in callback mode never delivered a non-5xx error status to the app callback: the dispatch split 5xx → `callback(data)` / every other deliverable non-2xx → the framework''s own error answer, so graceful degradation was impossible for e.g. a 404 from an HTTP/2 upstream, and — measured — the documented `util.promisify(self.query)` idiom NEVER SETTLED on any non-5xx status (the `await` hung and its continuation was silently abandoned), while HTTP/1.1 has delivered every non-2xx to the callback since its own earlier change. The split is retired: every body-announced non-2xx with a known status code now invokes `callback(data)` on both transports, matching the documented contract. Behaviour change: an HTTP/2 callback-mode query that previously auto-answered the original request with the upstream''s non-5xx status now invokes your callback instead — decide there whether to degrade or surface; the 3xx-with-headers redirect replay is unchanged.'
