kind: Fixed
body: 'Requiring gina outside a bundle context now fails cleanly instead of hanging the process. The framework bootstrap has always thrown when it cannot find the bundle context the CLI provides, but the logger — a load-time singleton — had already opened its MQ socket by then, and that socket kept the event loop alive: catching the error did not let the process exit, so a plain node process (a test runner, a one-off script, a codegen pass) stalled with no output wherever an MQ listener happened to be running. The speaker now unrefs its connection, so a logging transport can never be the reason a process stays alive. The error itself also names the boundary it hit, and points at SuperController.createTestInstance() for exercising controller code without booting a bundle, instead of reporting an internal path-registry failure (setPath("gina.home", path): path cannot be empty or undefined).'
