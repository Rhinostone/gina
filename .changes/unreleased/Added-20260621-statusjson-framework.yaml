kind: Added
body: '`project:status` and `bundle:status` `--format=json` now include a `framework` field (the framework version each project/bundle resolves to — the per-project `projects.json` pin, falling back to the global default) and a `gina_version` field (the per-bundle `manifest.json` override, `null` when unset).'
