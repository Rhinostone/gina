kind: Fixed
body: 'A gina process no longer hangs for the OS connect timeout (~75 seconds on macOS) when the configured MQ log host is unreachable — a powered-off peer, a firewalled segment, or a stale `host_v4` left behind by a DHCP reassignment. The speaker''s socket was already unref''d, but an unref''d socket only releases the event loop once the dial settles: a connect that is still PENDING is a live request that holds the process open on its own, so `require()`ing framework code stalled for the full window wherever the host answered nothing at all (a REFUSED connection was always fine — the peer''s reset closes the handle). The dial now carries its own unref''d deadline and gives up after a bounded wait, flowing through the same error path as a refused connection: the logging transport can be degraded, never load-bearing (#B318).'
