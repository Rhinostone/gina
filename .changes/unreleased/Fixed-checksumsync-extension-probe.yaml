kind: Fixed
body: 'Fixed lib/math checkSumSync hashing real file paths as PATH STRINGS whenever the extension was not exactly a dot plus 3 lowercase letters: the file probe now accepts any extension shape (a dot plus 1-10 alphanumerics - .js, .json, .TXT, .c, .jpeg, ...) and remains stat-gated, so the file branch is taken only when the whole input resolves to an existing regular file. Behavior change for file callers: checksums of such paths were previously hashes of the path text (never tracking content) and now hash the file bytes - stored sums for those paths change. A data string that exactly names an existing file with an extension-shaped tail now hashes that file (this ambiguity already existed for dot+3-lowercase names); data merely ending in an extension shape still hashes as data, and extension-less paths (Makefile, LICENSE) remain data. (#B210)'
