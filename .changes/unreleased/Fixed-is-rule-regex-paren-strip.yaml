kind: Fixed
body: 'The `is` rule''s security strip removed every `(`, `)` and literal `return` from a regex-literal condition BEFORE compiling it, silently changing what the pattern matched (#B345, issue #59): groups were destroyed and anchors rebound — `/^(a|b)$/` validated as `/^a|b$/`, substring-permissive for middle alternatives — and a quantified group like `(#TAG)?` became a literal `#TA` plus an optional `G`. The strip now runs only inside the binary-comparison branch, which keeps its grammar-locked protection and its tolerance of authored parens, while a regex literal compiles exactly as authored (that branch never evaluates the condition as JS, so parentheses there were never an injection vector). ACTION REQUIRED: parenthesized `is` patterns now match as authored, i.e. STRICTER — a rule such as `/^(a|b)$/` that previously accepted `aX` or `Xb` now rejects them; review `is` rules containing parentheses for values that were passing only through the mangled pattern. Patterns without parentheses are unaffected.'
