kind: Fixed
body: 'A popin or dialog trigger keeps working when your own click handler disables it —
  the near-universal double-submit guard that sets the disabled attribute on the control
  it just handled. Previously that guard ran first, inside the very click being handled,
  and gina then read the attribute and silently refused to open: no popin, no error, and
  because your handler clears the attribute again, a control that looked completely
  normal. Gina now trusts the native disabled attribute only on elements where the
  browser does not enforce it itself. On a real form control the browser already
  suppresses the click entirely, so the check protected nothing there and could only ever
  fire on a mid-click write; on a link or a custom element it is still honoured, so
  markup relying on <a disabled> is unchanged. The same fix covers the legacy popin
  dispatch path and in-popin close buttons, where a capture-phase guard could leave a
  popin stuck open. Gina''s own behaviour of disabling a trigger while its popin loads is
  unaffected.'
