kind: Fixed
body: 'The automatic 103 Early Hints response now fires. `render()` read the accumulated `h2Links` preload prefix and called `setEarlyHints()` when it was truthy, but the only writers of that prefix are the two `+=` sites in `getNodeRes()`, reached from `setResources()`, which every one of the five render delegates calls *after* `render()` has dispatched to it — so the read always saw the empty string the router seeds, and the hint was skipped on every request since the feature was added (it was never a regression: the introducing commit already dispatched below the read). The prefix is now computed in `render()` before the dispatch, from the view''s declared stylesheets and scripts, and the router''s seed is restored immediately afterwards so the delegate rebuilds the final 200 `Link` header from clean — that header is byte-identical, verified on a live HTTP/2 production boot alongside a same-boot control. The computation sits after the content-negotiation block, because that is what resolves whether the request is a fragment, and the delegates filter their asset list to common-only for fragments; it resolves its view config the way all five delegates do, so a custom-error render hints the error page''s assets. No hint is sent for XHR requests, in dev, or for assets using Subresource Integrity (a preload hint carries no integrity metadata). `self.setEarlyHints()` was unaffected and has always worked. Server-side only; pickup is a bundle restart. (#B496)'
