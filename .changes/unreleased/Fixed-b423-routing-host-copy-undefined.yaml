kind: Fixed
body: '#B423 — a bundle declaring a `redirect` route no longer floods its log with `JSON.clone(...) possible error detected: source[host] is undefined` warnings. Redirect rules are deliberately excluded from the per-rule host/hostname defaulting, so those keys are absent on them — but the per-request routing copy in the controller assigned them unconditionally, which CREATED properties holding `undefined` on the cached routing clone. Because that clone is kept for the lifetime of the process, every later no-arg `getConfig()` then emitted one `host` and one `hostname` warning per redirect rule, indefinitely — measured by a consumer as roughly three quarters of that log line total volume, drowning the genuine warnings it exists to surface. The copy is now existence-guarded: an absent key stays absent, and rules that do carry a host or hostname are copied exactly as before. Behaviour is otherwise unchanged (the clone had been substituting `null`, which every reader already treated the same as absent) — this removes log noise, not a functional defect. Reached only from template/view routes, so API-only bundles were never affected. Server-side only — pickup is a bundle restart, no re-bake.'
