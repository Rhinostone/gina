kind: Fixed
body: '`gina secrets:check` could not resolve a `settings.secrets.file` path that used the project version or relied on the default scope, so for those chains it skipped the file tier and went back to reporting `UNSET` for keys the bundle would have started with — the same false alarm the previous fix set out to remove, returning through tokens the command did not carry. It now seeds `${projectVersion}` and `${projectVersionMajor}` from the project manifest, matching how the runtime obtains them, so a path such as `${homedir}/v${projectVersionMajor}/credentials/secrets.env` resolves. `${scope}` now falls back to the project''s default scope when `--scope` is absent, which is what the runtime uses when nothing overrides it, so a scope-templated chain resolves without the flag; `--scope` is still required to apply the read-only `config_<scope>/` overlay, which is never applied by default. The project name behind `${homedir}` is now derived from the project path rather than the resolved command argument, so the all-projects form no longer builds a path from an undefined name and reports every layer of it missing. Tokens the command genuinely cannot derive are still left in place and the tier reported and skipped, so the check can only ever be stricter than the runtime, never laxer.'
