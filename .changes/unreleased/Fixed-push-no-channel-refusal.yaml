kind: Fixed
body: '`self.push()` now refuses by name when the server instance has no engine.io channel, instead of failing as an opaque 500 (#B371). The push channel is an isaac-engine facility — `serverInstance.eio` is attached there and nowhere else — so on the express engine the client lookup dereferenced an absent `eio` and surfaced as a TypeError-derived 500 whose message named neither push nor the missing channel, leaving "why is this route 500-ing?" as the only signal a developer got. It now warns, hands a supplied `callback` a `PUSH_CHANNEL_NOT_CONFIGURED` error, and sends nothing — WITHOUT failing the request, so a notification side-channel no longer takes down the response it rode in on. This is also the first time push() honours the `callback(err, result)` contract its own documentation has always described: the body accepted a callback and forwarded it to the transport, but never once invoked it itself. The condition is structural rather than per-call — the channel either exists in this process or it never will — so it is reported identically on every call, matching the refusal `gina.pushToSession()` gives for the same cause.'
