kind: Security
body: >-
  Stripped `dependencies`, `devDependencies`, and `scripts` from the
  vendored `core/deps/busboy-1.6.0/package.json` (and `devDependencies`
  + `scripts` from `core/deps/streamsearch-1.1.0/package.json`). busboy
  is vendored and finds streamsearch via a relative path
  (`require('../../../streamsearch-1.1.0')`), so the declared
  `"streamsearch": "^1.1.0"` dependency was cosmetic and never consumed
  at runtime — but supply-chain analyzers walk sub-`package.json` files
  inside the published tarball and were surfacing streamsearch as a
  top-level gina dep. The `devDependencies` and `scripts` blocks are
  dead in a vendored context (no `npm install` runs against them; no
  `npm test` either). No runtime impact — both modules still load via
  the same relative paths they did before.
time: 2026-04-23T17:05:00Z
