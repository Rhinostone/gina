kind: Fixed
body: 'An unticked checkbox that carries a value and whose own rule says `"isRequired": true` is now refused: `isRequired` on such a checkbox means it must be ticked, as it does for a radio group (several boxes under one name: at least one ticked; boxes with distinct names: each one). Before, no rule judged it, so the form posted without the box and the required check never fired, in the browser or on the server. A boolean checkbox (no `value`, a `true`/`false` value, or an `isBoolean` rule) still posts its live state, a required `false` still passes, a disabled box is still left out, and an unticked box with no rule or with `"isRequired": false` is still absent from the posted data. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B926)'
