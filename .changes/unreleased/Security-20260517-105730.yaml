kind: Security
body: 'Added gina.plugins.SecurityHeaders({...}) — opt-in combined wrapper composing HDR1-7 + HDR5 + HDR6/13/14 in a single mount with one settings.json block (#HDR15). Closes Phase 2 of the Web Security Headers track. Batteries-included safe set: calling SecurityHeaders() with no opts mounts the 7 non-footgun plugins (xContentTypeOptions / xFrameOptions / referrerPolicy / hsts / originAgentCluster / coop / corp) with per-plugin defaults. CSP (#HDR5) and COEP (#HDR6) are opt-in-only because of known footguns (CSP throws on missing directives — no sensible cross-bundle default; COEP require-corp BREAKS embeds without CORP); bundles wanting them pass csp: { directives: {...} } or coep: true. Per-sub-config explicit opt-out via <key>: false or null (e.g. SecurityHeaders({ hsts: false }) for HTTP-only bundles). csp: {} (no directives) throws at factory call time matching standalone Csp behavior. Internal composition: SUB_PLUGINS registry array drives an Express-style sequential middleware runner; each sub-plugin factory is called at construction time (throws propagate to wrapper caller, fail-fast at bundle start); each sub-middleware emits its own header at runtime via the per-plugin idempotent first-writer-wins pattern. Individual plugins remain mountable independently as power-user escape hatches — stacking SecurityHeaders() with an upstream gina.plugins.Csp({...}) produces no double-emit. Settings precedence: per-plugin defaults < settings.json > <key>.* < settings.json > securityHeaders.<key>.* < wrapper opts. Mirrors helmet helmet() orchestrator shape per the helmet-parity narrative. 83 unit tests; full suite 6028/6028. Phase 2 closed — total 10 #HDR plugins shipped (HDR1-7 + HDR5 + HDR6/13/14 + HDR15 wrapper).'
