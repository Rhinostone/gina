kind: Fixed
body: 'Controller.store() now publishes each file atomically and surfaces the real move error (#B223). Failures used to be reported as a fabricated ''No file to upload'' Error — masking the actual ENOSPC/EACCES/ENOENT diagnostics; a source-side stream error had no listener at all and killed the bundle process (uncaughtException -> SIGTERM); a destination failure still fired the autoDestroyed stream''s close handler, which unlinked the caller''s staged SOURCE file after the FAILED move and settled the callback a second time as a success; and the copy streamed straight to the final name after pre-deleting any existing destination, so a concurrent reader could observe a truncated file under the final name. Each file now streams to a temp sibling in the destination directory and is published with an atomic rename; the callback settles exactly once with the real filesystem Error; a failed move leaves both the staged source and any pre-existing destination intact; the genuinely-empty case keeps its historical ''No file to upload'' message. A consumer matching that literal message on failure paths now receives the real Error instead.'
