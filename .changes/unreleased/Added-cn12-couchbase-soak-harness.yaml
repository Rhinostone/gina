kind: Added
body: 'Added a Couchbase SDK soak harness — `script/soak/couchbase-soak.js` screens a Couchbase Node SDK candidate against a caller-chosen Couchbase Server before a consuming project adopts it (#CN12). The harness scaffolds a fully isolated throwaway project (the real `~/.gina` and real projects are never touched), installs the candidate SDK into it (`--sdk=<version>` or `--sdk-path=<dir>` — the install is the version selector, since the connector resolves `couchbase` from the project node_modules), builds and boots the bundle for the prod env, then drives the three connector surfaces under sustained concurrent load for `--duration`: N1QL entity queries (including a `request_plus` scan-consistency arm), KV through the entity collection handle in both the promise and the 4-arg optional-callback form, and the couchbase express-session store. Pass criteria target the silent-death class where a process under SDK load dies without a JS stack: the bundle must survive the full duration (a premature clean exit 0 counts as FAILURE), RSS growth must stay bounded, the error rate must not drift, and every requested arm must complete real work. Exit codes 0/1/2 with a JSON + text report under `tmp/couchbase-soak-<stamp>/`; a generic soak is a screen, not proof — run it as the first filter on an SDK bump, with a workload-shaped soak of the consuming application as the second gate.'
