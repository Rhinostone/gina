kind: Security
body: >-
  Replaced four `eval(...)` call sites in the validator plugin with safe,
  grammar-locked equivalents (#SCS1e, bucket (c) partial progress).
  `core/plugins/lib/validator/src/main.js:2603` — `eval('gina.forms.rules.' + customRule)`
  replaced with a dot-path walker. `customRule` is read from the user-controlled
  `data-gina-form-rule` HTML attribute; the old eval executed anything that parsed as
  JS, so a crafted attribute like `constructor.constructor("return process.exit()")()`
  would fire on lookup. The walker rejects any character outside
  `[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*` and returns undefined on missing path
  (falling through to the existing "no rule found" error).
  `core/plugins/lib/validator/src/form-validator.js:161` — `eval('data.' + localValue)`
  in `compileError()` replaced with a dot+bracket path walker. `localValue` is derived
  from `{{...}}` placeholders in error messages; the transforms at lines 152-158
  produce `ident (. ident | ["quoted"])*`, and the walker rejects anything outside
  that shape.
  `core/plugins/lib/validator/src/form-validator.js:893` — the regex-literal branch
  of `is()` replaced with `new RegExp(body, flags).test(value)`. Parses
  `/<body>/<flags>` only; `/<body>/` without flags or any non-regex input throws.
  `core/plugins/lib/validator/src/form-validator.js:895` — the binary-compare branch
  of `is()` replaced with a regex-based evaluator over the closed grammar
  `<operand><op><operand>` where operand is in
  `{number, "string", true, false, null, undefined}` and op is in
  `{===, !==, ==, !=, <, >, <=, >=}`. After `$var` substitution (lines 910-920) and
  paren/return strip (line 925), real Freelancer v3 conditions (15 regex literals +
  11 binary comparisons) all match the two grammars. Any input outside the grammars
  (arithmetic, function calls, semicolon injection, throw injection) is rejected.
  Seven validator-plugin sites remain deferred pending a separate design pass
  (`form-validator.js:919`, `:1722`, `main.js:2320`, `:2329`, `:2931`, `:2947`,
  `:2959`). Verified by +69 tests in `test/lib/validator-scs1e.test.js` (source
  inspection, behavioural parity against corpus, injection rejection).
