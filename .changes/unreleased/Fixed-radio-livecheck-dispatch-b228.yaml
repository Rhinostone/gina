kind: Fixed
body: 'Fixed the submit trigger staying disabled after a radio-group pick under default-on live checking (#B228): the radio live-check listener was registered under a `changed.<id>` event name that nothing dispatches on a user pick — the form-level click proxy short-circuits into the radio state updater (which never dispatches), and the change proxy dispatches only names that are registered — so the whole-form silent pass never re-ran and the trigger kept its bind-time `aria-disabled` + `.gina-form-submit-disabled` state, while submit-time validation (a separate call chain) accepted the checked group and let the send through. Radios now also register the proxy-dispatched `change.<id>` name, so a pick (mouse, label, or keyboard) re-runs the field and whole-form passes and the trigger re-enables. Latent until the radio-group collection fix (#B221) made required radio groups gate at bind — before that there was nothing to re-enable. Checkboxes and text-like fields are unchanged.'
