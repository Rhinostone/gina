kind: Fixed
body: 'A form''s submit button keeps working after the page replaces its DOM node —
  the shape an AJAX update or a popin re-render produces when it swaps in fresh markup.
  Previously such a button went permanently and silently dead: clicking it produced no
  request, no navigation and no error, and the button looked entirely normal, while
  submitting the same form by pressing Enter or by calling submit() from your own code
  still worked. The cause was that the click handling is delegated to the form and so
  survived the swap, but the step that actually runs the submit was attached to the
  original button; the replacement inherited every attribute except that binding, and
  nothing re-established it. Gina now recognises a replaced trigger the first time it is
  clicked and re-binds it, so the swap is invisible to your code. Validation is
  unaffected — a replaced trigger on an invalid form still refuses to submit.'
