kind: Added
body: 'Documenting two boundaries the framework deliberately does not cross: API versioning and database migrations. Both were absences a reader could only discover by searching for something that was not there, and an absence with no statement behind it reads as an oversight rather than a decision. Neither is a new capability - the point is that neither will be one. Versioning gets a routing-guide section stating plainly that there is no version route field and no version-aware dispatch, because when to cut a version and how long to support the old one are product decisions a framework would be wrong to make for you; it then shows the three shapes the existing primitives already cover, a URL prefix with a per-version namespace so each version loads its own controller file, separate bundles when versions need their own dependencies or release cadence, and header negotiation - with the note that the question deciding between them is not URL versus header but what changes together. Migrations get a models-guide section naming the per-database tools to use instead, plus the two things that actually go wrong in practice: run them as a discrete step before the new version serves, never at bundle boot, where they race themselves the moment there is more than one replica and turn a schema error into a crash-loop instead of a failed deploy step; and keep changes additive during a rolling deploy, because SQL files are validated at call time rather than at boot, so a renamed column and a query still selecting it fail on the first request rather than at startup. The connector CLI page gains an explicit warning that connector:migrate is not a database migration - it lints the connection configuration and with --fix rewrites that JSON, issuing no SQL and holding no up or down concept - since the name is the whole source of the confusion. Verified against the source before writing rather than from memory: no version field exists anywhere in the router or the routing library, and the migrate command help confirms it scans connectors.json only. Docs only, no behaviour change; pickup is a bundle restart with no re-bake'
