kind: Fixed
body: 'A routing rule''s `param.title` now reaches `page.view.title` — the routing-param title promotion had been silently inert since its introduction, so the browser-tab title always showed the route name; the stripped route name remains the fallback for title-less rules, and a controller-set title still wins. The `view:add` layout boilerplate now reads `page.view.title` / `page.view.lang` instead of the never-populated `page.title` / `page.lang`, so freshly scaffolded pages get a real tab title and lang attribute.'
time: 2026-07-12T14:08:28+01:00
