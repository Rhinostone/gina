kind: Fixed
body: 'Fixed #B399 (query delivery seams) — an exception in an `async` query callback could vanish without a response: every app-callback delivery in a controller''s `self.query()` (the Node-style callback form and the `{onComplete}` facade, on both HTTP/1.1 and HTTP/2 transports, success and transport-error deliveries alike) invoked the callback bare, so while a synchronous throw was caught by the success-delivery guards, an asynchronous rejection was unowned — the request hung to client/proxy timeout and the only trace floated to the process-level rejection handler. Every delivery now routes a rejected callback promise to the same `throwError` shape the sync guards build. Behaviour change: an `async` query callback whose promise rejects now answers 500 (with the #ERRREF correlation ref) where it previously hung; a callback that already responded before rejecting is absorbed by the released-response guard (logged server-side, never a double response). Synchronous behaviour at every delivery site is byte-unchanged and plain callbacks mint no promises. The adjacent synchronous gap — a throw inside a callback invoked on a transport-error delivery, which was never guarded — is owned by its own fix in this same release (see the dedicated entry).'
