kind: Added
body: 'Upload groups can now route their self.store() step through the storage layer (#STO1 slice 1): a settings.json upload.groups.<name>.driver key publishes that group''s files through the named settings.storage driver — result entries carry an opaque storage key plus group, driver and the layer''s on-disk size instead of a moved-file path, one call may mix routed and moved files (result slots stay 1:1 with the input), and target may be null when every file routes. Files in groups without a driver keep the historical move path byte-for-byte. Boot refuses a group naming an undefined driver; a group path beside a driver stays the parse-time staging dir (a path inside the driver''s root earns a boot warning).'
time: 2026-08-11T01:51:17+01:00
