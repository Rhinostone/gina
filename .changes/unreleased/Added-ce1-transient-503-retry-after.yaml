kind: Added
body: 'Opt-in 503 + Retry-After rendering for transient datastore failures (connector error classification, slice 2): with `server.transientErrors.enabled: true` in a bundle''s settings, a connector error stamped `isTransient` that would render as HTTP 500 through `throwError` renders as 503 with a `Retry-After` header (`server.transientErrors.retryAfter`, integer seconds 1..86400, default 30) and the user-facing `error` field replaced by `server.transientErrors.message` (default: the standard 503 status text) — on both engines, JSON and HTML error surfaces alike. Explicit non-500 statuses and permanent errors are never upgraded, and the default (opt-out) behaviour is byte-identical to before. A malformed `server.transientErrors` block warns at boot and leaves the feature off — it never refuses a boot.'
