kind: Fixed
body: '`gina.validator.$forms[id].reBind()` keeps the rule set a form names with `data-gina-form-rule` when the form''s id names no rule set, and so do `.bind()` and `getFormById()` on an unbound form. A bind given no rule looked the rule set up by the form''s id alone, while the first bind is handed the attribute''s rule, so such a form was re-bound with an empty rule set: no field was live-checked, the submit control kept its gated mark, typing no longer re-evaluated it, and the first click on a valid form was refused. Before 0.7.4 the listeners of the previous bind stayed attached across a `reBind()` and could hide the defect; since 0.7.4 detaches them, nothing re-evaluated the gate. A bind given no rule now reads `data-gina-form-rule` first, when it names a known rule set, then the id. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B879)'
