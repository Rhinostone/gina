kind: Added
body: 'The audit trail can now carry a tamper-evidence hash chain. Opt in with `audit.chain.enabled: true` and a signing key (`audit.chain.secret`, a literal or a `${secret:VAR}` placeholder, or the `GINA_AUDIT_SECRET` environment variable) and every record gains a `hash` that chains from its predecessor — `HMAC-SHA256(secret, previousHash + canonical(record))`. The new offline command `gina audit:verify <bundle> @<project>` walks the trail and reports either the intact totals or the first break with its line and reason, exiting non-zero when the chain is broken. This detects any post-hoc edit, deletion, insertion or reordering of the trail by someone who does not hold the signing key. It is deliberately NOT a defence against the process that writes the records: that process holds the key and could forge a whole chain, so for that stronger adversary stream the trail to write-once (WORM / Object-Lock) storage, as the compliance guide already describes. Two boundaries are stated rather than implied: truncation at the exact tail is invisible to the chain (read the record count), and an empty trail verifies trivially. A crash mid-write leaves a torn tail that the next boot acknowledges with a chained break record and a loud warning rather than a crash loop. The boot refuses the deployment shapes a single linear chain cannot hold — no signing key, a connector `store` backend (whose seam carries no ordering guarantee), or two bundles chaining into the same `audit.file` — so a chain that cannot be trusted never starts silently. Server-side only; enabling the chain needs a bundle restart.'
