kind: Fixed
body: 'The model layer no longer creates an empty `models/<entry key>/entities` directory for each `connectors.json` entry. Entities are read from `models/<database>/entities` (`models/<keyspace>/entities` for a ScyllaDB entry that sets only `keyspace`), which each ORM connector creates when it is missing (none for an entry that names no `database` or `keyspace`), so an entry named differently from its database, a redis or AI entry, and an entry with no `database` (such as the in-memory SQLite session entry of the connectors reference) each left a directory nothing reads, and a debug line named that path. The bundle''s `models/` directory is still created at boot. A directory an earlier version left behind can be deleted. Restart the bundle. (#B901)'
time: 2026-10-16T20:11:10+01:00
