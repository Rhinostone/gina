kind: Fixed
body: 'A form bound to a rule set now holds its own copy of it, and its submit and click checks validate with that copy: what a binding derives from the form''s own markup and writes into its rules (the exclusion of a `data-gina-form-element-group` member, the `isBoolean` classification of a boolean checkbox, a RegExp key''s alias) never reaches another form bound to the same rule set. Before, every such form shared one object and the checks looked the rules up by name again, so a form posted without its ticked value-carrying checkbox when another form had bound a hidden field of that name first (a popin whose content was swapped, two forms on one page in either order, whatever the forms'' ids), or posted `true` in place of a value when the other form''s same-name checkbox was boolean. A required valueless checkbox unticked still posts `false` and passes. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B931)'
