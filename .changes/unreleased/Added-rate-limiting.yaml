kind: Added
body: 'Identified-caller rate limiting (#MS6): opt-in quota enforcement at the router, keyed on the authenticated principal — the session user (via the operator-named server.rateLimit.keyField) or a machine caller — with fixed-window counters stored in a kv namespace you declare, so a redis- or sqlite-backed namespace shares one quota across replicas while an in-memory one counts per process (the boot resolver warns about the difference, and about a redis connectors entry missing the fail-fast tuning that would otherwise queue requests through an outage). The gate runs after route authorization and before DTO validation (401 -> 429 -> 422), and it throttles identified callers only: anonymous flood control stays with your edge proxy and the HTTP/2 rapid-reset guard, and a request with no resolvable principal is skipped, never bucketed by IP. Denials answer 429 with Retry-After plus the RateLimit / RateLimit-Policy structured fields from draft-ietf-httpapi-ratelimit-headers-11; allowed limited requests carry them too. Per-route overrides ride routing.json''s top-level rateLimit key: false exempts a route, an object with limit / window replaces the default policy for that route in its own bucket (partial objects inherit the missing key). Configure under settings.json server.rateLimit (enabled, namespace, keyField, limit, window; env.json keys win at the fold, changes need a bundle restart). Dormant unless enabled is strictly true; structurally invalid values on an enabled block refuse the boot; store outages follow the namespace''s own failMode — open admits requests with a warning, closed answers 503 with Retry-After. Server-side only: pickup is a bundle restart (the dist rebuild in this release carries only the route-flag propagation, dead code in the browser).'
