kind: Added
body: 'XML request handling (#FIN1): application/xml, text/xml and application/*+xml request bodies now reach the application verbatim on POST, PUT and PATCH instead of being run through the form-encoded decode path. request.body keeps the exact document the client sent (the same string request.rawBody carries) and the application parses it with the XML library of its choice — the framework never parses XML itself, so it takes on no XML parser surface. Previously such a body was silently destroyed rather than rejected: the form decoder splits on & and then on =, keeping only the first pair, so the XML declaration alone collapsed a whole document to one bogus key, and that object then replaced request.body. The matched set follows the convention ASP.NET Core, Spring and type-is share — the +xml structured-suffix wildcard is scoped to application/, so image/svg+xml is not matched, and the RFC 7303 types that are not XML documents (application/xml-dtd and both xml-external-parsed-entity forms) are excluded. urlencoded, JSON and multipart bodies are unaffected, and the same single chokepoint serves both engines.'
