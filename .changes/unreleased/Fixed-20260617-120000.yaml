kind: Fixed
body: 'The default (Express) server engine now serves the admin endpoints /_gina/info and /_gina/cache/stats, which previously returned 404 there while the Isaac engine served them. Both engines now expose them with the same always-on, IP-allowlisted behaviour (loopback-only by default; configure via app.json admin.allowFrom), so process/runtime info and cache statistics are available regardless of which server engine a bundle runs.'
time: 2026-06-17T12:00:00+01:00
