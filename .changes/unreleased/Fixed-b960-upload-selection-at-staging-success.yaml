kind: Fixed
body: 'A staged file input now changes the page and the form only when a new selection''s staging succeeds: a failed staging changes nothing, and the files shown keep working while a file uploads. A failed staging emptied the preview container, taking the previews of the files still in the form, and any reset or delete link inside it, off the page; a saved file''s delete link placed after the container then sent no request; and the hidden fields the failed selection had added were submitted empty. While a staging was on the wire, a saved file''s delete link sent no request, and a staged file''s reset also took the new file''s hidden fields out of the form, so the form submitted no file while the page showed one. A new selection''s hidden fields are now written when its staging succeeds. Re-bake your bundles (#B960, #B961).'
