kind: Fixed
body: 'A worker child no longer takes over its bundle''s pid file. A worker is a child process whose entry is named `child.js` or `child-*.js` and that is loaded with `--argv-filename`: the framework imports its parent bundle''s context and registers it under the bundle''s name. It registered with a pid file, so it wrote its own pid into `<bundle>@<project>.pid` and removed the file when it exited. While a worker was running, `bundle:stop` signalled the worker instead of the bundle, and `bundle:restart` exited 0 while the old bundle kept serving: the new start failed on the port the old process still held, and `bundle:start` reported that as a success (#B851, fixed in the same release). Measured on a booted bundle and in an isolated daemon. A worker now registers without a pid file. Its `gina: <bundle>@<project>` title and its signal handlers are unchanged. The framework sets `process.isMinion` in it, so its exit never removes the bundle''s mount link. Pickup: no bundle restart, a worker spawned after the update registers the new way. A worker started before the update keeps the old registration until it exits: while it runs, the first `bundle:restart` ends only that worker and leaves the old bundle serving, and a second `bundle:restart` restarts the bundle (measured in an isolated daemon); that first restart now exits 1 instead of 0 (#B851, measured with a pid file naming another process). A bundle whose pid file an older worker already removed gets it back the next time the bundle starts (#B850)'
