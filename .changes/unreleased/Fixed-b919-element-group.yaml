kind: Fixed
body: 'A field carrying `data-gina-form-element-group="<id>"` now follows only the radio or checkbox it names: it is enabled, and sent, while that control is checked. Every radio, at page load and on every click, disabled every such field of the form and enabled again only its own, so a click on another radio left a checked master''s fields out of the posted data, a checkbox master''s fields too; at page load the fields of a master checked in the HTML were left out unless it was the last radio of the form; and a field whose group names no element was left out as soon as the form held a radio. A field now changes only with a master it names, and a field whose group names no element of its form is left as the HTML renders it. A checkbox that is disabled now counts as unticked for the fields that name it: a field naming a master and a checkbox grouped under it stays out of the data once the master is switched off, even with the checkbox still ticked, and a field naming a checkbox grouped under another checkbox is no longer sent while the outer one is unticked. Browser-bundled: restart the bundle and re-bake your bundles (#B919).'
