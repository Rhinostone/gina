kind: Fixed
body: 'FormValidator #B87 — the `query` rule''s async result path is now blanket-guarded so a throw can never hang the submit pass. The XHR result lands asynchronously: by processing time the form may have been unbound or the field detached (e.g. a popin closed mid-flight) and the response body is backend-controlled — any throw while handling it left the `asyncCompleted` waiter unfired and the submit path hung for the whole pass (the old `xhr.onload` catch rethrew instead of releasing). The result handler is now a guarded wrapper that warns and releases the waiter on failure (field state as-is; the server re-validates on submit), `xhr.onerror` is guarded the same way, the query value normalisation only lowercases strings (a boolean checkbox routed through a `query` rule no longer throws), and `compileError()` tolerates a non-string error. Browser-bundled: consumers pick the fixes up at their next bundle re-bake.'
