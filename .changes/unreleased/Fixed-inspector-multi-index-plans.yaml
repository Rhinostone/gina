kind: Fixed
body: 'Fixed the dev Inspector reporting every multi-index Couchbase query as "no index — full bucket scan". The plan walker behind the Query tab''s index badges followed only the generic child containers, while the multi-index operators (IntersectScan, UnionScan, OrderedIntersectScan) nest their child scans under a dedicated scans array — and DistinctScan under a singular scan — so any query the planner served with more than one index returned an empty index list and rendered the red no-index badge and banner. That failure invited exactly the wrong response: building an additional index, with its cluster-wide build cost and permanent write amplification, for a query that was already fully indexed. The walker now visits both nested-scan containers, so such plans report every index they use; index names are still deduplicated, and single-index, primary-scan and USE KEYS reporting are unchanged. Server-side only — a bundle restart picks it up, no asset rebuild needed.'
