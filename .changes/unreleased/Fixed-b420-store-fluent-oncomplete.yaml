kind: Fixed
body: 'Fixed #B420 -- the documented fluent upload-persistence form `self.store(target).onComplete(cb)` threw `TypeError: self.store(...).onComplete is not a function` on every recent stable (v0.6.0 through v0.6.15): `store()` was accidentally declared `async`, so the deliberate `{ onComplete }` facade came back wrapped in a Promise that carries no `onComplete`. The declaration is no longer `async` -- the body contains no `await` and nothing anywhere awaits the call, so no behaviour depended on the promise -- the facade returns synchronously as the guide documents, and the 3-argument callback form `self.store(target, files, cb)` is byte-unchanged. The TypeScript declaration now describes the fluent return shape instead of `Promise<void>`.'
time: 2026-08-25T03:29:26+01:00
