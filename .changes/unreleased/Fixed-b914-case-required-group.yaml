kind: Fixed
body: 'A radio or checkbox group that only a `_case_` condition makes required is checked from the first submit once the condition applies. The validator collects an unchecked group only when the group''s own rule says `isRequired`, so a check refused the group only after an earlier check had written the condition''s rule into the form''s stored rules: with live checking off, or a radio button as the driving field, the first submit went out without the group, and with a `$` reference in the rule set every submit did. The matching condition now enters the unchecked group as an empty value, and the required check refuses the submit until a member is picked. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B914)'
