kind: Fixed
body: 'Retiring the published claim that gina ships a companion reverse-proxy service (#MS8). The service help text, its JSDoc and the docs-site CLI pages all named `proxy` as one of two framework-internal services you could start, and `gina service:list` reported it with status ok - for a bundle that cannot serve a single proxied request. Measured rather than assumed: the bundle does carry forwarding logic (it reads a Target-URL request header, handles the OPTIONS preflight and pipes an upstream response back), but the HTTP client it calls is never imported and is not a framework global, so any request carrying that header throws a ReferenceError. The internal note claiming the bundle had no proxy logic at all was therefore wrong in its reason while right in its conclusion, and is corrected at source so a later session does not re-derive it. Nothing is being taken away from anyone: the services directory is CLI-generated, gitignored and npmignored, and the published tarball was checked to contain zero entries for it against a firing control, so no release ever carried the bundle the text advertised. The same wording was inaccurate about the other service too - it said these bundles ship alongside gina, which is true of neither - so the sentence now states plainly that services live in a maintainer-side tree outside the published package and that a released install has nothing to list until that tree exists locally. In its place each surface carries the stance: gina ships no edge or reverse proxy by design, run nginx, Traefik or an ingress controller in front of your bundles. That is not a new position, it is the one the rest of the documentation already assumed - the authentication guidance sends OAuth deployments behind a reverse proxy, the rate-limiting roadmap row names your reverse proxy or ingress as the interim answer, and the Kubernetes guide is ingress-fronted throughout - so this aligns four surfaces with one that disagreed. No roadmap row ever promised a built-in proxy, so nothing planned is being cancelled. The dormant bundle is deliberately left on disk: nothing reads it, and deleting generated local state is the operator call. Docs and help text only, no runtime behaviour change; pickup is a bundle restart with no re-bake'
