kind: Fixed
body: 'Built-in HTML error pages are now conforming documents. The fallback page served when a project has no custom error template emitted no doctype (so browsers rendered it in quirks mode), no head, no title and no lang attribute — and on HTTP/1.1 it closed the body with an *opening* `<html>` tag, so the document never terminated. Both engine branches now ship a doctype, an `<html lang>`, a `<title>`, and a `<main>` landmark; the status and incident ref the page already showed are unchanged. This is the default path: a scaffolded project ships no `templates/html/errors/` directory, so it is what an unhandled 500 actually serves. Separately, the `lang` value gina emits is now normalised to BCP-47 wherever it appears — `en_CM` becomes `en-CM` and an `accept-language` q-value such as `fr;q=0.9` is reduced to `fr`, falling back to `en` rather than emitting a tag assistive technology cannot parse. This covers `page.view.lang`, the layoutless/iframe wrapper and the three nunjucks error fallbacks. Server-side only — running bundles pick it up at restart, with no rebuild required.'
