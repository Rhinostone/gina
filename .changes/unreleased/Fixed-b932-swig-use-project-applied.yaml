kind: Fixed
body: 'A running bundle now applies `swig.useProject` and `swig.package`. Since these settings were introduced, a booted bundle ignored them and rendered with the framework''s `@rhinostone/swig`: a Twig, Jinja2 or Django template went through the native swig parser (`{{ ''a'' ~ ''b'' }}` rendered `a`), the log said « second bundle requested … ignoring » with no second bundle, and a pinned `@rhinostone/swig` in the project was never loaded, without a log line. The bundle now loads the package its settings select when it starts and logs `[swig-resolver] using project <package>@<version>`. Two consequences: a bundle that sets `swig.useProject: true` now renders with the project''s own `@rhinostone/swig`, so check that version; and a bundle whose `swig.package` names a frontend it cannot load now stops at startup with the `SWIG_PACKAGE_UNAVAILABLE` error (#B925) instead of rendering through the native parser. Restart the bundle (#B932).'
time: 2026-10-20T17:24:13+01:00
