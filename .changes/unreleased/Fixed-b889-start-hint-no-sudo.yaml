kind: Fixed
body: 'When the framework is not running, a command that needs it, such as `gina bundle:start`, now tells you to start it with `$ gina start`. It used to say `$ sudo gina start`, but gina needs no elevated privileges: the framework runs as the current user, and its pid files go under the npm prefix, or to `~/.gina/run` when the prefix is not writable. `INSTALL.md`, which gave the same advice, now points to the installation guide. Nothing to restart. (#B889)'
time: 2026-10-15T21:03:18+01:00
