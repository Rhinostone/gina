kind: Fixed
body: 'Fixed the control-plane dial regression introduced by the 0.5.26 loopback bind default: CLI-side clients (the command socket, the MQ speaker and file log containers, and `gina tail`) dialled `host_v4` while the daemon binds `bind_host`, so any deployment whose `host_v4` is a non-loopback address of the same machine — the common containerized shape — could not reach its own daemon and `bundle:start` aborted before the HTTP server ever bound. Clients now resolve the dial host through a locality check: a `host_v4` naming one of the machine''s own interfaces dials the bind address (loopback by default, or `bind_host` when it is a concrete non-wildcard address), while a genuinely remote `host_v4` is dialled unchanged. The bind side is untouched, and the connection-refused error now names the dial target and the `bind_host` knob.'
