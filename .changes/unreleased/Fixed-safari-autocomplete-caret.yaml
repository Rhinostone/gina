kind: Fixed
body: 'FormValidator: on Safari, fast typing into a live-checked `autocomplete="off"` text input no longer scrambles the text (gh issue #63). The keydown interception restored the caret only two timer hops after each programmatic value rebuild — and a value assignment parks the caret at the end of the field — so a quick second keystroke read a stale position and characters landed at the end instead of at the caret. Every rebuild now commits the caret synchronously and records the intended position on the element; while a deferred restore is still in flight the interception trusts that recorded position, and the restore re-asserts the latest committed position instead of a stale per-keystroke capture. The transient-readonly autofill suppression is mechanism-unchanged. Browser-bundled: rebuild your bundles to pick it up.'
