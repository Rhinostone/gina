kind: Changed
body: 'Two controller events fire less often now that the fluent `{onComplete}` handles deliver per call (#B475). `query#complete` is emitted on the controller only when nothing consumed the outcome — no callback and no `.onComplete()` — one tick after settlement; a fluent query that registers a callback no longer emits it (no in-tree or documented listener existed). `''uploaded''` is no longer emitted for the fluent `store(target).onComplete(cb)` form (never a documented `@fires`; the callback form never emitted it). Also, `query()` in callback form now returns `undefined` on every path instead of an unusable per-transport handle object on success, and an explicit `null` callback selects the fluent form instead of throwing `callback is not a function` at delivery time.'
time: 2026-09-05T04:59:26+01:00
