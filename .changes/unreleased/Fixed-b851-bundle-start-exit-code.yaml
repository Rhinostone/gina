kind: Fixed
body: '`gina bundle:start` now exits with a code that says whether the bundle started. It exited 0 for every outcome: a crash during startup, a port another program holds, the startup timeout, a refusal and a bundle already running (measured in an isolated daemon). It now exits 0 when the bundle listens, or when it already runs (its pid file names a running process titled `gina: <bundle>@<project>`); 1 when another program holds the port, with a line that names the port and, outside Windows, a command that finds the holder; the bundle''s own exit code when it stops before it is ready (1 when that code is 0), or 128 plus the signal number; 1 on the startup timeout and on a refusal, such as a bundle the project does not declare or a `scopes` allow-list; and for `bundle:start @<project>`, 1 when any bundle failed. A bundle that already runs is not started again: the command prints `[ <bundle>@<project> ] is already running with PID [ <pid> ]`. A bundle that exits 0 before it is ready, and one whose process cannot be spawned, are reported at once, where the command waited for the 64 s timeout. The command no longer stops early when node cannot bind the debugger port (`--inspect`): the bundle starts without the inspector, and the command waits for it and reports it. `project:start` and `bundle:restart`, which run `bundle:start`, exit 1 when it exits non-zero, whatever its code. Pickup: restart the framework (`gina framework:restart`); until then the command behaves as before (#B851)'
