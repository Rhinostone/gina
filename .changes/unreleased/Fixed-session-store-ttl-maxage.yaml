kind: Fixed
body: 'Fixed session-record TTL resolution in the redis, sqlite, mongodb and scylladb session stores: an implicit one-day default made the cookie-`maxAge` fallback in `set()`/`touch()` unreachable, so the stored record''s lifetime ignored the session cookie unless a `ttl` was configured explicitly — a 1-hour cookie left its record alive server-side for 24 hours, and a 7-day cookie was silently cut to 24 hours. When neither the store options nor the connectors.json `ttl` is set, the record TTL now follows the cookie''s `maxAge` (one day only when the cookie has none), matching the Couchbase session stores. An explicitly configured `ttl` still wins over `maxAge`. Note this moves record lifetimes in BOTH directions relative to the old accidental 24-hour cap.'
