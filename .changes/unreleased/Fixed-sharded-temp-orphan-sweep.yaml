kind: Fixed
body: 'A `sharded` storage driver now reclaims temp files left behind by a `put()` whose PROCESS died, instead of accumulating them forever. `cas` has always done this at build and `stream` has its own age-gated pass, which left `sharded` as the one strategy where the leak was permanent — no verb ever looked at those files again, so the only cure was deleting them by hand. The sweep runs at build time, which is both the right trigger and the only safe one: a restart is the earliest moment the previous process is provably gone. It is gated on `sweepGrace`, the same key, default (`"1h"`) and meaning `cas` already uses, which is now accepted on a `sharded` driver rather than warned about as an ignored key. Only temps older than the grace are touched — on a root shared by several bundles or replicas a fresh temp may be a sibling process''s live write, and eating it would corrupt a put in flight. `sweepInterval` deliberately stays `cas`-only: `sharded` sweeps at build and has no periodic pass to configure. Nothing to turn on, and no migration — if you have orphans from before this release, starting the bundle clears the ones past the grace.'
