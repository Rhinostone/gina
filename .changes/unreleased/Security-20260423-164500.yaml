kind: Security
body: >-
  Replaced the two eval-based sites in `lib/collection/src/main.js` with a safe
  expression parser and a dot-path walker (#SCS1d). The `tryEval` function —
  called from four internal sites (lines 310, 314, 406, 411) when a filter
  contains `<`, `>`, or `=` — used to `eval(_content + filter)`. The line-411
  variant had no quote-wrapping, so a filter value like
  `{'rating.score': '> 0; throw new Error()'}` reached eval unsanitised and
  executed. The body is now a regex-based evaluator over the closed grammar
  `<operand><op><operand>` where operand is a number literal, a `"string
  literal"`, or a `new Date("...")` expression, and op is one of `=== !== ==
  != < > <= >=`. Anything else throws `Could not evaluate condition`. The
  sibling `eval('_content.' + f)` inside `searchThroughProp` used to eval a
  user-controlled property path (the filter-object key), which accepted
  arbitrary JS — a key like `constructor.constructor('return ...')()` would
  fire on lookup. It is now a dot-path walker that rejects any non-identifier
  character. The `skipEval: true` bypass path is untouched (it was already
  eval-free). No public API change; the 15 pre-existing Collection tests pass
  unmodified; 7 new tests lock the guarantee (source-inspection, date-compare
  coverage fill, injection rejection). The browser bundle picks the fix up on
  next `core/asset/plugin/build` rebuild because
  `core/asset/plugin/src/vendor/gina/build.json:21` aliases `lib/collection`
  to the same server-side source.
