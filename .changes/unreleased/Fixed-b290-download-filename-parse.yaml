kind: Fixed
body: 'Fixed the client-side blob-download filename parse (both the shared XHR handler and the validator''s copy): a `Content-Disposition` without a `filename` parameter no longer throws mid-download — the browser derives a name instead — and an RFC 6266 quoted-string filename is unquoted and unescaped rather than saved with its surrounding quotes; a trailing extended parameter is no longer folded into the name.'
