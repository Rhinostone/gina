kind: Added
body: 'Adding an opt-in per-authority circuit breaker to Controller::query() (#MS5, settings.json > server.query.circuitBreaker): after N consecutive transport-class failures to one authority (default 5, each already representing a call whose own retries were exhausted), the circuit opens and every further call fails fast with a machine-readable CIRCUIT_OPEN error (status 503, retryable false, plus the authority and retryAfterMs) instead of hammering a dead upstream; after the cooldown (default 30s) exactly one critical request is admitted as the half-open probe, closing the circuit on success and re-arming it on failure. The gate sits above the HTTP/1.x / HTTP/2 protocol dispatch, so an open circuit rejects before any connection, retry or pre-flight machinery runs and the existing retry invariants are untouched - retries can never hammer an open circuit by construction. Three decisions are load-bearing and documented in-source. Only transport-class errors count: every GinaHttp2Error plus the socket-level ECONN family, checked on err.code and err.cause.code - an application response, whatever its status, flows through the success terminus as data, and a caller bug is neutral, so neither can trip the breaker on a healthy upstream. Only a CRITICAL request may serve as the half-open probe, because a non-critical failure is swallowed by the H3 contract - its callback never fires - so a non-critical probe could never report back and would wedge the half-open state forever. And breaker state lives on the engine instance, the same home as the HTTP/2 session registry, because dev mode re-requires the controller per request: anywhere else the state would reset on every hot-reload, while instance state survives reloads and dies on restart, which is exactly the lifetime circuit state wants. Dormant unless enabled is strictly true; a structurally invalid enabled block refuses the boot rather than warn-and-disable, since silently running without the protection the operator asked for is the fail-open shape the other boot bands refuse. Policy is resolved once at engine start and stamped on the instance, so config changes need a bundle restart. Server-side only, so pickup is a bundle restart with no re-bake'
