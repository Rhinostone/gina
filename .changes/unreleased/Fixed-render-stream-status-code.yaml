kind: Fixed
body: 'renderStream() now honours a caller-set response status on BOTH engines (#B351). The HTTP/2 arm built its `stream.respond()` frame with a hardcoded `'':status'': 200` pseudo-header, and the HTTP/1.1 arm assigned `response.statusCode = 200` unconditionally inside its not-yet-sent block, clobbering a code the controller had already chosen — so renderStream could only ever answer 200 and `206 Partial Content`, `416` and `404` were unreachable through it on either engine. Both arms now resolve `response.statusCode || 200`, so a controller may pre-set the status before streaming; the 200 fallback is unchanged when none is set, and the pending-header merge still refuses to overwrite `:status`. Same defect class as #B172 (render-json): a hand-built HTTP/2 frame must never carry a literal status, because `setHeader('':status'', …)` throws and no later merge can repair a pseudo-header.'
