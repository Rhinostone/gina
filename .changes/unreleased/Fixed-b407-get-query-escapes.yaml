kind: Fixed
body: 'GET and HEAD query parameters no longer lose backslash-escaped characters (#B407, consumer-reported). The query pipeline serialized `request.query` and then stripped every backslash from the whole document to support nested-JSON value unwrapping - so a newline (`%0A`) in a value degraded to the letter `n`, a tab to `t`, a backslash vanished, and a double quote or a JSON-array value produced invalid JSON that silently dropped EVERY query parameter on the request. Nested-JSON string values (`?filter={"a":1}`) are now unwrapped by parsing them individually - the same unwrap intent, validated, and correct even when the nested content itself carries escapes, which the old unwrap also corrupted - and the query then serializes cleanly. Whole-value `true`/`false`/`on`/`null` coercion and plain values are unchanged; JSON-array parameters and unparsable `{`-leading values now arrive intact where they previously killed the whole query.'
