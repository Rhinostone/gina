kind: Fixed
body: '`gina project:add` and `gina project:import` no longer destroy `manifest.json` bundle declarations when the declared bundle count differs from what is on disk (#B375). Previously, ANY count mismatch made those commands empty the whole `bundles` block and rebuild it from the directory listing — dropping every key the rebuild template does not carry (the new `scopes` allow-list, `gina_version`, any custom key) and resetting each bundle''s `version`, `tag` and release targets to defaults — and the reset hit EVERY registered project on the machine, not just the one being added or imported: a bystander project got no rebuild at all and was left with a permanently empty `bundles` block that fails its next boot. Plain `project:add` suffered the same total loss, since only the import path rebuilds. The commands now treat the manifest as the authority: declared bundles are preserved untouched, bundles found on disk but missing from the manifest are still registered additively on import (the legitimate function the old reset served), and a declared bundle whose directory is absent is reported with a warning naming the bundle and the scanned location — never auto-pruned, since the declaration may be deliberate (e.g. a bundle restricted to other scopes). Removing an entry for good remains `gina bundle:remove`''s job. Also guarded: importing a project whose manifest declares a bundle with no tree on disk no longer risks a crash in the port/settings pass.'
time: 2026-08-16T02:13:40+01:00
