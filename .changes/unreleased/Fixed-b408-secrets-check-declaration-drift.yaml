kind: Fixed
body: 'Aligned `gina secrets:check` with the runtime''s `settings.secrets.file` declaration guards by moving the validation to one shared implementation, exposed as `lib.secrets.validateFilePaths` (#B408): the checker''s hand-kept mirror had missed the whitespace-only-entry refusal and the empty-path-segment (`//`) refusal, so it reported GREEN configs the bundle refuses to boot — a whitespace-only entry, or a path whose `${…}` token collapsed to a double separator, now fail the check exactly as they fail the boot. The check also validates the declaration before reading any declared layer, as the boot does, so an invalid chain reports with no layers listed.'
time: 2026-08-23T15:11:43+01:00
