kind: Added
body: '`lib.authn.createLockout()` adds an account-lockout engine — the credential-stuffing brake. Call `check(key, cb)` before spending a KDF so a locked account never reaches one, `recordFailure(key, cb)` on a failed attempt and `recordSuccess(key, cb)` on a good one; `reset(key, cb)` lifts a lock administratively. Defaults follow PCI-DSS v4.0.1 §8.3.4 — lock after 10 consecutive failures, for 30 minutes. The key is yours to choose (a user id, an email, an `email:ip` pair) because gina does not own the user record; pass `normalizeKey` whenever it comes from user input, or case variants of the same address each get their own counter and multiply the threshold. State lives in memory by default, which is per-process — pass a shared `store` (the same callback-shaped `get` / `set` / `del` contract the job and audit seams already use) for multi-replica correctness. Operations on a key are serialized, so failures arriving concurrently cannot each read the same counter and lose the count. Crossing the threshold writes one `auth.lockout` audit record on the transition, not one per attempt. Lockout is per-ACCOUNT and counts credential failures; it is not request-rate limiting, which is per-CLIENT and is tracked separately on the roadmap — the two defend different axes and neither substitutes for the other.'
