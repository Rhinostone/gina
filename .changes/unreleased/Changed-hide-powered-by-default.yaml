kind: Changed
body: '`settings.json > server.hidePoweredBy` now defaults to `true`, so the framework no longer advertises its name and exact version on every response. A version banner is free reconnaissance for an attacker and buys the operator nothing. Set it back to `false` to restore the previous behaviour. One interaction worth knowing: with the render/output cache enabled and `server.cache.name` unset, the new default raises the existing boot warning about the cache still naming the framework on the wire via `Cache-Status` — set any token there to close that disclosure too (#OW1)'
time: 2026-09-02T12:42:53+01:00
