kind: Added
body: 'The `s3` storage adapter — the last step of the pluggable object-storage layer (#STO1): `adapter: ''s3''` plus a `bucket` in a `settings.json > storage` driver stores objects on any S3-compatible provider (AWS S3, Scaleway, MinIO, R2…) under the sharded key grammar, namespaced by an optional `prefix`. Storeless by design: the provider carries each object''s metadata on the object itself (Content-Type, plus the original name as URI-encoded user metadata — immutable after upload, like the key), so there is no metadata store, no tiering, and no drift class to verify; `stat()` is a strongly-consistent HeadObject, and the docs ship the minimal IAM policy (without `s3:ListBucket`, a missing key answers 403 instead of 404). The SDK stays the PROJECT''s dependency — the connector policy: install `@aws-sdk/client-s3`, `@aws-sdk/lib-storage` and `@aws-sdk/s3-request-presigner` in your project, and a configured s3 driver whose SDK is missing refuses the boot with that hint. `resolve()` answers the contract''s reserved `{kind: ''url''}` with a presigned GET (`presignExpiry`, default `''15m''`) and gains an optional middle `opts` argument carrying response overrides (`contentType`/`download`/`filename`/`cacheControl` → the provider''s signed `response-*` params; local strategies accept and ignore it). `capabilities.offload` flips true for the first time and `self.serveFromStorage()` becomes its first consumer: GET/HEAD answer 307 to the presigned URL — after the local If-None-Match 304 check, with the fail-closed content-type downgrade riding the signed `response-content-type` so the stored-XSS guard holds when the provider serves the bytes, and with Range answered natively by the provider — while `opts.offload: false` keeps the in-process proxy path (`get`/`getRange` are real). Static credentials (`accessKeyId`/`secretAccessKey`, `${secret:KEY}`-friendly) are optional: omitted, the SDK default provider chain (env / shared config / IMDS / IRSA) runs. A build-time age-gated sweep aborts incomplete multipart uploads older than `sweepGrace` — they bill storage until aborted, the s3 analog of a crashed-put temp file — with a bucket lifecycle rule recommended as defense-in-depth. `cas`/`stream` refuse the s3 adapter at boot with an explanation (the provider owns placement), and the `storage:*` CLI names s3 drivers as remote, skipping them offline.'
