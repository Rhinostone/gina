kind: Fixed
body: 'A failed `node_modules` link no longer reads as a successful start. With gina installed globally, `bundle:start`, `bundle:stop`, `bundle:restart`, `project:start`, `project:stop` and `project:restart` first run `gina framework:link-node-modules` and `gina framework:link` for the project. Those commands write their errors on their standard output and only the error output was read, so a failure gave an empty message and exit code 0: `bundle:start` reported success with nothing started. The command now exits 1 with `` `gina framework:link-node-modules @<project>` failed (exit code 1): `` followed by that command''s output, which holds the reason, and `gina framework:link` reports that reason instead of a bare `Error`. A framework already running picks this up after `gina framework:restart`. (#B905)'
time: 2026-10-16T19:21:50+01:00
