kind: Fixed
body: 'lib.routing.getRoute() no longer repeats in the query string a value it wrote into the path. On a rule whose requirements do not declare the key, as in the routing guide''s example ("url": "/invoice/:id", "param": { "id": ":id" }), getRoute(''invoice'', { id: ''abc-123'' }) composed /invoice/abc-123?id=abc-123 and now composes /invoice/abc-123. A placeholder the rule does not bind in param keeps its value travelling as a query parameter. (#B943)'
time: 2026-10-21T13:48:58+01:00
