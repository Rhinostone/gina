kind: Added
body: 'Opt-in Subresource Integrity for the asset tags gina emits: set `"sriEnabled": true` in `templates.json > "_common"` and every same-origin `<script>` and `<link rel="stylesheet">` whose file resolves on disk gains `integrity="sha384-..."` plus `crossorigin="anonymous"`, so a tampered or truncated asset is refused by the browser instead of executed. Fail-open by design: external URLs, unresolvable paths and unreadable files simply get no attribute — a wrong hash would hard-block the asset, so nothing is ever guessed. Hashes are cached per file and re-validated by mtime and size on every render, which means a rebuilt asset gets a fresh hash with no restart. Two operational notes: pages already stored by the render/output cache keep the hash they were rendered with, so flush that cache after rebuilding assets; and the HTTP/2 preload hint is suppressed for integrity-checked assets, since a hint carries no integrity metadata and a mismatched preload would be a wasted double fetch (#OW3)'
