kind: Fixed
body: 'A project file that cannot be used no longer stops the framework started by `gina start`. `gina bundle:start` now exits 1 with `<file> cannot be used: <reason>`, the reason naming the path, when the project''s `manifest.json` is malformed or unreadable, or its `env.json` or `package.json` is malformed. Before, each of these stopped the framework itself: the command printed only « the framework ended this command before it reported the outcome », and every later command needed `gina start` again. A malformed `manifest.json` in another registered project is now skipped with an error line, as a missing one already was; before, it made `bundle:start` exit 0 without starting anything. When the project''s `manifest.json` is missing, `bundle:start` now refuses the bundle as not registered instead of failing with a TypeError. Other commands that read the project''s configuration, such as `bundle:status` and `project:status`, report a malformed or unreadable `manifest.json` or `env.json` with the same one-line message. A framework already running picks this up after `gina framework:restart`. (#B890)'
time: 2026-10-16T18:06:45+01:00
