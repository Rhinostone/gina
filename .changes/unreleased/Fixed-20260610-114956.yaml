kind: Fixed
body: 'Fixed the dev-mode Inspector statusbar and its launch link disappearing on content-heavy pages. The framework spliced its inline dev scripts before the closing body tag with a plain-string String.replace, so special dollar patterns in the injected content (a backtick or quote in the statusbar template, or SQL dollar placeholders in the captured flow log) expanded and corrupted the injected script. The affected splices now use function replacers.'
