kind: Fixed
body: 'FormValidator: on a form with an async `query` rule and a committed error, a refused submit''s answer could render, take focus, and then be hidden again milliseconds later when the click landed while a previous validation round was still settling — the late completion''s display refresh read the answered field as "being typed in" (it was the active element) and re-hid the very message the answer had just rendered. The error message and its field focus now stay put: the framework records that the focus was placed by the answer rather than by the user, both display-refresh paths honour that record however late they run, and the first genuine user interaction (typing, clicking, tabbing away) releases it so the deliberate hide-while-typing behaviour is unchanged.'
