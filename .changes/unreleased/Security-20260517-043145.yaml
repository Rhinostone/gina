kind: Security
body: 'Added `gina.plugins.Hsts({ maxAge, includeSubDomains, preload })` — opt-in middleware that emits the `Strict-Transport-Security` response header on every response (#HDR4). Instructs browsers to access the host exclusively over HTTPS for the next maxAge seconds — defeats SSL-stripping attacks once the policy is in effect. Three configuration fields: `maxAge` (number, seconds, default 15552000 = 180 days), `includeSubDomains` (boolean, default false), `preload` (boolean, default false). Caller options always win over settings. Browser-parity invariant on `preload`: `preload:true` requires `includeSubDomains:true` AND `maxAge >= 31536000` (1 year) per the HSTS preload-list submission requirements (https://hstspreload.org/#deployment-recommendations); the factory throws at call time on invariant violations. Also throws on non-integer / negative / NaN / Infinity `maxAge`. Header value built per RFC 6797 §6.1 directive order (`max-age=<n>; includeSubDomains; preload` with max-age first and the optional directives appended in order when their fields are true). Spec deviation documented in README: emits on every response regardless of transport, matching helmet''s behaviour — RFC 6797 §7.2 says senders MUST NOT include the header on HTTP, but §8.1 receiver MUST IGNORE makes the practical wire outcome identical. Design favours proxy-deployment robustness (no dependency on `x-forwarded-proto` being preserved by intermediaries) over sender-side spec purity. Idempotent — first-writer-wins. Files: `core/plugins/lib/hsts/{src/main.js, package.json, README.md}`, registered in `core/plugins/index.js`. Settings template seeds the three-field `hsts` block with `#HDR4` comment header. Boilerplate `core/template/boilerplate/bundle/index.js` advertises the adoption example alongside #HDR1/#HDR2/#HDR3 with the HTTPS-only note. 69 unit tests in `test/core/hsts-plugin.test.js` (full suite 5643/5643, prior 5574 + 69). **Fourth and final Phase 1 plugin on the `#HDR` Web Security Headers track** — closes the Phase 1 quartet of static-value response headers (X-Content-Type-Options + X-Frame-Options + Referrer-Policy + HSTS). Phase 2 (`Csp` #HDR5 + `CrossOriginPolicies` #HDR6) is deferred to `0.4.0` — dynamic / higher-break-risk headers that require template-render integration or can break legitimate cross-origin loads.'
