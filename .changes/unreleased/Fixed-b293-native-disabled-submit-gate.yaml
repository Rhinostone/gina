kind: Fixed
body: 'A form''s submit trigger no longer stops responding to clicks when your own
  code sets the native `disabled` attribute on it during the click — the shape used
  by the common double-submit guard, where a click handler disables the button to
  block a second submit. Since 0.6.4 the trigger''s disabled check accepted that
  attribute, so the click was cancelled before anything was sent; because the page
  then cleared the attribute again, the button looked perfectly normal and every
  further click was swallowed just as silently. The native attribute is now honoured
  only on elements where the browser does not already enforce it (anchors, custom
  elements) — on a real form control the browser suppresses the click itself, so the
  check was never what protected you there. Forms gated by gina''s own aria-disabled
  marker are unaffected and still cannot be submitted while invalid.'
