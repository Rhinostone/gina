kind: Added
body: '`settings.json > server.maxBodySize` bounds non-multipart request bodies, which previously accumulated with no ceiling at all — a single large body was an unbounded-memory exposure (OWASP A10). A body past the limit is answered 413 and the stream is destroyed. The default `64MB` is deliberately permissive: the ceiling exists to stop unbounded growth, not to police payload shapes, and gina''s own inter-bundle `self.query()` hop posts through the same pipeline. A companion `server.maxBodySizeWarn` (default `2MB`) only logs, so you can measure your real distribution before choosing a stricter ceiling. Both accept B/KB/MB/GB (a bare number means MB); `0` disables either. Multipart uploads are unaffected — they remain capped by `upload.maxFieldsSize`. `server.timeout` is now configurable too, and stays `0` (unlimited) by default on purpose: a finite whole-request clock would kill Server-Sent Events and WebSocket connections, and the slow-body case it would otherwise cover is already closed by the body cap (#OW2)'
