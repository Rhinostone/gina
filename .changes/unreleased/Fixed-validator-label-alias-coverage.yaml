kind: Fixed
body: 'Validator error labels: translating the key an app can observe in a field''s `errors` object now works for the four rule families that consult a different label key internally — the float coercion''s NaN branch (`toFloat` fills `toFloatNAN`) and the number/integer/string length families (the generic `is<X>Length` fills the `Min`/`Max` variants); an app-supplied specific key still wins. Numbered `is` aliases (`is1`, `is2`, …) with no rule-supplied text now fall back to the shared `is` label instead of rendering an empty message. And catalog or `setErrorLabels()` translations for user-defined validator keys are no longer clobbered by the English default at setup. Apps that translated only observable keys will see those messages switch from English to their language at pickup.'
time: 2026-07-30T05:08:34+01:00
