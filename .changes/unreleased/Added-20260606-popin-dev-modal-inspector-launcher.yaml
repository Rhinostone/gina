kind: Added
body: 'In development, dialog-mode popins now open as native modals (matching production), and a small "Inspector" launcher is injected inside the popin dialog so the Inspector stays reachable above the modal backdrop. Previously dev popins were downgraded to non-modal to keep the in-page Inspector statusbar usable; the in-dialog launcher removes that compromise, giving dev/production parity. Production behaviour is unchanged. The statusbar shim now also exposes window.ginaToolbar.openInspector().'
time: 2026-06-06T12:00:00Z
