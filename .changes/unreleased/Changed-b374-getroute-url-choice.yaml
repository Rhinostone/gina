kind: Changed
body: 'Without urlIndex, lib.routing.getRoute(), and the getUrl template filters that call it, compose for a rule with several urls ("url": "/a/:id, /a/:id/:mode") the first url whose placeholders all receive a value, preferring among those the url that uses the most values; when no url is complete, the url that receives the most values, ties going to the first url. Before, the first url was always composed, so a call could leave a literal placeholder in the url (getRoute(''logout'') on "/logout/:timestamp, /logout" gave /logout/:timestamp and now gives /logout) or lose a value bound to another url. A rule whose urls carry the same placeholders, one url per language for instance, still composes its first url, and a value counts as given when it is not undefined, as for the fill itself. To keep composing the first url, pass urlIndex 0: getRoute(''logout'', {}, 0). (#B374)'
