kind: Fixed
body: 'A Couchbase entity that fails to register now says so, naming itself. `readSource()` guards the whole entity-class construction and `.sql`-derived method attachment under one try, and its catch emitted only a bare stack — while none of its three call sites captures a result or takes an error argument. A throw there therefore left the entity partially built, or absent, with nothing in the log identifying which entity or which `.sql` file was responsible; the first symptom was a missing method at request time, arbitrarily far from the cause. The catch now emits a named diagnostic carrying the entity, the source file, the method being attached and the underlying cause, and still emits the original stack. Boot behaviour is deliberately unchanged: registration failures remain non-fatal, since making an unbuildable entity fatal would stop projects that boot through a swallowed error today. (#B461)'
