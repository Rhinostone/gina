kind: Fixed
body: '#B219 — `pauseRequest()` now snapshots the byte-exact incoming URL (`req.originalUrl || req.url`), completing the #B215 halted-GET replay: the isaac engine strips the query string from `req.url` before controllers run (the query is parsed into `req.get`), so the snapshot — and therefore the #B215 byte-exact replay — was path-only on that engine and a query-bearing halted GET still replayed without its query (500 on `:key`-substituted template paths). The engine preserves the full URL on `req.originalUrl` (stamped before the strip; express sets it natively and never strips), so replays now carry the query on both engines, verified live over HTTP/1.1 and HTTP/2. `haltedRequestUrlResumed` accordingly records the full replayed URL — middleware comparing it to `req.url` by equality should compare against `req.originalUrl || req.url` instead. Snapshots taken before this fix replay exactly as captured.'
time: 2026-08-02T18:35:00+01:00
