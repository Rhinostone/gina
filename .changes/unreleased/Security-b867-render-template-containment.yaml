kind: Security
body: 'A page template path that a controller took from the request — passed to `self.setTemplate()`, or written to `req.routing.param.file` in an action — could resolve outside the bundle template root, so a request could read any `.html` file the process can read, rendered through the template engine (CWE-22, the CVE-2023-25345 directory-traversal class). The router''s own placeholder fill has been guarded since #B833, but these values reach the swig renderer by other paths: its setTemplate, namespace and `param.path` branches joined the value under the root unchecked, its first-character check let a `..` in the middle of the path through (and, for a path starting with `.`, checked one path but read another, relative to the working directory), and a backslash-separated `..` survived path normalisation and traversed when the file was read, so a handler doing `self.setTemplate(''errors/'' + req.params.code)` read files outside the root from a `..` or `%5C` URL segment. The nunjucks renderer relied on its loader, whose prefix test accepted a sibling directory whose name starts with the root''s (`html2/` next to `html/`). Both renderers now check the path they are about to read and answer 500 when it resolves outside the section''s template root (`html` in templates.json); custom error pages are exempt. A bundle that renders templates kept outside that root widens its `html`. (#B867)'
