kind: Fixed
body: '`self.query()`''s fluent `.onComplete()` now rejects a non-function at registration. It minted a deliverer for whatever it was given, so `.onComplete(null)` or `.onComplete(''oops'')` registered silently and the `TypeError` only fired at settle — inside the delivery wrapper''s own try/catch, which turned it into a 500 "Controller Query Exception while catching back" that blamed the application callback for an exception it never had. `.onComplete()` now throws a `TypeError` synchronously at the caller''s line when given a non-function, mirroring `self.store()` (#B480); the minting guard on the call argument is unchanged, so `query(options, data, null)` still returns the handle. Behaviour change: a non-function registration fails at the caller instead of at settle — anything relying on the old behaviour was relying on a 500. Server-side only; pickup is a bundle restart. (#B485)'
time: 2026-09-06T03:35:10+01:00
