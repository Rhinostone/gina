kind: Security
body: >-
  Added `gina.plugins.XContentTypeOptions()` — opt-in middleware that emits
  the `X-Content-Type-Options: nosniff` response header on every response
  (#HDR1). The header instructs browsers to honour the declared
  `Content-Type` strictly, blocking MIME-sniffing attacks where a
  `text/plain` response whose body starts with `<script>` could be upgraded
  to HTML and the script executed in the page's origin. Per RFC 7034 /
  WHATWG Fetch Standard, `nosniff` is the only valid value. Adoption is two
  lines in the bundle bootstrap: `var xContentTypeOptions =
  require('gina').plugins.XContentTypeOptions(); app.use(xContentTypeOptions);`.
  Idempotent — if an earlier middleware already set the header, the
  existing value is preserved and `next()` is called immediately (first-
  writer-wins, so the plugin is safe to stack with helmet-style upstream
  gates). No `enabled` flag — register to opt in, don't register to opt
  out. Settings template seeds `xContentTypeOptions: {}` (block reserved
  for future fields like per-route opt-out; future additions don't need an
  API break). Files: `core/plugins/lib/x-content-type-options/{src/main.js,
  package.json, README.md}`, registered in `core/plugins/index.js`.
  Boilerplate `core/template/boilerplate/bundle/index.js` advertises the
  adoption example as a commented-out block alongside the #CSRF1/#CSRF2
  examples. Establishes the per-header response-middleware shape for the
  rest of Phase 1 (#HDR2 X-Frame-Options, #HDR3 Referrer-Policy, #HDR4
  HSTS) and opens the new `#HDR` (Web Security Headers) roadmap track. 33
  unit tests in `test/core/x-content-type-options-plugin.test.js`; full
  suite 5467/5467.
