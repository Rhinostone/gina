kind: Fixed
body: 'A validator query rule run in the browser sends its data when its method is GET, the default, HEAD or DELETE: in the url''s query string, each key once, an object value as its JSON text, with no body. The data only went to the request body, which a browser drops for a GET or HEAD and a gina receiver does not read for a DELETE, so such a rule sent none of its data to a gina endpoint, which answered about an empty request. A DELETE rule no longer sends a body: an endpoint of another kind (a url starting with http) that read the rule''s JSON body now finds the data in the query string. When the rule''s url already holds a query string, the data joins it with &, and a key the url already holds keeps the url''s value. A POST, PUT or PATCH rule still sends a JSON body. (#B951)'
