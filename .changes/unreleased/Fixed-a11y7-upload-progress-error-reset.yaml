kind: Fixed
body: 'Staged uploads are now announced and operable for assistive technology. A progress indicator that is not a native `<progress>` element carries `role="progressbar"` with `aria-valuemin`, `aria-valuemax` and `aria-valuenow`; the value is dropped rather than zeroed while the upload is indeterminate or has errored, so a screen reader reports an unknown state instead of stalled progress. A native `<progress>` is left untouched, since it already exposes all of this. The start and the successful completion of an upload are announced through the polite live region gina already owns — per-tick progress deliberately is not, as one announcement per progress event would bury everything else on the page. An upload error announces the server''s own message through that same region, rather than only writing it into a container that is hidden when the text lands and revealed by a fade-in. The auto-generated reset control is now announced as a button instead of a link, activates with Space as well as Enter, and names the file it acts on, with the visible label kept as a prefix so the accessible name still contains it; focus moves to the file input before the control is removed from the page, instead of dropping to the document with no signal. The three new strings are overridable per project through `gina.config.a11y`: `uploadStarted`, `uploadComplete` and `fileRemoved` (which takes a `%s` placeholder for the file name).'
