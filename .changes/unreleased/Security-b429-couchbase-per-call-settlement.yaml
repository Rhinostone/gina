kind: Security
body: '#B429 — concurrent calls to the same couchbase entity method no longer cross-deliver results. The completion trigger (`N1QL:<entity>#<method>`) carried no call identity, and the entity it was emitted on is a process-wide singleton, so the Promise / `await` / `.onComplete()` path settled from a shared listener. Node fires every listener registered for one emit, so the FIRST query to finish woke every in-flight caller of that method with its own payload and removed their listeners — a broadcast, not a queue. Two concurrent reads with different arguments could each receive the other''s rows; a third caller could receive an error belonging to a different call; and a single response could blend rows originating from two callers. This is a confidentiality and authorization concern, not only a correctness one: where the method reads a user-scoped or ownership-bearing record, one request could be answered with another request''s row, so a check performed on the returned row could pass for the wrong principal. Measured on the real connector, both directions: a call keyed on one id resolving with a different id''s row before the fix, and its own row after. Note the exposure was NOT limited to out-of-order completion — cross-delivery occurred even when the queries finished in the order they were started, so the guidance that the emit pattern is safe for in-order completion did not hold for this connector (that documentation is corrected in the same release). The explicit trailing-callback form (`entity.method(args, function (err, data) {})`, including `util.promisify`) was never affected: it already settled from its own per-call closure. Every path now settles that way, exactly once per call, and the trigger is emitted purely as an observability signal for the Inspector — which, as a side effect, now also sees direct-callback completions it previously missed. `bulkInsert` carried the same defect on its own dispatch and is fixed with it. Couchbase only: the other connectors settle on a per-call promise and were measured unaffected. Server-side only — pickup is a bundle restart, no re-bake.'
time: 2026-08-27T19:45:00+01:00
