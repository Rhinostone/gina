kind: Added
body: 'Links bound with `data-gina-link` now carry the same loading state as submit triggers. Clicking one sets `data-gina-loading="true"` on the anchor and flips it to `"false"` once the request settles — including the two outcomes that reach your handlers as silence today: a link superseded by a second click, and a request that fails at the network level. The state lands on the anchor itself even when the click hits an element nested inside it, and a link driven programmatically through `gina.link.request()` is armed the same way. One limit worth knowing before you style it: a link request that hangs never settles and so never releases, because link requests still have no deadline. As with submit triggers, style the running state with `[data-gina-loading="true"]` and never with a bare `[data-gina-loading]` — the attribute stays present when released, carrying `"false"`.'
