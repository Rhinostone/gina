kind: Changed
body: 'A URL placeholder''s value now wins over a query-string or body key of the same name, on every request. On a route `/items/:grp/:id` that receives `?id=99` or `{ "id": "99" }`, `req.get.id`, `req.head.id`, `req.put.id`, `req.patch.id`, `req.post.id` and `req.delete.id` now hold the URL value, as `req.params.id` does. Before, the first request to a method and path took the URL value on GET, HEAD, PUT and PATCH and every later request took the client''s value (#B957); a POST always took the client''s value, and so did a DELETE unless a regex requirement covered the placeholder (#B954). The client''s value stays readable in `req.originalUrl` on a GET, in `req.query` on a DELETE and in `req.rawBody` on a POST, PUT or PATCH. A URL segment `true`, `on` or `false` now reaches the action as a boolean on every request, where it did on the first request only, and on a DELETE only without a query string. `req.body` is now the same object as `req.post`, `req.put` or `req.patch` on the first request to a route too, as documented; it held the client''s keys only there. A top-level JSON array body is unchanged: `req.body` keeps the array. Restart your bundles (#B954, #B957).'
