kind: Fixed
body: 'Dev Inspector: the data tabs (Data, View, Forms, Query, Flow) now reliably track the page that opened the Inspector, instead of intermittently showing another browser tab''s data. When a bundle''s pages set `Cross-Origin-Opener-Policy: same-origin`, the browser severs the Inspector popup''s `window.opener`, which previously dropped the Inspector onto bundle-wide channels (the shared `localStorage` snapshot and the worker-wide `/_gina/agent` stream) that any open tab or background XHR could overwrite. The statusbar now opens the Inspector bound to the opener tab via a per-tab BroadcastChannel (`?ch=<tabId>`), so its data follows that one tab''s navigation and is immune to other tabs'' renders. No change when the Inspector is opened standalone (`?target=`) or directly by URL.'
