kind: Fixed
body: 'Collection.find(), findOne(), or() and update() now throw a descriptive Error - naming the offending key - when a filter object carries an undefined value, instead of silently dropping the key. Previously the internal JSON round-trip stripped such keys before matching, so a single-key filter degraded to the match-everything {} filter: findOne({ id: source.missingId }) returned the collection''s FIRST row instead of null, and update() with such a filter mutated EVERY record. ACTION REQUIRED if you relied on the old behaviour: build filters conditionally (only add a key when its value is defined) - an explicitly empty {} filter still means "no constraint" and null values remain legal needles. The refusal also hardens the FormValidator''s conditional-case rules lookup, which could previously merge the first condition''s rules when the case field was absent from the form.'
