kind: Fixed
body: 'A key of a `_case_` condition''s `rules` written as a regular expression (`"/^item[/": { "isRequired": true }`) now applies to every field it matches, wherever its `_case_` block sits in the rule set and whatever the shape of its `case`. Before, it applied only when its block was not the last `_case_` key of the rule set, and then only to the fields already collected: a key in the only or last block had no effect, and a key requiring checkboxes never refused an unticked one. The key is read as a top-level one is: `[` and `]` match themselves and the flags are kept; a field the condition also names literally keeps the literal key''s rules; the driving field is left out; a field such a key can make required is live-checked. A `$` inside such a key is never replaced by a field''s value, so a key carrying one matches no field, as before. What to check: a rule set whose regular-expression keys sat in its only or last `_case_` block now applies them, and checkboxes such a key requires must be ticked (several under one name: at least one; distinct names: each). Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B921)'
