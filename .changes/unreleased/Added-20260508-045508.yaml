kind: Added
body: 'Added `gina i18n:export <culture>` CLI command (#I18N1 slice 5 part 1). Exports a culture''s catalog from a project''s bundle(s) into JSON / PO / CSV format on stdout or a file. Three positional shapes mirror `i18n:add`: `gina i18n:export <culture> @<project>` (every bundle, single combined output), `gina i18n:export <culture> <bundle> @<project>` (single bundle), with `--format=<json|po|csv>` and `--output=<path>` flags. When `--format` is omitted, the format is auto-detected from the `--output` file extension (`.po`, `.csv`, `.json`); when both are omitted, defaults to JSON on stdout. Single-bundle JSON matches the on-disk catalog shape verbatim — drop the file straight back into `<bundle>/locales/` and round-trip via `gina i18n:import`. Multi-bundle JSON nests under bundle keys at the top level. PO output is translator-friendly: standard header block (`Project-Id-Version`, `Content-Type`, `Language`, `Plural-Forms`) with a per-culture plural formula (English / Romance / Slavic / Asian / Arabic table; Romance/Germanic 2-form fallback for unknown cultures), `msgctxt` for multi-bundle disambiguation, and native `msgid_plural` + `msgstr[N]` syntax for plural forms. Each plural entry carries a `#. cldr-keys: <list>` extracted comment recording the present CLDR plural keys in canonical order (`zero` / `one` / `two` / `few` / `many` / `other`) so `i18n:import` reconstructs the catalog shape unambiguously across cultures with differing plural categories. PO escape sequences cover backslash / double-quote / newline / tab / CR. CSV output follows RFC 4180: header row `key,value` (single-bundle) or `bundle,key,value` (multi-bundle); cells containing `,` / `"` / `\n` / `\r` / leading-or-trailing whitespace are wrapped and embedded quotes are doubled; plural forms flatten to dotted-suffix rows (`items.one`, `items.other`). Bundles without a catalog for the requested culture are skipped with a warning in project-wide mode; single-bundle scope errors hard. Output to disk goes through `lib.generator.createFileFromDataSync` for parity with `i18n:add`; the parent directory must exist. Tests at `test/lib/i18n-export.test.js` — 75 source-inspection + pure-logic + sandbox-write assertions covering module shape, argv parsing, `detectFormatFromPath`, `flattenCatalog` (nested / plural-grouped / non-string-leaf-drop / bundle stamping), PO writer (escape sequences, header block, per-culture plural formula with base-language fallback, msgid_plural / msgstr[N] / cldr-keys CLDR-order round-trip), CSV writer (RFC 4180 quoting matrix, plural flattening, bundle column), JSON writer (4-space indent, identity round-trip, multi-bundle wrapper), help.txt + arguments.json + dispatcher source pins, and a sandbox export smoke that round-trips JSON / PO / CSV through minimal readers. Slice 5 part 2 (`gina i18n:import`) follows.'
