kind: Fixed
body: 'A `Collection` filter on one field of an array of objects, such as `find({ ''tags[*].label'': ''news'' })` (the form the class documentation shows), now finds the rows whose array holds a matching element. It found no row: each element was compared as a whole, and an object never matched. The field is compared like a plain key, so a comparison (`''>= 4''`), `not null` and the constructor option `skipEval` apply to it, and a value holding `<`, `>` or `=` is a comparison there as on a plain key. An element that is not an object (a string, a number, `null`) is still compared as itself, and a dotted rest (`''reviews[*].ratings.score''`) works as before. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B823)'
time: 2026-10-15T16:10:02+01:00
