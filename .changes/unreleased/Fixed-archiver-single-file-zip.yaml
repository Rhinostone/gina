kind: Fixed
body: 'The single-file form of `lib.archiver.compress()` now writes a real one-entry zip, and `decompress()` reads every form back. It used to pipe the file through a gzip codec and write the result under the `.zip` name, which `unzip` and `decompress()` both rejected, and `method: ''br''` or `''deflate''` were accepted by the option validator and silently produced that same gzip. The archive keeps its path — `<target>/<name>.zip`, with `<name>` defaulting to the file''s basename — and holds one entry named by the basename; the bytes change from a gzip member to a DEFLATE zip, so anything that gunzipped the output directly must switch to reading it as a zip. `method` is now validated against `gzip` alone (the value names the `archiver-gzip#complete` completion event and has never selected a codec for the array or directory forms), so `br` and `deflate` throw synchronously, as they did before a refactor silenced them. The same branch also skipped any input whose path carried a dot-prefixed segment — a `.env`, or a file under `~/.config/` — reporting success with the INPUT path as the archive, leaving an empty `<name>.zip` on disk and leaking the read and write descriptors it had opened; such a file now archives like any other, as the directory form already did. A missing input still settles the `file not found` error. Server-side only; pickup is a bundle restart.'
