kind: Fixed
body: 'FormValidator now tells the truth about a field the browser autofilled but still withholds from script at submit time (#B341). Such a field is visibly filled yet reads empty to script, so the submit-time check correctly refuses to post it, but the message it rendered was the plain required label, a problem the user could not see. The engine now consults a new built-in label key, isRequiredAutofill (default: Filled in by your browser: click the field to confirm it), for that one case, keeps the verdict, the errors key and the submit gate unchanged, and marks the control with data-gina-form-autofill-withheld="true" as a styling hook, set through the dataset API (dataset.ginaFormAutofillWithheld), so the hyphenated attribute name is never a literal in the minified bundle: check for the marker on the DOM element, not by grepping the bundle. The key is alias-filled from an app-supplied isRequired label, so a localized catalog keeps its own required wording until it translates isRequiredAutofill itself. The withheld predicate is exposed as gina.validator.isAutofillValueWithheld. Browser-bundled: rebuild each consuming bundle to pick it up.'
time: 2026-09-05T05:16:29+01:00
