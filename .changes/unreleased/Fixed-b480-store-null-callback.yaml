kind: Fixed
body: '`self.store()` no longer drops the outcome of a `null` callback. The fluent guard tested only for `undefined`, so `store(target, files, null)` — or any non-function — fell into the callback branch of the inner `start()`, whose seven `if (cb) … else emit` arms then emitted to an event with zero in-tree listeners: the upload ran and nothing was told, and a truthy non-function given to `.onComplete()` threw a `TypeError` from inside an fs callback, an uncaughtException on every path but the synchronous empty-upload one. The guard now mints the fluent handle for any non-function `cb`, mirroring `query()`, `.onComplete()` throws a `TypeError` synchronously at the caller when given a non-function, and the seven unreachable emitter arms are removed together with their undocumented event. Behaviour change: `store(target, files, null)` returns the handle and starts the upload when `.onComplete()` is chained, exactly like an omitted `cb` — it no longer starts an upload whose result is lost. Server-side only; pickup is a bundle restart. (#B480)'
