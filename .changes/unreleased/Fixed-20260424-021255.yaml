kind: Fixed
body: >-
  Schema `$schema` identifier updated from `http://json-schema.org/draft-07/schema#`
  to `https://json-schema.org/draft-07/schema#` across all seven `schema/*.json` files
  (app, app.crons, connectors, manifest, routing, settings, watchers). The plain-HTTP
  form redirects to HTTPS and is bot-blocked by json-schema.org; IDEs and JSON
  validators that dereference the identifier at validation time were hitting the
  302/403 chain instead of fetching the canonical schema. Matches the URI shown in
  the JSON Schema draft-07 spec and aligns with the `$id` field, which already uses
  `https://`. First batch from the link-health audit (gina-io/gina#18).
time: 2026-04-24T02:12:55Z
