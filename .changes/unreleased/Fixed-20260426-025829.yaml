kind: Fixed
body: '`gina.plugins.Session()` no longer clobbers the wrapper''s `Function.name` property. Bundles that introspect the wrapper (`require(''gina'').plugins.Session(require(''express-session'')).name`) now see `''session''` (matching upstream) instead of `''ginaSession''`. Achieved via a small refactor: the outer wrapper delegates to an inner `ginaSessionDispatch` named function, with `Object.defineProperty(wrapped, ''name'', { value: expressSession.name, configurable: true })` overriding the outer `.name`. The inner `ginaSessionDispatch` frame stays visible in stack traces, so gina remains detectable for debugging while the public-facing identity is the upstream''s. Static-surface preservation (`Store`, `MemoryStore`, `Session`, `Cookie`) and the SameSite=None invariant are unchanged. 2 new unit tests in `test/core/session-plugin.test.js` (drop-in identity assertion + stack-trace visibility lock). Full suite 3768/3768 (3766 baseline + 2 new). Surfaced from a freelancer/v3 session: "Gina''s wrapper clobbering expressSession.name — is an upstream concern".'
