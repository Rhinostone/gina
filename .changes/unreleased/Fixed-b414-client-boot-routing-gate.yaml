kind: Fixed
body: 'Client-side handler release now awaits the routing table (#B414, consumer-reported with a two-way browser reproduction). The client routing table arrives only by async fetch (the page whispers an empty stub), yet `gina.ready` handlers and the auto-boot validator released at DOMContentLoaded - so any `getRoute()`/`toUrl()` during handler or form-bind initialisation ran against an empty table. Loopback wins that race by single-digit milliseconds, which is why development never sees it; a real deployment loses it by 150ms or more on every load, deterministically - a validator form rule naming a route then threw inside the init listener, the throw was swallowed by the event dispatch, and the instance''s `ready` never fired, silently. All three release paths now gate on the dependency SETTLING: the ready-list scheduler, the validator auto-boot poll, and the late-registration path (a handler registered after DOMContentLoaded previously bypassed the scheduler entirely and fired immediately). Settled deliberately means loaded OR failed - a broken endpoint still releases handlers rather than hanging the page - and a parse-time 5-second fallback force-settles with a console error in degenerate shapes where the fetch is never issued. Behaviour change worth knowing: on deployed tiers, `gina.ready` handlers now fire when routing is actually available (typically 150ms-1.3s later than before, per the consumer''s measurements); on loopback and in development the difference is single-digit milliseconds. Pages that do not use client routing are unaffected in every case but the timing.'
