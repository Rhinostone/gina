kind: Security
body: 'Inspector payloads no longer leak across requests through the compiled-template cache (#B464). With server.cache.enable true and the Inspector block injected (automatic in dev; in production only when a controller calls self.render(data, true)), the window.__ginaData script was baked into the layout BEFORE swig compiled it, so the per-view compiled template and the persisted .gina-layout-cache file carried the FIRST request''s page data (the controller''s data, the session card, the environment) and served it to every later request of that view, to other views compiled after it, and to every later process until the file was removed; the popin hidden inputs gina-without-layout-xhr-data / -view were a second pre-compile carrier, and /_gina/reveal plus the Inspector stream froze with them. The compiled layout now carries only an HTML-comment marker: both cache paths build the payload after the template executes and splice this request''s script (or drop the marker when the Inspector is not wanted), so a cache hit refreshes the Inspector sinks too; the hidden inputs are spliced after execution under the same gates; and a stale layout-cache file written by an earlier release is healed in place on the next compile. Server-side: restart each bundle to pick it up; deleting .gina-layout-cache under the bundle templates root is optional, never required.'
