kind: Fixed
body: '`gina secrets:check` now exits non-zero when a bundle''s secrets declaration itself is invalid or unreachable (#B409) — an unreadable declared file, a malformed entry, a failing exec fetch — not only when a required key is unset. Previously such errors were printed but the exit code stayed 0 whenever the environment happened to carry the keys, so the CI gate green-lit configs the runtime refuses to boot.'
