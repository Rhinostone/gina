kind: Fixed
body: 'Fixed an ENOENT race in the per-template layout cache under concurrent renders in dev mode. Two parallel requests for the same URL whose template uses {% extends %} could see the cached layout file deleted between its priming-block write and the post-priming read, surfacing as a 500 with ENOENT: no such file or directory. The cache write now uses an atomic temp+rename pattern (writeFile to a per-process unique temp, then rename onto the target) so concurrent readers always observe either the prior or new content, never an absent file. The same atomic pattern is applied to the post-asset-injection rewrite (closing a secondary empty-content race from O_TRUNC). Production was unaffected — cached mode (_cacheIsEnabled = true) skipped the delete-then-rewrite path entirely. CVE-2023-25345 path-traversal boundary check preserved verbatim.'
