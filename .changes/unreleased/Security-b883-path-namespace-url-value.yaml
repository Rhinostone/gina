kind: Security
body: 'A route''s `param.path` and `param.namespace` no longer take an escaping value without the router''s path-traversal check. The router wrote a URL segment, or a query key folded in by its own requirement, into those two fields before that check ran, so a value holding a `..` segment or starting with a separator was not refused there; the template renderers refused such a template path (500). The router now refuses it first (500). A redirect route that takes `param.path` from a query value starting with `/` is refused too: since 0.7.4 when the key has no requirement, and now also when it has one. Write the target in `param.path`, or call `self.redirect()` from an action. The router claim in GHSA-3vmh-634f-vwm3 now holds. Restart your bundles (#B883).'
