kind: Fixed
body: 'The controller no longer walks and rewrites the shared forms catalog on every request. The dotted-path data setter behind every render (`page.view.*`, `page.environment.*`, `page.forms`, …) used to build the path as a JSON string, parse it, and deep-merge the result into the render data — and that merge recursed into every object value it grafted, re-merging each array inside it with itself and writing the copies back into the caller''s object. For a bundle with a real forms catalog that was 0.4–1.5 ms of CPU per request AND a silent mutation of the per-process catalog (its arrays were swapped for equal copies on every render). A first write is now stored by reference without being walked, missing intermediates are created directly, and only a genuine collision goes through the merge — so the value semantics are unchanged (first write wins, an object written onto an object leaf still deep-fills), the catalog is never touched, and the 59 primitive writes of a render cost about a quarter of what they did. One deliberate difference: writing an array onto an existing array leaf now merges the two once instead of twice (the old path produced duplicate elements); no framework route writes an array-bearing path twice. Server-side only — pickup is a bundle restart, no rebuild.'
