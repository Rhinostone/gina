kind: Fixed
body: 'Popin: reopening an AJAX popin no longer renders the previous open''s content — the preload cache was a one-generation-lagging store (every open after the first paid for a network fetch yet rendered the body fetched around the PREVIOUS open, because the leftover entry blocked the fresh warm''s dedup check). The cache entry now dies with the open it warmed: close clears the popin''s content-URL slot and re-sweeps it once the teardown has drained (the close-time focus-return and pointer re-hover re-warm the slot with close-era content within a millisecond — measured), so every open renders current content; a trigger annotated data-gina-dialog-preload="false" additionally skips the cache read entirely at open, making "false" a hard always-refetch guarantee (its GET always happens at open time, never from a sibling trigger''s warm). Warmed-but-never-opened entries keep the documented page-lifetime semantics. Costs at most one extra idempotent GET per close on default triggers; browser-bundled — rebuild your bundles to pick it up (#B139)'
