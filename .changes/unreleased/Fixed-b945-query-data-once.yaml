kind: Fixed
body: 'self.query(), and the forward action that calls it, send the data of a GET, HEAD or DELETE once, in the query string, with no body. When the path already held a query string, the data was appended after a second ?, which a standard parser reads as part of the previous value (/echo?k=v?x=1 gives k = ''v?x=1''). That happened for a forward route with a static param its target url does not carry, and for a validator query rule on GET: getRoute() had already put the rule''s data in the url, and the data was then appended a second time (/check?name=foo?name=foo). The same ?key=value string also went out as a body labelled application/json, which no receiver reads. The data now joins the path''s query string with &. A gina receiver, which read the second ? as &, finds the same values in req.get and req.delete, url placeholders of a DELETE route included; only a key that is both in the path and in the data changes (see the Changed entry). (#B945)'
