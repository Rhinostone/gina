kind: Fixed
body: 'CLI: `project:start @<project>` and `service:start @<project>` never delegated. The shared start-action version gate parsed the `@<project>` reference as a framework version, printed `Wrong version: <name>`, and then — with the CLI message-queue listener holding the event loop — hung forever, or exited 0 without delegating when invoked through the `gina` wrapper. The version override is now scoped to the framework topic, so a project or service reference falls through to its own handler and delegates as documented. The version-reject paths — both here and in the `gina stop @<version>` / `gina restart @<version>` handlers — now flush their message and exit with a non-zero code instead of a bare return that could hang the CLI, and an unknown short version reports `Version not installed` rather than crashing.'
time: 2026-07-06T10:30:22+01:00
