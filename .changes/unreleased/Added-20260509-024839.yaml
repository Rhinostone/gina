kind: Added
body: 'Added built-in /_gina/metrics Prometheus exposition endpoint (#OBS1). Opt-in via app.json metrics.enabled = true; install prom-client as a peer dependency in your project (npm install prom-client). Exposes Node.js process metrics (heap, GC pause, event loop lag, active handles) via prom-client.collectDefaultMetrics(), plus a per-request HTTP counter (gina_http_requests_total{method,route,status}) and duration histogram (gina_http_request_duration_seconds{method,route,status}). Route labels come from req.routing.rule (routing.json key) — never the raw URL — to keep Prometheus cardinality bounded; status-aware fallback labels for unmatched paths (__not_found__, __method_not_allowed__, __error__, __no_route__). Endpoint is IP-restricted by default (loopback only; configurable via metrics.allowFrom in app.json); reads client IP from req.socket.remoteAddress only — does NOT trust X-Forwarded-For. Each bundle is an independent scrape target on its own port. Wired in core/server.isaac.js (source of truth) + core/server.js (engine-agnostic mirror, always-on, not gated on NODE_ENV_IS_DEV); request lifecycle hook registers response.on(''finish'') at request entry. New lib/metrics/src/main.js wraps prom-client (peer dep, project-resolved load via the mysql2/postgres/AI-SDK pattern). Schema/app.json extended with the metrics block. 116 new tests across test/lib/metrics.test.js (behavioural) and test/lib/metrics-wiring.test.js (source-inspection). See docs/guides/observability for adoption.'
