kind: Added
body: 'Added locale negotiation primitives + request-pipeline hook (#I18N1 slice 3). `req.culture` is now a first-class per-request field, set in the routing pipeline before middlewares drain. Negotiation order (highest priority first): URL prefix (`routing.json > culturePrefix: true` flag — captures `req.routing.param.culture` from a route URL like `/:culture/dashboard`) → cookie (defaults to `gina_culture`) → `Accept-Language` parsed and best-matched against the bundle''s loaded catalogs with q-value ordering respected → `settings.region.culture` → `process.env.GINA_CULTURE` → `''en''`. New helpers exported on `lib.i18n`: `parseAcceptLanguage(header)`, `matchAvailable(requested, available)`, `readCookie(header, name)`, `negotiateCulture(req, opts)`. Controller `self.t()` and the swig/nunjucks `t` filter pick up `req.culture` automatically (the slice-1 hook is now wired). The controller''s existing region-data lookup (`controller.js`) bridges to `req.culture` so the URL-prefix / cookie sources flow through to the legacy `page.view.lang` template scope. Per-route flag propagation mirrors the `#CSRF2 csrfExempt` pattern: `lib/routing/src/main.js` extracts `routeObject.culturePrefix` into `params.culturePrefix`; `core/server.js` hoists into the request-lifecycle params block as a sibling of `csrfExempt`. The negotiator is wrapped in try/catch so an i18n failure never blocks routing. Tests at `test/lib/i18n-negotiation.test.js` — 42 tests covering parseAcceptLanguage (q-value ordering / wildcards / whitespace / clamping), matchAvailable (exact / base-language / multi-priority), readCookie (extract / decode / fallback), negotiateCulture (full chain priority matrix), and source-inspection guards on the lib/routing + core/server wiring. Full local suite green: 4239 tests, zero regressions. Known limitation in slice 3: cookie name is hardcoded to `gina_culture` and bundle defaultCulture lookup is deferred — slice 4 or a follow-up wires bundle-settings access at the request-pipeline boundary.'
