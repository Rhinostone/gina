kind: Security
body: 'Added gina.plugins.Corp({ value }) — opt-in middleware that emits the Cross-Origin-Resource-Policy (CORP) response header on every response (#HDR14). Settings: corp.value is one of three W3C HTML spec tokens (same-origin, same-site, cross-origin); default same-origin matches helmet per-middleware default. Resource-side complement to #HDR6 Coep require-corp enforcement — a page that sets Coep: require-corp requires its cross-origin embeds (CDN fonts, etc.) to carry a matching Corp: cross-origin (or wider) header on the embed-target bundle, otherwise the embed is blocked. Caller options always win over settings; values are normalised to lowercase. Mirrors the #HDR6 Coep + #HDR13 Coop single-enum plugin shape exactly (resolveSettingsDefaults + mergeOptions + resolveValue throw-on-invalid + idempotent first-writer-wins middleware via res.getHeader). The same-origin default defends against side-channel attacks that load a resource cross-origin to measure size/dimensions/timing for fingerprinting (and XSSI shapes are blocked) but BREAKS legitimate cross-origin embeds when the resource serves at a separate origin from the embedding page. README walks users through the three escape hatches (pick same-site for first-party multi-subdomain setups, pick cross-origin for publicly-embeddable CDN assets, per-bundle scoping where the page bundle keeps strict + the CDN bundle adopts cross-origin). 60 unit tests; full suite 5945/5945. Third and final of the three Phase 2 cross-origin policies — HDR15 SecurityHeaders combined wrapper follows as the closing slice of Phase 2.'
