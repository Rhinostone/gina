kind: Added
body: 'A bundle can now declare which scopes it is deployed in, via an optional `scopes` allow-list on its `manifest.json` entry (#B373). Until now a registered bundle was deployed in EVERY scope, and the only way to exclude one was to leave it out of the manifest entirely — which removes it from all scopes at once. The motivating case is a bundle you are still building: `"scopes": ["local"]` keeps it running locally while every other scope behaves as though it does not exist. An ABSENT (or null) key means every scope, so existing manifests are completely unaffected; an empty array parks the bundle everywhere; and a value that is not an array is reported as a manifest error by name rather than silently read as "no scopes". The semantics deliberately mirror a route''s rule-level `scopes`. How an exclusion is reported depends on whether you asked for it: the boot and `gina project:build` SKIP an excluded bundle with a notice naming the scope and the one-line remedy, so one parked bundle never blocks a project build; starting an excluded bundle, or naming it explicitly in `gina bundle:build <name> --scope=<scope>`, is REFUSED by name, because silently producing no artifact would read as success in a deploy script. Note that deleting a bundle''s `releases.<scope>` entry by hand was never a working substitute for this: both build commands walk every scope in the project and re-create any missing release entry, so a hand-deleted one reappears on the next build.'
