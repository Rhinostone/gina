kind: Security
body: 'Added gina.plugins.Coop({ value }) — opt-in middleware that emits the Cross-Origin-Opener-Policy (COOP) response header on every response (#HDR13). Settings: coop.value is one of four W3C HTML spec tokens (same-origin, same-origin-allow-popups, noopener-allow-popups, unsafe-none); default same-origin matches helmet per-middleware default. Required (paired with Coep: require-corp / #HDR6) to enable SharedArrayBuffer and high-resolution performance.now() in the page. Caller options always win over settings; values are normalised to lowercase. Mirrors the #HDR6 Coep single-enum plugin shape exactly (resolveSettingsDefaults + mergeOptions + resolveValue throw-on-invalid + idempotent first-writer-wins middleware via res.getHeader). The fourth token noopener-allow-popups is a W3C HTML spec addition (Chrome 119+, Firefox 131+) that severs window.opener for popups even at same-origin while keeping the popup window functional. The same-origin default BREAKS legitimate OAuth/SSO popup flows where the popup needs to call back into the opener via window.opener.postMessage(...); README walks users through the three escape hatches (pick same-origin-allow-popups for same-origin OAuth, pick noopener-allow-popups for one-way notifications back via BroadcastChannel/postMessage, downgrade to unsafe-none last resort). 61 unit tests; full suite 5885/5885. Second of the three Phase 2 cross-origin policies — HDR14 Corp + HDR15 SecurityHeaders combined wrapper to follow.'
