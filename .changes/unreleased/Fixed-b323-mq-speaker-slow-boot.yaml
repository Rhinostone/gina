kind: Fixed
body: 'A bundle whose boot blocked the event loop for more than two seconds — the ordinary shape for a container start or a mount off a network filesystem — lost its `mq` log flow for the rest of the process''s life, silently. The connect deadline introduced in 0.6.5 read the socket''s `connecting` flag from the timers phase, which runs BEFORE the poll phase that clears it, so an overdue deadline destroyed a connection the kernel had already established. Every boot line still read healthy while nothing reached the listener, the file sink or container stdout. The deadline now reaches its verdict one event-loop phase later, so it can no longer cancel a completed connect, while a genuinely unreachable host is still given up on as promptly as before. If you pinned to 0.6.5 or worked around this with `GINA_LOG_STDOUT=true`, you can lift both.'
