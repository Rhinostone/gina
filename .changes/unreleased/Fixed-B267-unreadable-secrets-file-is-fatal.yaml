kind: Fixed
body: 'A declared `secrets.file` layer that EXISTS but cannot be read — wrong permissions or ownership, or a path that is actually a directory — is no longer mistaken for a layer that is simply absent. Previously both collapsed to "not there", so a chain like `["${homedir}/secrets.env", "${homedir}/${scope}/secrets.env"]` whose per-scope file lost read permission silently fell back to the shared base file: the bundle booted healthily on the wrong credential, with only a debug line — labelled ABSENT, which was itself misleading — to say so, and that line is suppressed at the default log level. Boot now refuses and names the path and the error code. A genuinely missing file is unchanged: it still contributes nothing and is not an error, so shipping a base file and adding the per-scope one only on some targets keeps working. `gina secrets:check` reports the same distinction (UNREADABLE rather than ABSENT) so the gate and the runtime cannot disagree, and `lib.secrets` gains `readEnvFile`, the discriminated read both now share.'
