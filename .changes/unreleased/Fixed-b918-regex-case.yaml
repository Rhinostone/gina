kind: Fixed
body: 'A `_case_` condition whose `case` is written `/pattern/flags` (the form the 0.3.15 migration notes show with `"case": "/^individual$/"`) is tested as a regular expression against the value of its driving field. The validator compared that string with the value, so it did not match: when the condition''s `_case_` block was the only or the last one of the rule set, the condition applied nothing, neither the requirements nor the excludes it declares; when another `_case_` block followed it, a later check applied its rules to the fields the form collects, but a radio or checkbox group it requires was not refused. The pattern is read as written, so `[ab]` is a character class. A value that starts and ends with a slash and is meant literally can be put in an Array (`["/fr/"]`), and a pattern the browser does not accept is still compared as a value, with a console warning. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B918)'
