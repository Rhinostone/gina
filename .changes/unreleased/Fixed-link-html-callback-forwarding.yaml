kind: Fixed
body: 'Fixed the link plugin''s HTML-callback forwarding — `data-gina-link-event-on-success` / `data-gina-link-event-on-error` now fire, and carrying either attribute no longer breaks the link. Previously, adding one of these attributes to a `data-gina-link` anchor made every click throw `ReferenceError: listenToXhrEvents is not defined` before the XHR was opened: no request left the page, no callback ran, and the link was effectively dead. Three defects were fixed together: the registration helper was trapped inside another function''s scope (unreachable from the link plugin), the call site passed no type (so even a reachable helper would have read `data-gina-undefined-event-on-*` and registered nothing), and the internal success/error events were named and targeted inconsistently between registration and dispatch. The helper is now a shared global, the link call site passes its type, and the events address the clicked link''s own element and id. The programmatic `gina.link.on(''success''/''error'')` channel is unchanged. Browser-bundled — rebuild your bundles to pick it up.'
