kind: Security
body: 'Concurrent uploads of the same filename no longer corrupt one another (#B419). The multipart parser wrote every incoming file to <upload dir>/<the filename the client sent>, with nothing in the path to distinguish one part or one request from another - so two uploads sharing a filename opened two write streams on a single path and interleaved their bytes into one hybrid file matching neither upload, while the framework reported success to both callers. Measured on a live bundle before the fix: 12 concurrent uploads of one filename left 1 corrupted file instead of 12 intact ones, and a single request carrying two same-named parts produced one file mixing both. The multipart parse runs before routing and before any middleware, so reaching it needed neither authentication nor a valid route - a POST to an unknown url answers 404 to the client and still writes the file to disk. Uploads now stage under a server-generated random name (32 hex characters plus a .part suffix), which is how multer and formidable have always handled this, and which also keeps client-controlled bytes out of the filesystem and cannot overflow the operating system filename limit. ACTION REQUIRED only if your own code derives a display name or a public URL from the basename of req.files[].path: read req.files[].originalFilename instead - it is unchanged, it is still the name self.store() publishes the file under, and the documented behaviour of keeping each file''s original name is unaffected. Server-side change: pickup is a bundle restart, no client-bundle rebuild.'
time: 2026-08-25T02:14:05+01:00
