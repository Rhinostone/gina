kind: Fixed
body: 'A `data-gina-link` anchor no longer swallows clicks the browser itself should handle. Four cases are now left alone. Three are properties of the anchor: one carrying `download` saves natively instead of being buffered in memory by the request layer, one carrying `target` opens its window or tab again, and one pointing at a bare `#` fragment moves within the page instead of issuing a request for the literal fragment text. The fourth is a property of the click — holding ctrl, cmd, shift or alt now opens the new tab or window the browser would normally open, instead of being turned into a background request that never opens anything. Previously all four were intercepted, so the click either did nothing visible or produced the wrong result. The anchor tests are made against the resolved target, so the documented placeholder form — an empty or `#` href paired with `data-gina-link-url` — keeps working, and the modifier test covers clicks landing on an element nested inside the anchor as well as on the anchor itself. Cross-origin links are unaffected and still go through the request layer.'
