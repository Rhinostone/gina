kind: Fixed
body: 'A `data-gina-link` anchor no longer swallows clicks the browser itself should handle. Three shapes are now left alone: an anchor carrying `download` saves natively instead of being buffered in memory by the request layer, one carrying `target` opens its window or tab again, and one pointing at a bare `#` fragment moves within the page instead of issuing a request for the literal fragment text. Previously all three were intercepted and turned into a background request, so the click either did nothing visible or produced the wrong result. The test is made against the resolved target, so the documented placeholder form — an empty or `#` href paired with `data-gina-link-url` — keeps working. Cross-origin links are unaffected and still go through the request layer.'
