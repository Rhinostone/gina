kind: Fixed
body: 'Fixed a cross-request data bleed in the swig render delegate under production concurrency: per-request helpers (the template-data getter, resource injector and layout-cache path) were captured at module scope, so a render suspended at the template-read await could resume with a concurrent request''s closures and merge that request''s page data into its own response. All per-request dependencies are now function-scoped inside render().'
time: 2026-07-03T01:42:00+01:00
