body: 'On native Windows, gina now stops at its first step with one message: run it inside WSL2 or a Docker container, with a link to the instructions. That step is the npm install, or the first `gina`, `gina-init` or `gina-container` command after an install that skipped the install scripts (a Bun install, or `npm install --ignore-scripts`). The npm install stopped with a stack trace, and the other paths crashed with unrelated errors such as `TypeError: Cannot read properties of undefined`. Native Windows is still not supported, and nothing changes on macOS, Linux, inside WSL2 or in a container. (#B888)'
