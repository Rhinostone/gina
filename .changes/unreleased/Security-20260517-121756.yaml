kind: Security
body: 'Added gina.plugins.XDnsPrefetchControl({ value }) — opt-in middleware that sets the X-DNS-Prefetch-Control response header on every response (#HDR9). Phase 1.5 (helmet-parity gap-fill) continues. Two valid tokens: "on" enables DNS prefetching for perceived-performance; "off" (default, matches helmet) is the privacy-respecting choice — the browser does not pre-resolve DNS for unclicked links, so the resolver only sees hostnames the user actually navigates to. API-shape divergence from helmet (which uses { allow: boolean }): gina uses { value: ''on''|''off'' } matching the existing single-token-enum convention of #HDR2 / #HDR3 / #HDR6 / #HDR13 / #HDR14. README documents the helmet-to-gina mapping for migrators. Marginal practical value in 2026 — modern Chrome / Firefox have their own DNS-prefetch heuristics that mostly ignore the header; defense-in-depth + helmet-parity narrative. Caller options always win over settings; values are normalised to lowercase. Idempotent — first-writer-wins via res.getHeader. Mirrors the #HDR14 Corp single-enum plugin shape exactly. 57 unit tests in test/core/x-dns-prefetch-control-plugin.test.js including a negative-invariant lock on the helmet-shape { allow: true } silent-fallback (it does NOT enable DNS prefetching in gina — emits default "off"); user error surfaces at runtime via the gina-default rather than helmet-semantic.'
