kind: Fixed
body: 'A `~/.gina/projects.json`, `ports.json` or `ports.reverse.json` that cannot be read or parsed no longer stops the framework started by `gina start`. `gina bundle:start` now exits 1 with `<file> cannot be used: <reason>`, the reason naming the path; before, the command printed only « the framework ended this command before it reported the outcome », and every later command needed `gina start` again. A `~/.gina/main.json` that cannot be read or parsed stopped only `bundle:start`, with a long message; it now gets the same one-line refusal, after a warning that `def_framework` could not be synced. `bundle:status`, `bundle:list`, `project:status` and `service:list` report a `ports.json` or `ports.reverse.json` that cannot be read or parsed in that one line too: their documentation said a malformed `ports.reverse.json` was tolerated, but these commands exited 1 with a long message. A missing `ports.reverse.json` is still recreated empty and shown as `(no port)`. A framework already running picks this up after `gina framework:restart`. (#B906)'
time: 2026-10-19T08:38:49+01:00
