kind: Security
body: 'Added `gina.plugins.OriginAgentCluster()` — opt-in middleware that emits the `Origin-Agent-Cluster: ?1` response header on every response (#HDR7). The header is a Structured Header Value (RFC 8941) requesting origin-keyed agent clustering — the page''s origin gets its own agent isolated from sibling-origin pages, so same-site cross-origin pages can no longer reach in via `document.domain`. Mitigates one class of Spectre side-channel attack (the browser may place origin-keyed agents in their own OS process where possible). Per the HTML spec (https://html.spec.whatwg.org/multipage/document-sequences.html#origin-keyed-agent-clusters), `?1` is the only useful value (`?0` is the browser default and emitting it is a no-op); no tunable options today. Browser support: Chrome 88+, Edge 88+, Firefox 109+, Safari 15+ — older browsers ignore silently, safe to register unconditionally. **When NOT to register**: bundles that rely on `document.domain` to bridge same-site origins will break under origin-keyed clustering; rare in modern apps but worth checking. Mirrors the #HDR1 plugin shape EXACTLY (no validation, single static value, same `_resolveSettingsDefaults` + `_mergeOptions` helpers reserved for future-proofing). Idempotent — first-writer-wins. Files: `core/plugins/lib/origin-agent-cluster/{src/main.js, package.json, README.md}`, registered in `core/plugins/index.js`. Settings template seeds `originAgentCluster: {}` with `#HDR7` comment header. Boilerplate `core/template/boilerplate/bundle/index.js` advertises the adoption example alongside #HDR1-4. 33 unit tests in `test/core/origin-agent-cluster-plugin.test.js` (full suite 5676/5676, prior 5643 + 33). **Closes Phase 1 modern critical coverage** of the `#HDR` Web Security Headers track (5 of helmet''s 9 modern headers covered; the remaining 4 are deferred to Phase 1.5 #HDR8-12 helmet-parity gap-fill and Phase 2 #HDR5 CSP + #HDR6 COEP/COOP/CORP for 0.4.0). Added 2026-05-17 after a helmet-parity audit caught the original Phase 1 framing missing Origin-Agent-Cluster.'
