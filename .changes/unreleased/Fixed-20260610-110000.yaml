kind: Fixed
body: 'Fixed a crash where a single request carrying a malformed percent-escape in its URL or query string could take the whole bundle down. A bare "%", an invalid escape such as "%zz", or an "inheritedData" value containing a literal "%" (for example {"x":"50%off"}) made an unguarded decodeURIComponent/decodeURI throw URIError, which escalated to an uncaught exception and shut the bundle down — including from inside the error handler itself, so even a malformed-percent URL to a missing asset could crash the process instead of returning a normal 404. Such values are now decoded tolerantly — a malformed escape falls back to the raw value instead of throwing — and the redundant second decode of already-decoded query parameters on the GET and HEAD paths has been removed. A single malformed request no longer crashes the server, on either engine.'
