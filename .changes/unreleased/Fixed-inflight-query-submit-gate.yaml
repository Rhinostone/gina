kind: Fixed
body: 'A submit click landing while a field''s live-check `query` was still on the wire was silently swallowed (#B346): with live-check enabled the submit trigger is gated while the form is not yet valid, and a pending verdict was misread as invalid — the refused click had nothing to reveal, no request left, and the user had to click again after the round trip (the dead window scales with query latency, not typing speed). The gate now recognizes the pending state: the click starts a normal submit cycle that waits for the verdict — the loading state arms while it waits, a valid verdict sends exactly once after the settle, and a failing one renders the errors and releases the form. The same carve-out covers the other submit doors: a click landing on markup nested inside the button (`<button type="submit"><span>`) and a programmatic `submit()` during the pending window now latch, wait for the verdict, and complete instead of stalling silently — and the loading state arms on the waiting trigger for those doors too. Authored `aria-disabled`/`disabled` marks and forms where a settled field carries a committed error keep the existing refuse-and-reveal behaviour.'
