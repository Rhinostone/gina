kind: Fixed
body: 'A filter, tag or extension a bundle registers through `this.engine` in `controllers/setup.js` (or through `self.engine` in an action) now reaches the templates a custom async swig template loader (`settings.template.swig.loader`) serves. Until now such a template answered 500, with `Invalid filter` (for a tag, `Unexpected tag`) in the server log: the async render path renders through an engine of its own, which never received the bundle''s registrations. A bundle filter that has the name of one of gina''s own filters (`nl2br`, `getUrl`, …) keeps rendering gina''s filter, as it already did for templates on disk (#B825).'
time: 2026-10-14T11:18:19+01:00
