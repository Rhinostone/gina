kind: Added
body: 'The cas storage strategy (#STO1). A driver declaring strategy: "cas" stores objects by content address: the key is derived from the object''s digest (blobs/<algo>/<aa>/<bb>/<hex>, deliberately extension-less), so identical bytes stored twice yield the SAME key with a reference count of 2 and no second copy on disk — put() results carry a deduplicated flag saying which happened. release() drops a reference instead of deleting: a periodic sweep (sweepInterval, default "15m") collects blobs that have sat at zero references for longer than a grace window (sweepGrace, default "1h"), so re-uploading just-released content is free. findByDigest(algo, hex) answers whether content is already stored without transferring it — capability-gated (capabilities.dedup) and shipped as a driver verb only, because it is a dedup oracle: exposing it over HTTP is the consumer''s decision and authentication burden. The digest algorithm is per-driver config (hash, default "sha256", validated at boot against the runtime''s own crypto — sha256/sha512 exist on both supported runtimes, blake2b512 is Node-only), and since its name is a path segment, changing it later is additive rather than a re-key; changing a driver''s STRATEGY on populated storage remains a re-key migration, and the boot now stamps every driver root with its strategy and warns on mismatch — for sharded drivers too. cas publishes fsync by default (fsync: true — the temp file before the atomic rename, the parent directory best-effort after; the first fsync anywhere in gina), because the strategy exists for immutable content where an acknowledged write must survive power loss; sharded durability is unchanged. Size tiering applies under cas exactly as under sharded. The metadata-store seam gains four refcount verbs the embedded store implements (existing databases migrate in place, idempotently); a connector-backed store must implement them to serve a cas driver.'
