kind: Security
body: 'Added gina.plugins.HidePoweredBy() — opt-in middleware that removes the X-Powered-By response header that gina emits by default at core/server.js:2425 (plus core/template/conf/env.json > response.header). Opens Phase 1.5 of the Web Security Headers track (helmet-parity gap-fill, #HDR8). Different SHAPE from #HDR1-#HDR7 — REMOVE pattern (res.removeHeader) not SET. Reduces the attacker reconnaissance surface — the server stack identity no longer leaks via the response header. No tunable options (mirrors helmet hidePoweredBy no-opts shape). Engine-asymmetric effectiveness: works as expected on the Express engine (server.js:2425 setHeader fires in early framework middleware before user app.use() mounts, so user-mounted removeHeader succeeds); on the Isaac engine, the 15+ direct response.writeHead({ X-Powered-By: ... }) call sites bypass the setHeader/removeHeader interface — middleware cannot intercept. README documents the gap; framework-level settings-flag for Isaac is a separate slice. Idempotent — removeHeader is a no-op when the header is absent. 37 unit tests in test/core/hide-powered-by-plugin.test.js.'
time: 2026-05-17T12:13:40+01:00
