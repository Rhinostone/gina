kind: Added
body: 'Storage drivers can now read a byte range. `getRange(key, start, end, cb)` ships on every local strategy (`sharded`, `cas` and `stream`) and `capabilities.ranges` is true for all of them, where it was false in every prior release. `end` is INCLUSIVE, matching the HTTP `Range` header, so a header''s byte offsets pass through unchanged; an `end` past the last byte is clamped rather than refused, and only a `start` at or beyond the object''s size is unsatisfiable — that is the caller''s `416`. Both size tiers answer (an inline object slices its stored bytes, a published one gets a positioned read), and under `cas` a released blob stays invisible to `getRange()` exactly as it already is to `get()`. This is the DRIVER half only: the engines still send no `Accept-Ranges` or `Content-Range` and never answer `206` on their own, so `capabilities.ranges` describes what a driver can return, not what the server currently answers — serving ranges over HTTP remains a separate piece of work, and until it lands a controller reads with `getRange()` and sets the status and headers itself.'
