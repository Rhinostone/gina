kind: Security
body: 'Bumped the `@rhinostone/swig` floor from `^2.7.0` to `^2.7.1` in both manifests, so every install is guaranteed swig-core 2.7.1 — the version that carries the CVE-2023-25345 path-traversal loader fix. The prior `^2.7.0` range still permitted the unpatched 2.7.0 (a clean install resolved to 2.7.1, but a stale lockfile or a deduped 2.7.0 in the tree would not); gina now relies on the swig-core loader confinement on its default render path, so the floor guarantees the fix rather than merely making it likely.'
time: 2026-06-09T00:15:00.000000+01:00
