kind: Security
body: 'Bumped the `@rhinostone/swig` floor from `^2.7.0` to `^2.7.2` in both manifests, so every install is guaranteed swig-core 2.7.2 — the version that carries the CVE-2023-25345 path-traversal loader confinement (added in 2.7.1) and also repairs a 2.7.1 regression in which a relative loader basepath made the confinement wrongly reject every in-root `{% include %}` / `{% extends %}` / `{% import %}`. The prior `^2.7.0` range still permitted the unpatched 2.7.0 (a clean install resolved higher, but a stale lockfile or a deduped 2.7.0 in the tree would not); gina relies on the swig-core loader confinement on its default render path, so the floor guarantees both the path-traversal fix and the relative-basepath repair.'
time: 2026-06-09T00:15:00.000000+01:00
