kind: Fixed
body: '`gina secrets:check` now looks in the same two places a bundle would, in the same order. It previously cross-referenced the environment only, so once a bundle declared `settings.secrets.file` the command reported `UNSET` — and exited non-zero — for a key that bundle would have started with perfectly well, turning a pre-deploy gate into a false alarm. It now resolves the bundle''s declared file chain and consults it beneath the environment, reusing the runtime''s own token substitution and the shared `lib.secrets` parser so the two sides cannot disagree about where a file lives or what it contains. An explicit `--env-file` still wins, because it stands in for the environment tier which outranks the files. The report gained a per-bundle chain listing that marks each declared path `loaded` or `ABSENT`, and each key now names the tier it was satisfied from, so a value coming from a plaintext file on the local disk is never mistaken for one the deployment will inject. `${scope}` and `${env}` inside a declared path are values the launcher supplies and this command cannot read, so the report names the ones it assumed, a new `--env` flag selects which env block `homedir` is read from, and a path whose tokens cannot be resolved is reported and skipped rather than opened blindly — which can only make the gate stricter than the runtime, never laxer. A bundle that declares no `secrets.file` reports exactly as before.'
