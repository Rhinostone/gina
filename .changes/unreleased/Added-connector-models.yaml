kind: Added
body: 'Added `gina connector:models <connector> @<project> [<bundle>]` — lists the models a configured AI connector''s provider can serve (its live catalogue), the read sibling of `connector:test --connect` (which makes the same `models.list()` call but keeps only the count). Text mode prints one model id per line; `--format=json` emits `{ project, connector, provider, count, models }` with each entry passed through verbatim from the provider. Resolves config only and never prints credentials; offline providers such as `ollama://` work with no internet. Exits non-zero on connector-not-found, a non-AI connector, a credential or transport error, or a provider client that cannot enumerate models (reported as unsupported, never a fabricated empty list).'
time: 2026-07-03T20:40:00+01:00
