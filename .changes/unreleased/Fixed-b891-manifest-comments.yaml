kind: Fixed
body: 'A `//` comment line or a `/** … */` docblock in a project''s `manifest.json` no longer breaks `bundle:list`, `bundle:status`, `project:status`, `gina-container` or the bundle''s boot: every reader of the file now parses it as `requireJSON()` does, as the connector CLI page already documented. Before, one comment line made `bundle:list` crash, `bundle:status` report the bundle missing from its project, `project:status` print nothing and `gina-container` refuse the project, and a bundle started another way died at boot reading `project.bundles` of `undefined`. A new global, `parseJSONWithComments(text, filename)`, parses as `requireJSON()` does but throws an Error naming the file instead of exiting the process. The CLI still drops comments when it rewrites the file, as `bundle:add` does. (#B891)'
time: 2026-10-16T17:09:42+01:00
