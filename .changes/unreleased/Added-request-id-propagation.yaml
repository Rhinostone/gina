kind: Added
body: 'Added cross-service request-id propagation. The always-on request id (req._ginaReqId, resolved from a sanitised inbound X-Request-Id or a fresh UUID) is now forwarded as x-request-id on every outbound self.query() call — the file-download proxy path plus both the HTTP/1 and HTTP/2 inter-bundle client paths — so one logical request stays correlatable as it fans out across bundles. A caller that sets x-request-id explicitly is never overwritten, and only the sanitised resolved id is forwarded (never a raw inbound header). The server also echoes X-Request-Id back on every response (both engines), so a caller, load balancer, or APM can read the id off the wire; the echo is independent of log format and guarded against an already-sent response. Server-side only — no bundle rebuild; restart to apply.'
