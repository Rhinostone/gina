kind: Fixed
body: 'Shell::run() (the `lib/shell` helper) now throws a `TypeError` at the caller''s line when its fluent `.onComplete()` or `.onData()` handle is given anything but a function — `Shell::run — onComplete expects a function, got string`. Both handles wrap the callback inside their own listener, so a wrong argument used to be accepted silently: the command ran to completion, the resulting `callback is not a function` was caught by the close handler''s try/catch and only logged through the framework logger, and the caller''s delivery never arrived. `null` is reported as `null` rather than `object`. This is the same guard `run()` gained for its own callbacks; unlike `run()`, whose `.onData()` hands the callback straight to the emitter and so already failed fast, both of Shell''s handles needed it. (#B491)'
