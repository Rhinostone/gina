kind: Fixed
body: 'Fixed a form''s live check going permanently dead after a rejected submit attempt. The submit path arms an internal submitting latch before validating — deliberately, so live-check stays quiet while a request is in flight — but only the XHR settle cleared it, and a rejected submit renders the field errors without sending anything. One invalid submit attempt therefore latched the flag for the rest of the page''s life: every later keystroke was swallowed by the live-check gate and the submit trigger kept aria-disabled="true" plus the gina-form-submit-disabled class until reload, hard-blocking keyboard and assistive-technology users while mouse users saw a disabled-looking trigger that still submitted. Because the flag lives on the form instance rather than a listener, rebinding the form did not restore the live check either. The internal validation handler now releases the latch on the rejected branch, before moving focus to the first invalid field; a genuine in-flight submit still suppresses live-check exactly as before. Browser-bundled — re-bake your bundles at pickup.'
