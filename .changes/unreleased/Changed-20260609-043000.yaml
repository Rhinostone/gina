kind: Changed
body: 'The default Swig render path now supports a per-bundle opt-out to its CVE-2023-25345 loader confinement. By default the loader stays confined to the bundle templates root — a nested {% include %} / {% import %} that resolves outside it is rejected. A bundle that legitimately includes an author-relative asset from a sibling directory can declare those directories in a new setting, settings.template.swig.trustedRoots: a list of paths (each relative to the bundle templates root, or absolute) that nested include / import resolution may enter; every other out-of-root path still throws. Empty or absent keeps the bundle fully confined, so existing bundles are unchanged. The top-level {% extends %} layout boundary stays root-confined regardless.'
time: 2026-06-09T04:30:00.000000+01:00
