kind: Fixed
body: 'Hardened the dev Inspector SPA against two edge cases: a corrupted or tampered fold-state value in localStorage could throw and break the collapsible tree toggles, and a form-data section label was inserted into the panel without HTML-escaping. Both are now guarded. Dev Inspector tooling only; no impact on application pages.'
