kind: Added
body: '`req.login(user, done)` now works for gina-native bundles and rotates the session id before binding the user — the session-fixation defense. Previously the framework''s login shim only served Passport bundles; without Passport it threw `passport.initialize() middleware not in use`, so native bundles bound the user by hand with no rotation. The native branch now regenerates the session (destroying the pre-login record), binds the principal at `req.session.user`, stamps the absolute-timeout anchor, persists, and reports through the required callback; when the session provider exposes no `regenerate()` it binds without rotation and warns. Passport bundles are untouched — Passport''s own `req.login` still wins, and the shim''s Passport branch is byte-identical. Outstanding CSRF tokens survive the rotation: they are re-derived from the current session id on the next response.'
