kind: Fixed
body: 'A `connectors.json` entry that names neither `database` nor `keyspace`, such as the SQLite session, job and kv store entries the guides show, no longer leaves an empty `models/undefined/entities` directory: each ORM connector named its model directory after the entry''s `database`, and now creates and reads none for such an entry. A SQLite entry that sets neither `file` nor `database`, such as the session entry of the going-to-production tutorial, also made the model layer open a database file `undefined.sqlite` in the gina home (`~/.gina` by default); it now gets an in-process (`:memory:`) database. The session, job and kv stores open their own file and are unchanged. A `models/undefined/entities` directory and an `undefined.sqlite` file left by an earlier version can be deleted, but data stored through the connection of an entry with neither `file` nor `database` is in that file: set the entry''s `file` to it before upgrading. Restart the bundle. (#B907)'
time: 2026-10-16T21:56:54+01:00
