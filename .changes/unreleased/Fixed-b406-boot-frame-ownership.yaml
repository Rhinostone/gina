kind: Fixed
body: 'A crash during bundle bootstrap now aborts the process loudly instead of leaving it hung and silent. The boot callback in core/gna.js is declared async, so a synchronous throw anywhere in its frame became a promise rejection: the process-level net only logged it at error level - no `[ emerg` marker for the daemon startup watchdog, no exit - so `gina bundle:start` sat on its 60-second startup timer and reported a timeout with no cause attached. The whole frame is now owned by a try/catch that routes every failure - including a non-Error rejection like `throw null`, coerced first because the terminal reads `.stack` - into abort(), the existing boot terminal: an emerg-level line the daemon watchdog matches on (it then kills the child and prints the cause immediately), a synchronous stderr flush that survives the exit, and exit code 1. Behaviour change worth knowing: a throw late in the boot frame that previously left a half-initialised process limping along now refuses the boot cleanly - if a bundle that used to "start" begins aborting after this release, the printed cause was always there, previously invisible. Server-side only: pickup is a bundle restart, no re-bake.'
