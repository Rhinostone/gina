kind: Fixed
body: '`gina-container` now stops with exit code 1 when the project root has no `manifest.json`, and names the file and the two commands that create it: `gina project:add @<project> --path=<root>`, then `gina bundle:add <bundle> @<project> --import`. The bundle reads `manifest.json` at boot, so it never started without one: the launcher used to fall back to `bundles/<bundle>/index.js`, a path a checkout does not have, and report that path as missing, or start the bundle only for it to fail on the manifest. A `manifest.json` that is not valid JSON once its comments are ignored, or that does not list the bundle, now stops the launcher with `manifest.json cannot be used: <reason>`. An image that boots today is not affected, and there is nothing to restart. (#K8s7)'
