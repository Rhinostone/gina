kind: Fixed
body: 'The Couchbase reconnect classifier no longer throws under every supported SDK. `gina.onError`''s handler tested `err instanceof couchbase.Error`, but no supported couchnode (3.x/4.x) exports a bare `Error` class — verified against a real 4.1.3 `dist/errors.js`, where `Error` is undefined while `CouchbaseError` and 81 sibling classes are present — so the check raised `TypeError: Right-hand side of ''instanceof'' is not an object` the moment the handler ran, and because that operand is evaluated first, the shutdown-bucket message arm (which needs no SDK class) was unreachable too. On the Express engine this replaced the real error with the TypeError in subsequent handling; on Isaac the listener is never dispatched at all (middlewares are invoked 3-arg, so the error branch that emits never fires). Each `instanceof` is now guarded on the class existing, in both `connector.v3.js` and `connector.v4.js`. Deliberately NOT an activation: modern SDK errors carry no numeric `.code`, so the guarded arms stay inert, and the SDK-2 shutdown-bucket message greps zero in the 4.1.3 dist. The real error now reaches the handler''s designed terminal path instead of being replaced. (#B204)'
