kind: Added
body: 'The general-purpose KV primitive (#KV1) gains a SQLite backend — the zero-dependency durable option between in-memory and redis: point a namespace''s `store` at a `connectors.json` sqlite entry (`{ "kvDb": { "connector": "sqlite", "file": "/data/kv.db" } }`) and the namespace survives a bundle restart and is visible to any process opening the same file, with no server to run. Namespaces sharing one file are isolated by a composite key rather than a prefix, so `clear()` touches only its own namespace. Every read-modify-write operation — set-if-absent, consume, compare-and-delete, counters — runs inside an IMMEDIATE transaction, so it stays atomic when a SECOND PROCESS shares the file, which is the case the backend exists for. Expiry is filtered on every read and swept periodically, so an expired entry is never observable. Uses `node:sqlite` (built in on Node, a `bun:sqlite` adapter under Bun), so nothing to install. All three backends are now verified against ONE shared contract spec rather than three separate suites.'
