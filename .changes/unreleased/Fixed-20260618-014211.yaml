kind: Fixed
body: 'Fixed a dev-mode memory retention on the HTTP/2 `self.query()` client path. When an outbound query stream settled at a non-retry outcome — timeout, stream error, premature close, exhausted 502 retries, or normal completion — its event listeners stayed attached, and through them the per-request controller plus the large per-request configuration clone it had captured were retained until the cached HTTP/2 session was eventually torn down. Under sustained bursty inter-service traffic the retained clones accumulated and could push a long-running dev bundle toward its heap limit. The stream is now released at every non-retry terminal (its timeout cancelled, listeners detached, stream closed), which bounds live heap. Production was unaffected — it reuses a single controller class, so retention was already bounded — and the retry paths already destroyed the session.'
