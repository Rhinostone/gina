kind: Security
body: 'Added gina.plugins.Csp({ directives, reportOnly }) — opt-in middleware that emits the Content-Security-Policy response header on every response (#HDR5). Opens Phase 2 of the Web Security Headers track. v0 ships STATIC DIRECTIVES ONLY — per-response nonce wiring requires template-render integration and defers to a future CSP-aware view-layer plugin that can co-operate with swig / nunjucks template rendering. Strict whitelist of 27 CSP Level 3 standard directives (17 fetch + 2 document + 2 navigation + 2 reporting + 2 document-policies + 2 trusted-types); unknown directive names throw at factory call time because CSP typos are silent (browsers ignore unknown directives with no error, no console warning). Value parsing: array of source-list tokens (joined with space), pre-formatted string (emitted as-is), boolean true (boolean-only directives upgrade-insecure-requests / block-all-mixed-content + hybrid sandbox), boolean false (omit). reportOnly:true at top level switches the header name to Content-Security-Policy-Report-Only for non-enforcing migration testing. directives is required (factory throws if missing/empty — no sensible cross-bundle default since every bundle has its own resource graph). Mirrors the HDR1-7 plugin shape (idempotent first-writer-wins via res.getHeader) but introduces a new validation dimension: directive-name (object KEY) validation. 92 unit tests; full suite 5768/5768. Opens Phase 2 — HDR6 splits into Coep / Coop / Corp three plugins per the wrapper-consistency decision; HDR15 closes Phase 2 with gina.plugins.SecurityHeaders({...}) combined wrapper composing HDR1-7 + HDR5 + HDR6/13/14.'
