kind: Fixed
body: 'Fixed #B402 — a synchronous throw inside a `self.query()` callback invoked on a TRANSPORT-ERROR delivery is now owned at the delivery site. All 14 formerly-bare error-path deliveries (host-missing, circuit refusal, the query-scope outer catch, both ca-read catches, HTTP/1.1 ALPN and request-error, the HTTP/2 typed terminals and both pre-flight PING failures) wrap the callback so a throw routes to a shared guard answering a flat 500 (with the #ERRREF correlation ref, marker `Controller Query Exception on transport-error callback throw.`). Previously, on the event/timer-frame sites the throw escaped to the process handler — emerg + SIGTERM, a whole-bundle kill on BOTH engines for consumer bundles — and on the caller-frame sites the query-scope catch re-invoked the app callback a second time with its own exception as the error argument. Behaviour change: a throwing callback on an error-path delivery now answers 500 instead of killing the bundle or double-invoking; the callback still receives the original transport error first, and callbacks that do not throw are untouched.'
