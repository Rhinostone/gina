kind: Fixed
body: 'When an environment variable is SET but EMPTY, the `${secret:KEY}` file tier now warns as it falls through to the file. The fall-through itself is deliberate and unchanged: an empty value counts as absent, which is what keeps the ordinary `environment: ["X=${X}"]` passthrough working when the outer variable is unset. But the same shape appears when a container entrypoint runs `export X="$(fetch …)"` and the fetch FAILS — and there a file quietly supplying a stale value is exactly the shadowing the environment-wins ordering exists to prevent. Because the two are indistinguishable from inside the process, the file tier no longer stays silent about it: it emits a warning naming the key (never the value) at a level that survives the default log hierarchy. The documented precedence is also corrected throughout — it is a NON-EMPTY environment value that always wins.'
