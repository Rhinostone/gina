kind: Added
body: '`lib.authn` adds RFC 6238 TOTP helpers for a second factor, implemented against the RFC rather than taking a dependency. `generateTotpSecret()` mints a base32 secret, `otpauthURL({ secret, account, issuer })` builds the `otpauth://` URI every standard authenticator app scans as a QR code, `generateTotp(secret)` produces a code, and `verifyTotp(token, secret)` checks the current step plus one either side in constant time, returning `{ valid, delta }`. Replay defence is yours, and `delta` is what it needs: persist the accepted step per user and refuse anything not strictly greater, or an observed code stays usable for its whole acceptance window — the RFC makes this the verifier''s job and gina has no place to write it. Storing the secret is yours too; treat it as a credential and encrypt it at rest. A malformed code returns `{ valid: false }` rather than throwing, so an attacker learns nothing from the difference, while an unusable secret does throw — that is a configuration fault, not a login attempt. Recovery codes are deliberately not built: they are single-use random strings, so `hashPassword` plus your own table already expresses them.'
