kind: Added
body: 'The RFC 9211 Cache-Status identifier the render/output cache reports on the wire is now configurable via `server.cache.name` (settings.json `cache` block, default `gina-cache` — the wire is byte-identical when unset). The value must be a letter followed by up to 63 of [A-Za-z0-9._-] (a conservative RFC 8941 token subset); an invalid value is ignored with a boot warn, never sanitized into a name the operator did not write. When `server.hidePoweredBy` is true and the cache is enabled, leaving `name` unset now logs a boot warn naming the remaining framework disclosure — set any token (e.g. `cache`) to close it, or explicitly `gina-cache` to keep the current wire and silence the warn. The identifier is resolved once at boot and read by every mint site on both engines, hit and miss, so it can never disagree across engines or outcomes.'
