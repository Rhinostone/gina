kind: Fixed
body: 'A parent whose bracket-notation keys mix indexes and names now nests to one object keyed by both, whatever the order: `items[0][id]=a0&items[1][id]=a1&items[selected]=a1` gives `{ items: { 0: { id: ''a0'' }, 1: { id: ''a1'' }, selected: ''a1'' } }`, the same as with `items[selected]` first. Before, when the indexes came first, the name was read as index 0: the first element was replaced by `{}`, and the name was lost when the data was serialized, so the first row and the name never reached the server. This applies to urlencoded and multipart request bodies, query strings, `formatDataFromString()` and the forms the browser validator submits or `send()`s. A parent whose keys are all indexes is still an array. What to check: code that reads such a parent as an array (`.length`, `.forEach`, `.map`) now receives an object; iterate its keys, or give the named key a parent of its own. Browser-bundled: restart the bundle and rebuild your bundles (`gina bundle:build`) to pick it up. (#B596)'
