body: 'The development Inspector /_gina/agent SSE endpoint now streams live AI token-stream and application-event frames over the HTTP/1 server, matching the HTTP/2 (isaac) engine SSE and the WebSocket transport. Previously these two live frame types only reached Inspector clients connected over the isaac SSE or the WebSocket.'
