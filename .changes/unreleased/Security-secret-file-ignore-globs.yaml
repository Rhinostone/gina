kind: Security
body: 'Ignore rules for secret files now match by glob rather than by exact name. The previous single `.env` entry matched neither `secrets.env` nor `.env.production`, so a file with either name sat outside the ignore rules by default; `.env`, `.env.*` and `*.env` are now all covered in the repository ignore list, the published-package ignore list, and the bundled project template — the template additionally lets `.env.example` and `*.example.env` through so a sample can still be committed.'
time: 2026-08-04T18:07:40+01:00
