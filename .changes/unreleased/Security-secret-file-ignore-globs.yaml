kind: Security
body: 'Ignore rules for secret files now match by glob rather than by exact name, in both the repository ignore list and the published-package ignore list. The previous single `.env` entry matched only that exact name. Dot-prefixed variants such as `.env.production` were already covered by the pre-existing `.*` catch-all, but a secret file whose name does not begin with a dot — `secrets.env`, `db.env`, `production.env` — matched nothing and was committable by default. `.env`, `.env.*` and `*.env` are now all covered, which closes that gap.'
time: 2026-08-04T18:07:40+01:00
