kind: Added
body: 'Added ICU MessageFormat opt-in via the `tIcu` template filter for swig + nunjucks (#I18N2 part 2). Closes #I18N2 — translators and template authors can now use ICU MessageFormat syntax across all three of gina''s i18n surfaces (`gna.t.icu()` global, `self.t.icu()` controller helper from part 1, plus the `tIcu` template filter from this part). The filter shape mirrors the existing `t` filter exactly: `{{ "key" | tIcu({ count: 5 }) }}` for plurals, `{{ "key" | tIcu({ gender: ''female'', name: user.name }) }}` for select / gender. Auto-binds the request culture from `req.culture` (slice 3) and the bundle from `options.conf.bundle` — same auto-binding pattern as the `t` filter. Identical surface across the swig and nunjucks engines so templates port between renderers unchanged. Catalog values that are NOT strings (plural-form objects, nested categories) fall through to the v1 `t()` path so a single bundle catalog can mix v1 and ICU shapes freely. Roadmap close-out lands in this commit too: #I18N1 (i18n core) and #I18N2 (ICU MessageFormat) both flip from 📋 to ✅ in `ROADMAP.md`. Tests at `test/lib/i18n-icu.test.js` extend with 11 new filter source-pin assertions covering: lib/swig-filters declares `self.tIcu`, swig tIcu reads `req.culture` + `options.conf.bundle`, swig tIcu forwards to `lib.i18n.tIcu`, swig `t` filter unchanged (no regression), the same 5 invariants for lib/nunjucks-filters, and a parity test confirming swig + nunjucks tIcu filters call `lib.i18n.tIcu` with identical arguments. Full local suite green: 4566 / 4566 (4555 from part 1 + 11 new). Closes the #I18N2 contract.'
