kind: Changed
body: 'Dropped dead `X-Powered-By: "Gina I/O - v${version}"` default from `core/template/conf/env.json`. The entry was structurally inert today — overwritten on Express by `server.js:2425`''s `setHeader` before any middleware ran, and never read by Isaac at all (`server.isaac.js` does not read `server.response.header`). Removing it has zero observable wire effect AND resolves a format inconsistency (only the canonical `Gina/<version>` shape remains on the wire). The `gina.plugins.HidePoweredBy()` middleware (Express) and `settings.json > server.hidePoweredBy: true` gate (Isaac, via the `_setPoweredByHeader()` helper at `server.isaac.js:572-577` covering all writeHead + setHeader emit sites) cleanly suppress the header. Plugin docstring, README, settings.json comments, and bundle boilerplate updated to describe the actual Phase 2 architecture.'
time: 2026-05-17T21:01:37.462116+01:00
