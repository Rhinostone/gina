kind: Security
body: 'The gina-native `logout()` shim now destroys the persisted session record instead of only clearing `req.session.user`: previously the store record, the session id and every other session key survived to TTL after logout — a leaked or intercepted session id stayed valid server-side long after the user logged out. `logout()` calls the session''s own `destroy()` when it exposes one (express-session), degrades gracefully when it does not, and accepts an optional callback — `req.logout(function(err) { ... })`. Review flows that relied on other session keys surviving logout: the whole record is gone afterwards. The session cookie stays the consumer''s to expire (its name is not discoverable by the framework), and Passport bundles are unaffected — the shim never installs when Passport is initialized.'
