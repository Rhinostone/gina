kind: Fixed
body: '`merge()` no longer rewrites the object it was given (#B428). When a source subtree was merged into an existing target level that lacked its key, the subtree was referenced and then walked again as if it were being merged into itself: every array inside the caller''s object was replaced by a copy at every depth, and an array of primitives silently lost its duplicates — a per-call cost proportional to the value, and a contract violation for any code that expected `merge` to leave its source alone. A subtree that is the same object on both sides is now skipped (merging a value into itself is identity), so a grafted source keeps its arrays and its duplicates and the result references it. Merging two different values is unchanged, as is the shallow copy built when the key is absent at the root. No action required.'
