kind: Fixed
body: 'The http/2 `link` preload header is sent on every response again, not only on the first one per view. With `server.cache.enable: true` a bundle served over HTTP/2 built its `rel=preload` header on the compile path only, and the compiled-template cache-hit path returned before reaching it — so in production the first request of a view carried the hints and every later request carried none, with no 103 Early Hints to compensate. The header is now assembled once per view and memoised on the compiled-template cache entry, and a cache hit re-emits it under the same gates (never for an XHR request, never in dev). Two consequences worth knowing: when the template cache is on, an XHR request now computes the preload map too — the entry is shared with every later render of the view, so a page first loaded by fetch no longer leaves it empty — and an empty `link` header is no longer sent when nothing qualifies. The Inspector''s `view.assets` map, restored for the compile path by #B490 earlier in this release, now reaches cache hits as well: the router clones options per request, so the map a compile left behind had died with that request. Server-side only; pickup is a bundle restart. (#B495, #B490)'
