kind: Added
body: 'Added a Redis backend for the connector-backed job store: point `jobs.store` (app.json) at a `connectors.json` entry with `"connector": "redis"` (same `host`/`port`/`db`/`password`/`tls`/`cluster` keys as the Redis session store; driver `ioredis`, resolved like the session store with a project `node_modules` fallback) and job records live on a shared Redis — restart-durable and visible across processes and pods, while the deferred function still runs in the creating process. Records carry per-state and expiry indexes maintained atomically (MULTI) so list and sweep never scan the keyspace, and expiry stays sweep-driven for parity with the other stores: no per-key TTL. Redis Cluster is supported via a hash-tagged key prefix (default `{jobs}:`).'
