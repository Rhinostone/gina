kind: Security
body: 'A route placeholder value taken from the request — the query string or body, merged into the request''s parameters — was substituted verbatim into a route''s `param.file`, `param.path` or `param.namespace` by the router''s placeholder fill, AFTER the route requirement had been matched against the URL segment. A request could therefore supply a query value of the same name as a placeholder and override the requirement-validated URL segment, and a value carrying `..` escaped the bundle template root when the template was resolved — an arbitrary template-file read (CWE-22, the CVE-2023-25345 directory-traversal class). The render delegates'' own boundary check only inspected the first character of the resolved file, so a `..` in the middle of a filled path passed. The router now fails closed: a request-supplied value that would escape as a path component (a `..` segment, or a leading separator) is rejected before it can fill a filesystem-path parameter, on every rendering engine. Developer-authored static prefixes in `param.file` (which are not request values) are unaffected. (#B833)'
