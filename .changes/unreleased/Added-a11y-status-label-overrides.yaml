kind: Added
body: '`gina.config.a11y` overrides the accessibility status strings gina announces on its own behalf, for example `gina.config.a11y = { submitting: ''Envoi…'' }`. English defaults ship for anything a project does not translate, mirroring how `setErrorLabels` already handles built-in rule labels. These are distinct from rule error labels: `setErrorLabels` is keyed by rule name, while these describe what the framework itself is doing.'
