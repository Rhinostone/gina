kind: Added
body: 'Datastore query errors now carry a transient-vs-permanent classification, so an application can tell a self-healing failure from a real one without string-matching vendor error text. When a connector query fails, the error reaching your controller is stamped with `err.isTransient` (true when a retry after backoff can succeed — a datastore timeout, a dropped connection, a node warming up after a restart, rebalance or failover) and `err.transientReason`, a normalized token naming the condition (`socket:econnrefused`, `postgres:serialization-failure`, `mongo:transient-transaction`, `couchbase:timeout`, …). A controller can branch on it to render an honest "temporarily unavailable, please retry" instead of a generic 500 for a condition that clears itself in seconds. The classifier normalizes signals every driver already carries — socket errno, driver error codes and class names, ANSI SQLSTATE classes, MongoDB error labels, Couchbase N1QL cause codes — across all six datastore connectors (Couchbase, MongoDB, MySQL, PostgreSQL, ScyllaDB, SQLite), and is deliberately conservative: an unrecognized error, or one that is genuinely permanent such as a DNS misconfiguration (ENOTFOUND) or a duplicate key, classifies as permanent. Purely additive — it sets only those two fields, never alters existing ones, and never throws, so nothing changes for code that ignores them. Server-side; restart to pick it up.'
