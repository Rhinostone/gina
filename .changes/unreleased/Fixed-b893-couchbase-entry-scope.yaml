kind: Fixed
body: 'A Couchbase entry in `connectors.json` without a `scope` now gives its entities the bundle''s `NODE_SCOPE`, as documented. The connector wrote its own SDK default, `_default`, into the entry, and the model layer then took that value as the data scope: every query filtered on `_scope = $scope` ran against `_default`, so documents stamped with the bundle''s scope were not found. Entries that set `scope` are not affected. Each Couchbase connector now logs its data scope at boot, and where it came from. **Documents an entry without `scope` inserted through its entities carry `_scope: "_default"` and stop matching after this fix**: stamp them with the environment''s scope, or set `"scope": "_default"` on the entry to keep the old behaviour; the 0.7.4 → 0.7.5 migration notes show both. (#B893)'
