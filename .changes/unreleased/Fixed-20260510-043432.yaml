kind: Fixed
body: 'Bumped @rhinostone/swig to 2.0.1. Fixes bracket-access expressions like `arr[arr.length-1]` and `arr[idx-1]` that previously failed with "Unexpected closing square bracket". Restores correct rendering of negative-literal expressions like `{{ -5 }}` whose leading sign was being eaten by the whitespace-control regex. Adds `{{- … -}}` / `{%- … -%}` whitespace-control parity to `@rhinostone/swig-twig`.'
