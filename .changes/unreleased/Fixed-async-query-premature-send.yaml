kind: Fixed
body: 'FormValidator: a submit can no longer go out while an async `query` rule''s verdict is still on the wire (#B332). A concurrent validation pass used to disarm the whole pass''s async waiter when the field''s `asyncCompleted` listener was already registered, completing on the sync-only verdict — `send()` fired before the query answered and the error rendered after the POST had left. The arm guard is pass-local now, waiters stack and self-detach per pass, and the engine marks each (field, value) request in flight (`ginaFormValidatorQueryPending`) so the same-value fast path never releases a verdict-less field while its request is pending. A failing query now blocks the submit entirely; the submit handler also refuses re-entry while a cycle is between click and settle.'
