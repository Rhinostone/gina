kind: Added
body: 'Added ICU MessageFormat opt-in via `t.icu()` — server-side primitive + framework wiring (#I18N2 part 1). Adds an opt-in `tIcu(key, params, culture, options)` variant powered by `intl-messageformat` to the `lib/i18n` module, exposed as `gna.t.icu(...)` (sibling of `gna.t`) and `self.t.icu(...)` (controller helper auto-binding `req.culture` from slice 3, plus `bundleName` / `devMissingKey` / `fallbackChain` from `local.options.conf.content.settings.i18n`). Existing `gna.t()` / `self.t()` shape stays unchanged — v1 catalogs (plain strings with `{name}` placeholders, plural-form objects keyed by CLDR categories, nested categories) continue to work as today. Catalog values that are NOT strings (plural-form objects, nested objects) automatically fall through to `t()` so the same bundle catalog can mix v1 and ICU shapes freely. Catalog values that ARE strings get interpreted by `intl-messageformat` — covers ICU `{count, plural, one {# item} other {# items}}`, `{gender, select, female {…} male {…} other {…}}`, nested combinators, explicit-number plural matchers (`=0`), and the cross-locale CLDR plural rules the library ships its own data for (English `one/other`, French `n in 0..1` singular, Russian `one/few/many`, Arabic `zero/one/two/few/many/other`, etc.). Adds `intl-messageformat: "^11.2.4"` to `framework/v0.3.11-alpha.2/package.json` dependencies (next to `@rhinostone/swig` and `psl`). Library is BSD-3-Clause, two transitive deps (`@formatjs/fast-memoize` + `@formatjs/icu-messageformat-parser`), zero `new Function`/`eval` calls in the published tarball — preserves the framework''s post-#SCS1 eval-safety posture. After clone / merge / worktree switch, `npm install` inside `framework/v0.3.11-alpha.2/` is required to populate the dep (same convention as the existing swig / psl deps). The library is ESM-only since v10, so `lib/i18n` loads it via dynamic `import()` from a module-level loader: `ensureIcuLoaded()` returns a Promise that resolves to the `IntlMessageFormat` constructor; idempotent, cached. `loadCatalogs()` kicks off the loader fire-and-forget at bundle boot so by the time the first request is served the load has resolved and `t.icu()` is sync. Tests can `await ensureIcuLoaded()` explicitly. Failure (e.g. dep not installed) is captured on `icuLoadError`; subsequent `t.icu()` calls surface the error verbatim with an actionable "npm install intl-messageformat" hint. `IntlMessageFormat` instances are memoised per `<bundleName>::<culture>::<key>` on `process.gina._i18nIcuFormatters` so the parse cost is paid once per (bundle, culture, key) per process; `clearCatalogs(bundleName)` drops both the catalog AND the cached formatters so test isolation is clean. Tests at `test/lib/i18n-icu.test.js` — 49 source-inspection + behavioural assertions covering module exports + slice 1/3 export preservation, loader idempotence + error capture, `tIcu` basic API (null/empty key / no-culture / no-catalog / plain placeholder / missing key), plural rules (English / French `n in 0..1` / Russian `one/few/many` / `=0` explicit matchers), select / gender (female / male / other fallback / nested plural inside select), fallback chain (region → base language → bundle default → exhausted), non-string fallthrough (plural-form objects + nested categories + mixed catalog with both shapes), IcuFormatter cache (memoisation + `clearCatalogs` clearing), `gna.t.icu` source-pin (key/params/culture/options signature mirrors `gna.t`), `self.t.icu` source-pin (auto-binds `req.culture` / `local.options.conf.bundle` / `settings.i18n.devMissingKey` / `settings.i18n.fallbackChain`), framework dep declaration, and negative invariants (read-only catalogs / parse error graceful degrade / format error graceful degrade). Full local suite green: 4555 / 4555 (4506 baseline + 49 new). Slice part 2 — `tIcu` template filter for swig + nunjucks + scaffold ICU example + docs site update + roadmap status flip — follows.'
