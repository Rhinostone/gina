kind: Added
body: 'The general-purpose KV primitive (#KV1) gains a redis backend for namespaces shared across hosts: point a namespace''s `store` at a `connectors.json` redis entry (`{ "kv": { "namespaces": { "tokens": { "store": "kvRedis" } } } }`) and the namespace is served by redis instead of process memory — so several bundles or replicas can share one namespace, which the in-memory backend cannot do. Every guarantee stays server-side: set-if-absent is a single `SET .. PX .. NX`, consume is `GETDEL` where the server supports it (redis 6.2 and above) and a Lua script below that rather than a `GET` plus `DEL` pair, and compare-and-delete and TTL-on-create-only counters are Lua as well. Keys are prefixed per namespace, so two namespaces may share one connectors entry; cluster keys are deliberately left un-tagged so a namespace spreads across slots, and `clear()` scans each master node. Connection policy — `commandTimeout`, `maxRetriesPerRequest`, `enableOfflineQueue` — is read from the connectors entry and otherwise left at the driver''s defaults, so a cache-like namespace can be tuned to fail fast while a token namespace keeps the offline queue. Requires `ioredis` in your project. Naming a connector that has no kv-store implementation still refuses the boot.'
