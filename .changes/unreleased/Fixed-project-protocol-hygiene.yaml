kind: Fixed
body: 'A project''s `protocols` and `schemes` lists in `~/.gina/projects.json` can no longer be polluted by a bundle''s invalid `server.protocol`/`server.scheme` declaration — nor by another project''s bundles (#B378, #B379). Two defects compounded here. First, `gina project:add`/`gina project:import` adopted whatever protocol or scheme a bundle''s `settings.json` declared straight into the project''s registry lists, unchecked: an arbitrary string became a registered "valid" value, persisted, and `gina image:build` then baked the polluted list into the synthesized container image''s environment. Second, the same pass resolved every registered project''s bundles against the path of the project being added or imported — so when two projects each had a bundle of the same name (an `api` or `web` in both, say), one project''s declarations silently leaked into the OTHER project''s registry entry, from a command that never named it. Both are fixed under one contract: the framework''s supported sets in `~/main.json` are the authority, and a project''s lists stay a subset of them. A bundle''s declared value may still extend its own project''s list when the framework supports it (that is how the port matrix learns what a project''s bundles use); an unsupported value is now reported by name — bundle, value, and the allowed set — once per command, and is adopted nowhere, not even as the bundle entry''s default. Each project''s bundles are resolved against that project''s own path. The import-time heal that rewrites an invalid bundle declaration to the project default still runs (it is what keeps the bundle bootable), but it now reports each change by name (`server.protocol "x" -> "http/1.1"`) as a warning instead of rewriting the file behind a debug line.'
