kind: Fixed
body: 'Fixed the dev Inspector''s footer source-mode badge, which never appeared when the Inspector ran as a standalone window opened from a `?target=` URL. That badge names where the window''s data comes from (`bound`, `agent`, or a warn-tinted `global`), but it was only ever painted from the data-poll timer — which standalone mode deliberately never starts, since its data is pushed over the stream rather than polled — so the badge kept the hidden state it ships with and the window reported no mode at all. The same `agent` mode did show up when the window was reached through the "No source" connect form instead, which meant the badge''s presence depended on how the Inspector had been opened rather than on the mode it was in — the opposite of what the badge exists for. Standalone windows now report their source mode on both entry paths and for both agent transports (WebSocket and the SSE fallback). Polling is still not started in that mode, deliberately: it would repaint the active tab on every tick and disturb scrolling, expanded nodes and text selection, and the refresh button does not need it.'
