kind: Security
body: 'Added gina.plugins.XPermittedCrossDomainPolicies({ value }) — opt-in middleware that sets the X-Permitted-Cross-Domain-Policies response header on every response (#HDR12). CLOSES Phase 1.5 (helmet-parity gap-fill). Restricts Adobe Flash and PDF readers from honouring cross-domain policy files served from this origin — defends against the cross-domain-data-read shape where a misconfigured crossdomain.xml could allow malicious Flash/PDF content on another site to read data from this one, bypassing the same-origin policy. Four valid Adobe spec tokens: "none" (default, most restrictive — no policy files honoured), "master-only" (only /crossdomain.xml is honoured), "by-content-type" (only files served with Content-Type: text/x-cross-domain-policy are treated as policy files), "all" (any policy file honoured — NOT recommended; defeats the header purpose). API-shape divergence from helmet (which uses { permittedPolicies: <enum> }): gina uses { value: <enum> } matching the existing single-token-enum convention of #HDR2 / #HDR3 / #HDR6 / #HDR9 / #HDR13 / #HDR14. README documents the helmet-to-gina mapping for migrators. Flash EOL since December 2020; Adobe Reader historically honoured the header but most modern PDF readers ignore it; defense-in-depth + helmet-parity narrative. Caller options always win over settings; values are normalised to lowercase. Idempotent — first-writer-wins via res.getHeader. Mirrors the #HDR14 Corp single-enum plugin shape exactly. 60 unit tests in test/core/x-permitted-cross-domain-policies-plugin.test.js including a negative-invariant lock on the helmet-shape { permittedPolicies: ''master-only'' } silent-fallback (it does NOT switch the gina default — emits default "none"). CLOSES Phase 1.5 — all 5 helmet-parity plugins now shipped (#HDR8 + #HDR9 + #HDR10 + #HDR11 + #HDR12). Next slice: SecurityHeaders (#HDR15) wrapper extension to include HDR8-12 in the safe-set defaults.'
