kind: Security
body: 'The client-served routing map (`/_gina/assets/routing.json`) is now built from an ALLOWLIST instead of a denylist, and it no longer discloses server-side contracts to anonymous browsers: controller dispatch keys (`param.control`/`file`/`path`/`title`), `namespace`, `scopes`, `cache` configuration (including invalidation event names), `csrfExempt`, `middlewareIgnored` and `validator::` requirement bodies all stay server-side, and — structurally — so does every FUTURE route key until it is deliberately added to the roster (`schema/routing.json` is `additionalProperties: true`, which is how several of these reached the wire in the first place). What ships is the measured client contract: `url`, `method`, `webroot`, `bundle`, `hostname`/`host` (raw deployments only, per the existing host-stripped proxied variant), the `negotiate` capability flag, plain-regex `requirements` entries, URL-placeholder `param` bindings, and a derived `isRedirect` boolean replacing `param.control`. Client URL building (`getRoute`/`toUrl`, including cross-bundle `rule@bundle` references) is unaffected; code reading OTHER keys off `gina.config.routing` must move that logic server-side.'
time: 2026-08-02T13:40:00+01:00
