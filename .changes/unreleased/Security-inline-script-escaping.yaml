kind: Security
body: 'Hardened the escaping of server-side data serialised into inline `<script>` blocks. The previous guard matched only the literal `</script>` and `<!--` sequences, but the HTML5 script-data end tag also accepts a tab, newline, form feed, space or `/` after the tag name, so `</script >` and `</script/>` closed the block and the remainder of a stored value was parsed as HTML. Values are now escaped by neutralising `<` itself, which no terminator spelling can work around, and the same helper is applied at every site that serialises server data into an inline script rather than at one site per renderer. U+2028 and U+2029 are escaped as well, since both are legal in JSON but were line terminators to the JavaScript parser. The escaped output parses back to an identical value, so no data shape changes. Reported as #69. Server-side only: a bundle restart picks this up, no rebuild needed.'
