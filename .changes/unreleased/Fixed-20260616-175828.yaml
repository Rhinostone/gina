kind: Fixed
body: 'Fixed multipart file uploads ignoring the configured upload directory. The handler read a non-existent `upload.uploadDir` key and always wrote to the OS temp dir, so the documented `upload.tmpPath` and per-group `path` settings had no effect. Uploads now stream to the configured `tmpPath` (or a per-group `path` when the group sets one), falling back to the OS temp dir only when neither is configured; a configured directory that does not exist yet is created automatically.'
time: 2026-06-16T17:58:28+01:00
