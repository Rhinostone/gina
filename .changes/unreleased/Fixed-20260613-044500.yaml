kind: Fixed
body: 'Fixed six more controller methods crashing the bundle when called on a response that a terminal exit had already released. downloadFromLocal, store(target).onComplete(cb), renderStream, push, pauseRequest and resumeRequest each synchronously dereference the per-request request/response, so a controller that hits a terminal exit (for example a redirect that then lets the middleware chain continue) and later calls one of them dereferenced the released refs and threw synchronously, escalating to an uncaughtException and a SIGTERM bundle shutdown. Each now no-ops (or notifies through its existing callback/event channel) on a released response, matching the guards already on redirect, throwError, renderJSON and the other controller helpers; live requests are byte-for-byte unaffected. (#B38)'
