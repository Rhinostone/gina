kind: Added
body: 'A popin trigger now carries the same loading state as submit controls and links. The control that opened a popin gets `data-gina-loading="true"` while the popin loads and `"false"` once it settles, so one stylesheet covers every busy control on a page whichever plugin started the work. This is in addition to the popin container''s own `data-gina-popin-loading`, which is unchanged: the two live on different elements and answer different questions — the container attribute says the popin is filling, the trigger attribute says that control is busy. The trigger is released on response completion whatever the status, on close, and on the routing teardown that tears a popin down without closing it. One gap remains and is deliberate: a popin opened from a hover or focus preload that is still in flight does not yet arm its trigger, so that click shows no busy affordance until the content lands. It cannot leave anything stuck — nothing is armed, so nothing is left behind — and it is tracked separately.'
