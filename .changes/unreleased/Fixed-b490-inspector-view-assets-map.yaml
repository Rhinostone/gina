kind: Fixed
body: 'The Inspector View tab shows the http/2 preload assets map again. Since 0.6.25 it rendered the literal `${assets}`: the layout-level substitution that used to swap the placeholder for the real `getAssets()` map stopped matching once inline-script brace escaping landed (#B463), and 0.6.27 then moved the Inspector payload after template execution (#B464), so the placeholder object rode `user.view.assets` — and the XHR hidden view input — verbatim for three releases. The payload now reads the per-template parsed assets map at splice time on both cache paths, the placeholder and the dead substitution are retired (#B481), and under http/1.1 — where the http/2 preload block never runs — `view.assets` is simply absent instead of a placeholder. Server-side only; pickup is a bundle restart. (#B490, #B481)'
time: 2026-09-06T03:29:46+01:00
