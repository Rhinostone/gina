kind: Security
body: 'Connector query instrumentation no longer discloses bound parameter values by default (gina-io/gina#61): the couchbase dev/instrumentation-window console line (`Found query params`), the per-connector dev console `params` lines, the mongodb resolved-body log line, the couchbase `bulkInsert` statement (which inlines full document values), and the Inspector query-log `params`/`statement` payload fields across couchbase, postgresql, mysql, sqlite, duckdb, scylladb and mongodb now carry count + type markers (e.g. `3 [string, number, string]`) instead of values. A positional bind array has no key names, so the key-based `inspector.redact` matching structurally cannot cover it, and a bind value is routinely a secret owned by the calling application (a session or credential token, an API key, a password hash). Real values ride only when `settings.inspector.queries.captureValues` is `true` (default `false`, fail-closed at boot) - the same opt-in contract as `inspector.ai.captureText` and `inspector.events.captureArgs`. Arity and type diagnostics survive in the redacted forms.'
time: 2026-08-13T13:20:40+01:00
