kind: Added
body: 'Declare WebSocket-over-HTTP/2 routes in routing.json: a route with method "ws" and param.wsHandler "<name>" auto-registers the connection handler at bundle/channels/<name>.js at bundle start, with no programmatic app.onWebSocket() call needed. Matches an exact path or a :param pattern (e.g. url "/live/:room" matches /live/foo and exposes the captured value to the handler as request.params.room; exact paths always take precedence). Optional per-route session options (maxPayload, protocol, closeTimeout) are declared via param.wsOptions and applied when the connection is accepted. The handler receives (session, request) and can use the framework lib registry and the ORM (getModel) directly. Requires the isaac engine with http2Options.enableConnectProtocol set to true.'
