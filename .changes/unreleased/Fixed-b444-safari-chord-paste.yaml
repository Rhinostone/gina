kind: Fixed
body: '#B444 - on Safari, modifier chords work again in validated fields carrying a suppressed autocomplete: paste (Cmd+V), select-all, copy, cut and undo were ALL dead on any live-checked field with autocomplete set to off or false, and the failure was silent in every direction - nothing was inserted, no paste or beforeinput event was dispatched anywhere on the page, and typing kept working, so the page author had no signal pointing at the framework. The cause was one layer above the Safari typing interception: the form-level keydown proxy cancelled the NATIVE keydown unconditionally before re-dispatching its namespaced synthetic event, and preventDefault on a native keydown suppresses the browser editing command itself - so the interception handler deliberately letting chords through changed nothing. The proxy now dispatches first and cancels the native keydown only when the handler prevented the synthetic event, which the interception already does on the paths it re-implements and already does not on chords - typing interception, caret integrity and autofill suppression are unchanged, verified on a real WebKit engine alongside the restored chords. `triggerEvent` now returns the event it dispatched so a proxy can read that decision; existing callers ignore the return value. Chromium-family browsers were never affected (the interception is gated to real-Safari user agents). The browser bundle carries both changed files, so pickup is a bundle restart AND a re-bake.'
