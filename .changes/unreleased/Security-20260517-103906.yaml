kind: Security
body: 'Added gina.plugins.Coep({ value }) — opt-in middleware that emits the Cross-Origin-Embedder-Policy (COEP) response header on every response (#HDR6). Settings: coep.value is one of three W3C HTML spec tokens (require-corp, credentialless, unsafe-none); default require-corp matches helmet per-middleware default. Required (paired with Coop: same-origin / #HDR13) to enable SharedArrayBuffer and high-resolution performance.now() in the page. Caller options always win over settings; values are normalised to lowercase per the spec lowercase-enumeration convention. Mirrors the #HDR3 ReferrerPolicy single-enum plugin shape exactly (resolveSettingsDefaults + mergeOptions + resolveValue throw-on-invalid + idempotent first-writer-wins middleware via res.getHeader). The require-corp default BREAKS pages that load cross-origin resources (CDN fonts, images, scripts) without matching CORP/CORS headers — README walks users through the three escape hatches (set CORP via #HDR14, downgrade to credentialless, downgrade to unsafe-none). 56 unit tests; full suite 5824/5824. First of the three Phase 2 cross-origin policies — HDR13 Coop + HDR14 Corp + HDR15 SecurityHeaders combined wrapper to follow.'
