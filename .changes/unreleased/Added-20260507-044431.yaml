kind: Added
body: 'Added `gina.t(key, params, culture, options)` global translation helper backed by per-bundle JSON catalogs at `bundle/locales/<culture>.json` (e.g. `en.json`, `en_US.json`, `fr.json`). Catalogs are eager-loaded at bundle start; lookup walks a fallback chain (specific culture → base language → `settings.region.culture` → `GINA_CULTURE` → `''en''`), applies CLDR plural rules via Node''s built-in `Intl.PluralRules` when `params.count` is supplied and the resolved value is a CLDR plural-form object, then runs `{name}`-style parameter interpolation (with `{{name}}` escape for a literal). Controller actions get an auto-binding `self.t(key, params)` helper that reads the request culture from `req.culture` (formalised by slice 3) and the bundle name from `local.options.conf.bundle`. The legacy `__()` placeholder (helpers/text.js) is rewired as a one-arg alias of `t()` — existing callers keep working with no behaviour change when no catalog is loaded. Settings template gains an `i18n.*` block (`cookieName`, `devMissingKey`, `fallbackChain`, `cultures`) for runtime knobs. Bundle scaffold ships a minimal `bundle/locales/en.json` stub. New JSON Schema at `https://gina.io/schema/locales.json` (Draft-07, recursive value-or-pluralForm shape). Slice 1 of 5 from #I18N1; slices 2-5 add the swig/nunjucks `t` filter, `req.culture` formalisation with URL-prefix routing + cookie negotiation, and the `gina i18n:scan/add/export/import` CLI group.'
