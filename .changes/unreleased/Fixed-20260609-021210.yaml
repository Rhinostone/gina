kind: Fixed
body: '`application/json` request bodies are now parsed as JSON verbatim. Previously POST, PUT and PATCH JSON bodies were URL-decoded and form-coerced the same way as `application/x-www-form-urlencoded` data: a string value of "true", "false" or "null" was turned into a boolean or null, and a percent-escape such as %20 inside a string value was decoded, both of which could corrupt JSON payloads. JSON bodies now preserve the client''s exact types and string contents; form-urlencoded handling is unchanged.'
