kind: Fixed
body: 'Clicking a second `data-gina-link` no longer kills the first click''s response. The link plugin built one `XMLHttpRequest` when it initialised and reused it for every click, and re-opening a request that is still running aborts it — an aborted request arrives with status `0`, which the completion path has no branch for, so the first click ended in total silence: no success callback, no error callback, nothing. Each link request now gets its own transport and carries a sequence number, so a superseded response is discarded rather than acted upon and a slow first response can never overwrite a newer one. Two related gaps are deliberately unchanged for now, because both would alter what your handlers receive: a link request that fails at the network level is still silent, and a link request that hangs still has no deadline.'
