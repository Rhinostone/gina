kind: Fixed
body: '`POST /_gina/maintenance` no longer fails open on an invalid `ttlSeconds`. The handler validated `enable` but guarded `ttlSeconds` with a single positive condition, so a present value that was not an integer from 1 to 86400 — a 25-hour window, a float, a numeric string — was silently ignored and the flip applied with no timer at all: the caller asked for a bounded maintenance window and got an unbounded one, with `until: null` in the response as the only tell. Both engines now refuse such a value with 400, naming the bound and the configuration alternative for a window that must outlive a day or a restart, and leave the runtime state untouched; an absent or `null` `ttlSeconds` still means no timer. Refused rather than clamped on purpose: a shorter-than-requested maintenance window reopens a site mid-deploy, so unlike the instrumentation window there is no safe direction to round toward. Behaviour change, disclosed: a caller that was sending an invalid `ttlSeconds` and reading 200 now reads 400 — every such caller was already getting an outcome it had not asked for. Server-side only; pickup is a bundle restart. (#B498)'
