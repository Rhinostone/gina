kind: Fixed
body: 'Making the entity dispatch diagnostics readable (#B395). The five DISPATCH markers in the entity callback machinery were raw console.log calls, and in gina that is the logger raw-stdout branch: it bypasses the container dispatch and the level gate alike, so the lines never reached a bundle log file or gina tail, while a daemon-spawned bundle also has its child stdout filtered, so they never reached container logs either. They were diagnostics that could only be seen by running a bundle in the foreground and reading the terminal - which is how a consumer came to report seeing the neighbouring levelled output while these were absent. They now go through console.debug, so they are off by default and appear when the log hierarchy is raised to debug, which was the original intent. The leading newline each line carried is dropped, because it was a formatting hack for the raw stdout path and would otherwise be embedded in the message field under JSON log format, and the prefix now matches the convention already used elsewhere in the same file. The alternative considered was deleting them as spent scaffolding, and it was rejected on measurement rather than on taste: the case for deleting rested on the sites being hot enough that making them visible would flood a debug log, and the full test suite emits fifteen of these lines in total, with two of the four markers never firing at all. Reasoning from the shape of the enclosing handlers is not the same as measuring how often they run. A comment at the first site now records why the method choice is load-bearing, so a later edit does not quietly restore console.log and re-break the visibility. Server-side only, so pickup is a bundle restart with no re-bake'
