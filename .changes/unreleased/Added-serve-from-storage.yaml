kind: Added
body: 'HTTP Range serving for stored objects. self.serveFromStorage(driverName, key[, opts]) is the read-side companion of store()''s driver routing and owns the whole protocol dance on both engines: stat()-gated 404s, a strong ETag minted from the immutable storage key plus Last-Modified from the publish time, conditional GET (If-None-Match, weak-compared, answers 304 with no driver read), and single-range bytes= evaluation gated on driver.capabilities.ranges — a satisfiable a-b / a- / -n range answers 206 with Content-Range and an exact Content-Length, an unsatisfiable one answers 416 with Content-Range bytes */<size>, and multi-range lists, foreign units and syntactic garbage are ignored into the full 200 as RFC 9110 sanctions, with If-Range honouring the Range only on an exact validator match (fail-safe to the full body). Accept-Ranges is advertised whenever the driver can serve ranges; every response carries X-Content-Type-Options nosniff; the uploader-supplied stored contentType downgrades to application/octet-stream for active-content types (html/xml/svg/javascript) unless the app passes an explicit opts.contentType; caching defaults to private, max-age=31536000, immutable — keys are immutable — with opts.cacheControl winning verbatim; opts.download/opts.filename emit an RFC 6266 attachment disposition with control characters stripped from the stored name. HEAD answers headers-only.'
