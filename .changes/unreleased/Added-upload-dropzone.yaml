kind: Added
body: 'Drag-and-drop for the staged upload client layer (#R8): a file input carrying `data-gina-form-upload-dropzone="<elementId>"` binds the named element as a dropzone — files dropped there route through the exact same staging pipeline as a native picker selection (group tagging, staging POST, previews, hidden metadata fields, reset/delete and upload progress). Opt-in and explicit-id-only (no default id resolution), first-wins per zone, only file drags react (text/link drags fall through untouched), and a multi-file drop on a non-`multiple` input keeps the first file with a console warning. The dropzone element carries `data-gina-upload-dropzone` (owner input id) and `data-gina-upload-dropzone-state` (`idle`/`over`/`dropped`) as pure CSS styling hooks — no hardcoded wording.'
