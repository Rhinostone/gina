body: 'FormValidator: the engine''s two synchronous `query` releases — the same-value cached verdict and the known-invalid wire skip — now fire through a microtask instead of mid-validation (#B338). A synchronous release completed the pass before fields declared after the query field were adjudicated, so a re-click on an unchanged value delivered a verdict missing those fields and CLEARED their rendered errors; the outcome depended on field declaration order. Every completion now takes the same post-pass shape a real network settle already had.'
