kind: Fixed
body: 'A refused or interrupted `put()` no longer leaves a stray temp file behind in a local storage root. `fs.createWriteStream()` opens ASYNCHRONOUSLY, so a put that failed early — refused for exceeding `maxObjectSize`, or because the source errored just as the object spilled from the inline tier out to a file — could run its cleanup while the file was still being created, find nothing there, skip the unlink, and orphan the `.tmp` entry that appeared a moment later. Cleanup now waits for the write stream to close before the failure is reported, so a caller told the put failed can rely on nothing having been left behind. All three local strategies are fixed. Worth a look if you run the `sharded` strategy: it has no temp sweep, so anything already orphaned there stays until you remove it, whereas `cas` reclaims stray temps at the next boot and `stream` on its own age-gated sweep.'
