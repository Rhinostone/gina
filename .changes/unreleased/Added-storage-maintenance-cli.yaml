kind: Added
body: 'Storage maintenance CLI and endpoints (#STO1): gina storage:stats, storage:gc (--dry-run) and storage:verify (--fix) work per bundle with the cache-command grammar. A RUNNING bundle is served by new always-on, admin-gated /_gina/storage/stats|gc|verify endpoints, so the process that owns the store does the work; a STOPPED bundle is resolved offline from its settings.storage and the real driver is built directly; a bundle that answers neither way (e.g. a timeout) is reported as unknown and its store is never opened. storage:gc drives the cas sweep until drained (--dry-run lists what a pass would collect and touches nothing); storage:verify reports files-without-rows (sweep crash residue — fixable with --fix, offline only) and rows-without-files (loss evidence — reported, never auto-fixed), both age-gated past sweepGrace so in-flight work is never flagged. Drivers gain stats() on both strategies and sweepNow()/verify() on cas; the metadata-store seam gains optional stats and listKeys verbs (a store lacking them degrades gracefully). Connector-backed stores are reachable through the running bundle only; sharded drivers have no sweep and are named and skipped.'
