kind: Fixed
body: 'A ScyllaDB entry that names its keyspace with `keyspace` alone, as the ScyllaDB guide configures it, now loads its entities from `models/<keyspace>/entities` and its CQL methods from `models/<keyspace>/cql`. The model layer passed the connector the entry''s `database` only, so such an entry booted with none of its entities, and the connector created an empty `models/undefined/entities` directory. An entry that sets `database`, as `gina connector:add --database` writes it, keeps its directory, also when it sets `keyspace` too. A ScyllaDB session entry that sets only `keyspace` now gets `models/<keyspace>/entities` instead of `models/undefined/entities`; when an ORM entry uses the same keyspace, the session entry''s model also carries its entity classes, bound to the session connection. An empty `models/undefined/entities` directory left by such an entry can be deleted. Restart the bundle. (#B909)'
