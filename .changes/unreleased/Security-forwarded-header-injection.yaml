kind: Security
body: 'Request headers were spliced unescaped into the client bootstrap script gina emits on every rendered page, allowing reflected script injection. `X-Forwarded-Host`, `X-Forwarded-Proto`, `X-Forwarded-Prefix` and the request''s own `Host` reached JavaScript string literals in that script — the values behind `gina.config.hostname`, `gina.config.webroot` and `window.__ginaWebroot` — with no escaping applied, so a header containing a single quote closed the literal and ran attacker-chosen script in the browser of anyone served that page. It needed no authentication and applied to any route that renders a view. This affects every release up to and including 0.6.7, and was reproduced end to end over HTTP. Forwarded values are now validated where they are read, in both the Isaac engine and the engine-agnostic router: a host must be a hostname with an optional port or a bracketed IPv6 literal, a forwarded scheme must be exactly `http` or `https`, and a forwarded path prefix must consist of URL-path characters only. Anything else is rejected and the request falls back to the bundle''s own configured host and webroot, exactly as if the header had never been sent. Validating at ingest rather than escaping at output means every consumer of these values is protected, not only the bootstrap script. Whether a deployment was reachable depended on its proxy: one that sets or strips the `X-Forwarded-*` headers it forwards never passed an injected value through, while a bundle exposed directly, or sitting behind a proxy that relays client headers verbatim, could be driven by any anonymous caller. No action is required beyond upgrading — no configuration changes, no application code changes, and a deployment whose proxy sends a well-formed host, scheme and prefix behaves identically. Two small behaviour corrections ride along: a request whose `Host` or `X-Forwarded-Host` is malformed is no longer classified as proxied at all, and an absent `X-Forwarded-Proto` no longer produces a literal `undefined://` prefix on the whispered origin. Pickup is a bundle restart; the browser bundle is unchanged, so no rebuild is needed.'
