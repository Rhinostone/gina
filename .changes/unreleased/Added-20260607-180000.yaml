kind: Added
body: 'New `data-gina-dialog` dialog API built on the native `<dialog>` element: `data-gina-dialog="ID"` opens an in-page dialog, `data-gina-dialog-src="URL"` loads content over Asynchronous JavaScript and XML (AJAX), `data-gina-dialog-target="#sel"` does a partial (slot-only) replace that preserves the dialog chrome, and `data-gina-dialog-modal` forces modal or non-modal. Adds hover/focus preloading of AJAX content, automatic Accessible Rich Internet Applications (ARIA) wiring (aria-haspopup, aria-controls, and aria-labelledby pointed at a real title element), focus return to the trigger on close, and `[autofocus]` support. The legacy `data-gina-popin-name` and `data-gina-popin-url` trigger attributes keep working (mapped onto the new path) with a one-time deprecation warning; the engine-managed `data-gina-popin-is-link` / `data-gina-popin-loading` attributes are unchanged.'
