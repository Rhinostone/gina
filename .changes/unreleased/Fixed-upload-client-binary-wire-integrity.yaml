kind: Fixed
body: 'The staged upload client layer (`data-gina-form-upload-*`) no longer corrupts binary file uploads: the multipart body was hand-assembled as a JS string and transmitted as a DOMString, which UTF-8-inflated every file byte >= 0x80 on the wire — a real image/PDF/archive was stored inflated and unreadable (measured x1.49 on a cycling-byte fixture; a PNG lost its signature). The body is now assembled as a Blob (raw file bytes, transmitted verbatim) with the multipart framing and the `group=` disposition parameter byte-identical to before — no server or wire-contract change; disposition parameter values additionally percent-encode CR/LF/double-quote per RFC 7578 (an unescaped quote previously produced a malformed part). Files corrupted by this defect are losslessly recoverable: the stored bytes are exactly the UTF-8 encoding of the original (decode utf8, re-encode latin1). NOTE the corruption only surfaced on gina >= 0.5.22 — the pre-0.5.22 server''s since-removed string-decode layers coincidentally reversed the client inflation, so older round-trips were byte-clean. Browser-bundled: consumers pick the fix up with a bundle re-bake, paired with a server >= 0.5.22.'
