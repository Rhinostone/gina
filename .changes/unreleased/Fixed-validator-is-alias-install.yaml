kind: Fixed
body: 'FormValidator: numbered `is` aliases (`is0`, `is1`, ...) now install and enforce. The lazy alias installer sat below a typecheck that skipped exactly the state the installer required, so any `is<N>` rule key was silently ignored on both the client and the server; the installer regex is now anchored (`is0abc` no longer matches), numbered aliases keep distinct per-alias error keys on both sides (server-side they previously collapsed to a shared `is` key, letting a later passing alias erase an earlier failing one), and server-side validation of rules carrying `$` cross-field references no longer crashes. Behavior change to plan for: previously-skipped `is<N>` rules START ENFORCING at pickup — forms that submitted clean may begin erroring or returning 422; sweep your rule JSONs for `is<N>` keys before upgrading.'
time: 2026-07-19T00:15:02+01:00
