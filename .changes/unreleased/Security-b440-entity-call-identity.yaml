kind: Security
body: '#B440 — concurrent calls to a JS-defined, emit-style entity method are now paired to the call each completion came from, on both call forms (`await entity.method()` and `util.promisify(entity.method)`). One call that never signalled completion — it neither emitted its `<shortName>#<method>` trigger nor returned a Promise that settled, typically because something threw inside an asynchronous callback before the `emit` (swallowed as an unhandled rejection) — used to leave its pending slot at the head of that method''s arrival-order queue forever: from then on every caller received the NEXT caller''s record and the last one hung, every later caller hung when calls did not overlap, and each further lost completion made it one caller worse. Where the method reads a user-scoped or ownership-bearing record, a check performed on the returned row could pass for the wrong principal — a confidentiality and authorization concern, not only a correctness one, and the same shape as the 0.6.19 Couchbase fix. The trigger is data-dependent (an unexpected record shape), not load-dependent: invisible in a load test, present in any long-lived process. Every call now runs inside its own async context; a completion is matched to that context whatever the completion order (which also closes the documented out-of-order residual of the 0.6.11 fix), a completion for a call that already settled is dropped rather than handed to the next caller, and a completion that reaches the entity outside every call''s context (a native driver calling back from a loop started at boot) still pairs in arrival order and now logs `DISPATCH:NO_CONTEXT` at debug level. The promisify form also chains on a Promise returned by the method — it used to discard it, so a Promise-returning method was only safe on the entity-context form. New opt-in `settings.json > model.emitTimeout` (ms) bounds a call that never completes: it rejects with an Error naming the trigger and a warn line is logged; absent or 0 keeps the previous behaviour, where that call — and now only that call — stays pending. Server-side only — pickup is a bundle restart, no re-bake.'
