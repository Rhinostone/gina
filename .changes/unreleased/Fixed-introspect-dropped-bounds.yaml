kind: Fixed
body: 'Fixed `bundle:openapi` and `bundle:mcp` silently dropping three declared bound forms when un-collapsing a `validator::{}` routing requirement into a parameter schema: the scalar `"isString": N` now maps to `minLength` (the engine treats it as a minimum, identical to `[N]`), and `isInteger`/`isNumber` digit bounds now reach the generated schema as an honest annotation — a human-readable `description` (e.g. `2-4 digits (string-form length; a negative sign counts)`) plus a machine-readable `x-gina-digitBounds` extension. Digit bounds constrain the length of the value''s string form, not its range, so they are deliberately NOT emitted as `minimum`/`maximum` (wrong for any negative value, whose sign counts toward the length) nor as `minLength`/`maxLength` (string-only keywords, inert on numeric types). Schemas generated from bare `true` rules are byte-identical to before.'
