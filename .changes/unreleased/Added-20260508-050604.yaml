kind: Added
body: 'Added `gina i18n:import <culture>` CLI command (#I18N1 slice 5 part 2). Imports a translator-edited PO / CSV / JSON file back into a culture''s catalog at `<bundle>/locales/<culture>.json` — the complement of `gina i18n:export`. Together they close the translator round-trip and complete the #I18N1 contract (slices 1–5 all shipped on the 0.3.11-alpha track). Three positional shapes mirror `i18n:export`: `gina i18n:import <culture> @<project> --file=<path>` (project-wide; multi-bundle inputs route per bundle), `gina i18n:import <culture> <bundle> @<project> --file=<path>` (single bundle), with required `--file=<path>` flag and optional `--format=<json|po|csv>`, `--merge=<union|replace>`, `--dry-run`, `--force`. Format is auto-detected from the `--file` extension when `--format` is omitted. Two merge strategies via `--merge`: `union` (default) deep-merges — imported keys win for shared paths; existing keys absent from the import are preserved (a partial PO/CSV touches only the keys it lists, including per-CLDR-key behaviour for plural-form objects). `replace` overwrites the catalog entirely; existing keys absent from the import are dropped — surfaced via a "N key(s) dropped" log so translators see what they wiped. PO parser is a state-machine line-walker: handles header entry (empty `msgid ""` discarded), `msgctxt` for bundle disambiguation, multiline strings via PO continuation (`msgid ""` + `"line1"` + `"line2"`), backslash escapes (`\n`, `\t`, `\r`, `\"`, `\\`), and the slice 5 part 1 `#. cldr-keys: <list>` extracted comment that records which CLDR plural keys the export emitted — the importer maps `msgstr[N]` back to those exact CLDR keys, so plural-form catalogs round-trip across cultures with differing plural categories (English `{one,other}`, Russian `{one,few,many,other}`, Arabic all six). Falls back to canonical CLDR order when the marker is absent (best-effort for PO files authored outside this tooling). CSV parser is an RFC 4180 state-machine: handles quoted cells with embedded commas / doubled quotes / embedded newlines / CRLF line endings; auto-detects single-bundle (`key,value`) vs multi-bundle (`bundle,key,value`) shape from the header row. Plural-form CSV rows reach the catalog via dotted-suffix nesting (`items.one` + `items.other` → `items: { one, other }`). JSON inputs accept both shapes: a flat catalog (matches the on-disk shape verbatim) or a multi-bundle wrapper (`{ "<bundle>": { ...catalog }, ... }`); the CLI''s `<bundle>` positional resolves the routing. Single-bundle scope errors hard when the target catalog does not exist (recommends running `gina i18n:add` first); pass `--force` to bypass and create. Project-wide scope warns when the input contains a bundle not registered in `manifest.json` and skips it; reports per-bundle ok/skipped counts at the end. Write-back uses the `connector:add` comment-preserving three-function pattern (`readExistingFile` / `mergeUnion` / `writeFile`) per architecture doc § 9: leading comment headers (everything before the first `{`) are preserved verbatim, the JSON body is rewritten with 4-space indent + trailing newline through `lib.generator.createFileFromDataSync`. `--dry-run` prints the would-write line per bundle and skips the disk write; the dropped-key count for `--merge=replace` shows in the dry-run preview too. Tests at `test/lib/i18n-import.test.js` — 84 source-inspection + pure-logic + sandbox-write assertions covering module shape, argv parsing + dispatch, format auto-detect, PO parser (escape sequences, msgctxt-as-bundle, plural reconstruction with `#. cldr-keys` round-trip, fallback to canonical CLDR order, 3-form Russian-style plurals, multiline continuation, header-entry skip), CSV parser (single + multi-bundle headers, embedded commas / doubled quotes / embedded newlines / CRLF, header-shape mismatch returns empty), `buildCatalogFromEntries` (flat / nested / dotted-suffix plural reassembly / atomic plural-form preservation), `looksLikeWrapper` heuristic (clear positives + clear negatives + the documented CLI-resolved deep-flat false positive), `mergeUnion` (imported wins, existing preserved, per-CLDR-key plural merging, type-divergent overrides, empty edge cases), comment-preserving writer + help.txt + arguments.json + dispatcher source pins, and a sandbox import smoke that round-trips union / replace / comment-header preservation / CSV → catalog through minimal readers. Full local suite green: 4506 / 4506 (4347 baseline + 75 export + 84 import). Closes the #I18N1 translator round-trip contract; #I18N2 (ICU MessageFormat opt-in via `t.icu(key, params, culture)` powered by `intl-messageformat`) follows.'
