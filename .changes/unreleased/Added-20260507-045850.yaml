kind: Added
body: 'Added swig and nunjucks `t` template filter (#I18N1 slice 2). Translate strings directly in templates via `{{ "common.welcome" | t }}`, `{{ "common.greeting" | t({ name: user.name }) }}`, or `{{ "common.items" | t({ count: 5 }) }}` (CLDR plural). Both engines share the same surface so templates port between swig and nunjucks unchanged. The filter is auto-registered on every request (no setup.js wiring needed) and consumes the `lib/i18n` primitives — no plural / interpolation / fallback logic is duplicated locally. Auto-binds the request culture via `req.culture` (the slice 3 hook) with a fallback to `process.env.GINA_CULTURE` (the bundle''s process default). Bundle name is taken from the per-request `options.conf.bundle` slot. Templates work today against the process-default culture; slice 3 upgrades to per-request URL-prefix / cookie / Accept-Language negotiation. Tests at `test/lib/i18n-filters.test.js` lock in the requires, the (key, params) signatures, the culture and bundleName resolution chains, the i18n.t pass-through shape, the singleton context access pattern, surface parity between swig and nunjucks, and negative invariants (no Intl.PluralRules / interpolation regex / _i18nCatalogs duplication inside the filter bodies). Full local suite green: 4197 tests, zero regressions.'
