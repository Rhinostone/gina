kind: Fixed
body: 'A click on a popin trigger no longer loads the popin twice on a page that holds more than one popin instance. Each `new Popin()` registers a document click proxy that claims the triggers of its own instance by matching their id against its instance id, and that match had no delimiter after the instance id. Instance ids are `gina-popins-` followed by a shared counter (`gina-popins-gp-1`, `gina-popins-gp-14`), so the proxy of `gina-popins-gp-1` also claimed the triggers of `gina-popins-gp-14`, and one click fired both proxies: the popin loaded twice, and the second load replaced the form the first had bound, which then submitted natively. The match now requires the `-` that follows the instance id in every trigger id. Browser-bundled: rebuild your bundles (`gina bundle:build`) to pick it up. (#B876)'
