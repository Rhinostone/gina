kind: Added
body: 'A third storage strategy, `stream`, for large sequential media — and with it resumable uploads. Set `"strategy": "stream"` on a driver and keys name an ASSET rather than a file (`assets/<ulid>/original<ext>`), so an object and anything later derived from it live in one directory you can move or delete as a unit; keys stay opaque as under every strategy. Alongside the usual `put()`, a stream driver carries five more verbs, gated by `capabilities.resumable`: `createUpload()` opens a session, `writeSegment()` writes one segment AT A BYTE OFFSET — segments may arrive out of order and in parallel, and re-sending a range that already landed is harmless — `statUpload()` reports what arrived and, crucially, what is still MISSING, `finalize()` publishes, and `abortUpload()` throws the session away. A session survives a bundle restart: its state lives in the driver root, not in memory. `createUpload()` REQUIRES the object''s total size, and that is a deliberate limit rather than an oversight — without a declared total nothing can verify that the received ranges actually cover the object, and `statUpload()` could only report what arrived, never what is missing; upload of unknown-size content stays `put()`''s job. Finalise verifies coverage as an interval UNION and refuses to publish a gap, keeping the session alive so a client can complete it. That check is the feature''s whole safety story: an unwritten range in the assembling file reads back as ZEROS rather than failing, so a finalise that merely added up what it received — two segments overlapping in the middle can sum to the full size while leaving the tail untouched — would publish a plausible object with silently wrong bytes. Finalise is also idempotent: if it published the bytes and then failed to index them, calling it again completes the job instead of wedging. Segments are fsynced before they are recorded as durable (`fsync` defaults to true here, as it does for `cas`), so a client is never told a range is safe when it is not; on a fast LAN, where that flush costs more than the transfer, set `fsync: false` and accept the documented power-loss window. Three new per-driver keys, all optional: `chunkSize` (default `"8MB"`, the segment size the write path is tuned for and the one `createUpload()` reports back), `sessionTtl` (default `"24h"`) and `sessionSweepInterval` (default `"1h"`) — abandoned sessions are reclaimed on their own age-gated sweep, which runs at boot and periodically, and also clears temp files left behind by a crashed `put()`. A stream driver does not tier and does not hash, so `inlineThreshold` and `hash` are reported as ignored keys there rather than silently doing nothing. `getRange()` works as it does everywhere else, and — as with the other strategies — the engines still answer no HTTP `206`, so that stays a controller''s job for now. Not included, deliberately: renditions beside `original` (the layout reserves the room, there is no API yet), post-hoc checksums, and any `storage:gc` / `storage:verify` support for stream, which remain `cas`-only. Parallel writes from several processes are safe when their ranges do not overlap on a POSIX-coherent filesystem; on a relaxed-coherence network mount, route one session''s segments to one process. Configuring `stream` no longer refuses the boot as a not-yet-implemented strategy.'
