kind: Fixed
body: 'An array-form validation rule whose FIRST argument carries a `$` token that resolves to no field no longer crashes the whole validation pass — on the client AND the server, since the deref site is not DOM-dependent (#B239, the residual the #B234 fix disclosed). Such a token now stays LITERAL, so the rule''s own strict comparison applies: `isInList: [''$100'', ''$200'']` accepts the literal `$100` and rejects a non-member with the rule''s own error message, where both directions previously threw a raw `TypeError: Cannot read properties of undefined`; a bare `$` element and a mixed element (a field token beside a non-field residue) are covered by the same guard. A token whose name collides with an engine METHOD (`isValid`, `constructor`) previously did NOT crash — it spliced the string "undefined" into the rule and silently mis-rejected the literal value; it now stays literal too (the guard requires a real field: an existing key carrying a defined value). Behaviour change disclosed in both directions: shapes that previously CRASHED (or silently mis-rejected) now produce verdicts, and no rule set that already validated changes verdict — cross-field `$` references in `is` conditions, `$`-free rules, and a `$` in a LATER array element are byte-identical across the fix. A REAL cross-field reference inside an array rule element remains non-functional (always-invalid, fail-closed — it is substituted upstream with quoting fit for `is`-condition splices, not array elements) and is tracked separately as #B240.'
