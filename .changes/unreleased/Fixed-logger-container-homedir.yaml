kind: Fixed
body: 'Fixed the MQ speaker and file logger containers ignoring `GINA_HOMEDIR` — both resolved the framework settings file from the invoking user''s home unconditionally, so a process pinned to an isolated home still read the real home''s MQ port and host and silently mixed the two. Both now read the framework environment first, then `process.env`, before falling back to the previous default'
