kind: Fixed
body: 'Fixed the `Content-Disposition` emission for downloads: both server emitters (`downloadFromURL`''s attachment upgrade and `downloadFromLocal`) now emit the filename as an RFC 6266 quoted-string with `"` and `\` escaped, so filenames containing spaces, `;` or `,` produce a conformant header instead of a bare token an intermediary may truncate or split.'
time: 2026-08-07T02:59:34+01:00
