kind: Fixed
body: '`merge()` no longer duplicates a number the target already holds at a different index (`merge([9, 1], [1])` gave `[9, 1, 1]`; `{ ports: [8080, 8124] }` merged with `{ ports: [8124] }` gave `[8080, 8124, 8124]`), and a nested array is merged once per level instead of twice, so `[1, 2]` + `[3, 4]` one level down is `[1, 2, 3, 4]` rather than `[1, 2, 3, 4, 3, 4]` and merging the same source a second time is a no-op. The rule that lets a source repeat a number (`[25]` + `[25, 25]` still gives `[25, 25]`) now compares counts instead of positions. An array shared by both sides below the top level is also left untouched, closing a residual of the 0.6.19 source-mutation fix (#B436).'
