kind: Fixed
body: '`gina project:add` now writes the project''s `.gitignore`, which it never did (#B258, #B291). The framework has always shipped a `core/template/_gitignore` whose `_` prefix implies a rename to the dotted form at scaffold time — but nothing performed that rename, so the template had zero consumers and every scaffolded project came out with no `.gitignore` at all. The practical consequence was that the secret-file globs the template carries (`.env`, `.env.*`, `*.env`, with `!.env.example` negations so a sample can still be committed) protected nothing: a new project would happily track a `secrets.env` or `.env.production` on its first commit. The glob shape is the point — a bare `.env` matches neither of those names. The copy is SKIP-IF-EXISTS: your `.gitignore` is your file, routinely carrying rules the framework knows nothing about, so the scaffold fills a gap and never replaces or appends to one. That also makes it idempotent, so re-running `project:add` over an existing project changes nothing. It applies to the import path as well as to new projects, since an imported project without a `.gitignore` has exactly the same exposure. A failure to read the template warns rather than aborting — a scaffold that produced an otherwise complete project should not die over an ignore file. No action required: existing projects are untouched, and if you already have a `.gitignore` you will not notice this at all.'
