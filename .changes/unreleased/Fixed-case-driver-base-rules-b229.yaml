kind: Fixed
body: 'Fixed a form field that drives its own conditional rule never having its own base rules checked in the browser (#B229). When a rule file declares both a rule for a field and a `_case_<field>` block keyed on that same field, the client validator skipped that field entirely in every whole-form pass — bind, live check and submit alike — so a required radio group that selects its own case was never adjudicated: the form did not gate, the submit trigger stayed enabled with nothing picked, and an empty submit went to the server with no client-side validation at all. The field''s base rules are now checked before the conditional block is skipped, and its collected value is preserved across that check so the case it drives still resolves from what the user actually picked. Which conditions apply is unchanged, and the fix is order-independent: a driver declared before another `_case_` block was already being checked, so every driver carrying base rules is now covered. Enforcement tightening: a form built on this shape starts gating where it silently submitted before — required fields on it must now be filled to send. Server-side form-body validation is unaffected (conditional rules were already unsupported there).'
