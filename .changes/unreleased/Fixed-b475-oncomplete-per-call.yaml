kind: Fixed
body: 'The fluent `{onComplete}` handles of `self.query()` and `self.store()` now deliver to their own call (#B475). Both registered the application callback on the controller instance''s shared EventEmitter: `store(target).onComplete(cb)` used `self.on(''uploaded'', cb)` and never removed it, so a second `store()` on the same controller — sequential or overlapping — re-invoked every earlier callback with the later result, and `query(options, data).onComplete(cb)` cleared every `query#complete` listener before registering its own, so a concurrent fluent query on the same controller evicted the first one: its callback never fired, the survivor could receive the other call''s payload, and the evicted response was emitted to nobody — on both transports, with no log line. The synchronous failure paths of `query()` (missing host, open circuit, unreadable CA, the outer catch) also returned `emit()`''s boolean instead of the handle, so chaining `.onComplete` threw `TypeError` and the error was lost. `query()` now mints one delivery channel per call whenever no callback (or `null`) is given and returns the handle on every path: registrations chain (`onComplete()` returns the handle), every registration fires, a registration made after the call settled fires on the next tick, a synchronous failure reaches `cb(err)` on the next tick, delivery rides the callback path so every guard and every retry carries the channel, and fluent queries gain the circuit breaker''s outcome recording. The delivered shapes are unchanged: `cb(false, data)` on success, `cb(data)` for a known non-2xx status, and the `{status, error}` wrap for a transport or pre-transport failure. `store()`''s handle now calls `start(target, files, cb)` directly, with the same arguments and the same synchronous timing as before. Server-side only; pickup is a bundle restart.'
