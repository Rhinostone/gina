kind: Added
body: 'Storage read-verb errors now carry a machine-readable err.code — STORAGE_NO_OBJECT (unknown, released or vanished key), STORAGE_RANGE_UNSATISFIABLE (a range start at or beyond the object size, the caller''s 416) and STORAGE_INVALID_RANGE (malformed bounds) — on get()/getRange()/resolve() across all three local strategies — and the `s3` adapter, shipping in this same release, maps its provider errors onto the same codes — so an HTTP serving layer can map 404/416/400 without parsing message text. Message wording is byte-unchanged.'
time: 2026-08-14T20:47:00+01:00
