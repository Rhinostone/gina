kind: Fixed
body: 'A form declaring `data-gina-form-live-check-enabled="false"` with resolvable rules was only partly opted out: two validation gates evaluated the rules-count boolean inside the regex test, so the truthy string `"false"` short-circuited to that boolean and matched — leaving bind-time silent validation and select-change validation running. Text as-you-type was never affected (the listener-registration gates already tested the attribute alone), so the pre-fix behaviour was an inconsistent middle rather than the attribute being ignored outright. The two gates now test the attribute alone and check the rules count separately, so an explicit `"false"` is honored consistently — which is what the framework''s own warnings have been advising all along. Also declares a previously implicit global in the submit-trigger state updater.'
time: 2026-07-30T01:04:00+01:00
