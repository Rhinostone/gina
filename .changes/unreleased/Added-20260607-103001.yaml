kind: Added
body: 'Opt-in compiled-template reuse for async template loaders, via settings.template.swig.loader.cache and settings.template.nunjucks.loader.cache (boolean, default off, automatically disabled in development). When enabled, the per-bundle engine/environment and its compiled templates are shared across requests instead of being rebuilt per render. Off by default so template edits are always picked up live without a restart.'
