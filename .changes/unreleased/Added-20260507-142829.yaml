kind: Added
body: 'Added `gina i18n:scan` CLI command (#I18N1 slice 4 part 1). Walks every bundle in a project and reports translation coverage per culture against the keys used in source — `t("key")` / `self.t("key")` / `__("key")` / `{{ "key" | t }}` patterns are detected across `controllers/`, `middleware/`, `models/`, `lib/`, `src/`, `views/`, `public/`, plus top-level `.js` (excluding `node_modules`, `dist`, `.git`, `locales/`, and dotfiles). For each culture the command prints translated / missing-key counts and a percent score, then lists the missing keys themselves (capped at 50 in text output; no cap in JSON output). Three positional shapes: `gina i18n:scan` (every registered project), `gina i18n:scan @<project>` (every bundle in one project), `gina i18n:scan <bundle> @<project>` (one bundle). `--format=json` emits a CI-friendly machine-readable shape. Adds `''i18n:''` to `bin/cli`''s `allowedOffline` whitelist so the command runs without a framework socket (consistent with `connector:`, `bundle:`, `env:`, and the rest). Coverage walks `lib.i18n.resolveKey` so dotted-path keys (`common.welcome`) resolve through nested catalogs correctly. Tests at `test/lib/i18n-scan.test.js` — 57 source-inspection assertions covering module shape + CmdHelper wiring, argv parsing + dispatch, file walker constants, key-extraction regex behaviour (positive + negative), pure-logic coverage replica, JSON / text output structure, help.txt + arguments.json, and bin/cli wiring. The companion `gina i18n:add` command (slice 4 part 2) and `gina i18n:export` / `gina i18n:import` (slice 5) follow.'
