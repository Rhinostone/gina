kind: Added
body: 'Upload progress for the staged upload client layer (#R8, slice 1): the staging POST of a `data-gina-form-upload-*` file input now reports real client-to-server wire progress via `xhr.upload.onprogress`. A new registered form event `uploadProgress.<uploadFormId>` carries `{ status, progress, loaded, total, lengthComputable, files }` (per-request aggregate: one staging request carries every file of a selection). Opt-in consumer surfaces: `data-gina-form-upload-on-progress="<windowCallback>"` (bare identifier, the `-on-success` convention) and a declarative indicator resolved from `data-gina-form-upload-progress="<elementId>"` or the default `<fieldId>-progress` (the `-preview`/`-error` family convention) — a native `<progress>` element tracks uploaded/total bytes with native indeterminate handling, any other element gets a percent text plus `data-gina-upload-progress` / `data-gina-upload-progress-state` styling hooks; the full lifecycle is managed (preparing at selection, uploading, complete, error empties the bar, reset/delete strips the indicator) and no wording is hardcoded. The response-side download progress channel is untouched. Browser-bundled: consumers pick this up with a bundle re-bake.'
time: 2026-07-22T12:52:00+01:00
