kind: Fixed
body: 'Fixed reverse-proxy host context freezing at the first proxied request. The `PROXY_HOST` / `PROXY_HOSTNAME` worker-globals (derived from a port-less `Host` header or `X-Forwarded-Host`) were captured once behind a one-shot `isProxyHost` gate, so they froze at the first proxied request''s value and every later request — plus internal `Controller::query()` forwards that read them — inherited a stale host. The proxy host/scheme is now request-scoped: each request''s proxied classification and host are stashed per-request (mirroring the existing `X-Forwarded-Prefix` handling), the worker-global is refreshed on every proxied request so it can never freeze (and, being written only from proxied requests, can never freeze to a raw `host:port`), and the internal-call `X-Forwarded-Host` forward carries the triggering request''s proxied host. A raw `host:port` request (no reverse proxy) is never classified as proxied, so its URL builders keep resolving the configured host; single-hop and multi-hop (`X-Forwarded-Host` wins) reverse-proxy topologies are both handled. Server-side only.'
