kind: Added
body: 'Added MongoDB connector — ORM access via JSON pipeline files at models/<db>/pipelines/<Entity>/*.json plus a session store backed by a TTL index. Drop-in mongodb-driver-based connector with {op, filter, doc, ...} JSON bodies, JSDoc-style @param/@return annotations, {$arg: N} positional placeholders for caller args, {$oid: <hex>} ObjectId literals, $scope substitution at load time, and castParam for BSON types (objectid, int/int32, long/int64, double/number, boolean, string/text, date/timestamp). Supported ops: findOne / find / aggregate / countDocuments / insertOne / insertMany / updateOne / updateMany / replaceOne / deleteOne / deleteMany. Session store auto-creates the TTL index on first set() with a one-shot guard; get/length/all filter on expiresAt to exclude documents that expired but were not yet reaped by the 60s MongoDB TTL monitor. Driver is loaded from your project node_modules (npm install mongodb).'
time: 2026-05-09T16:07:06.919729+01:00
