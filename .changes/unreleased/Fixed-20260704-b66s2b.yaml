kind: Fixed
body: 'Fixed a reverse-proxy host-context leak on workers that serve a mix of proxied and direct traffic (or several public hostnames): the server-side URL, redirect, and config resolvers (`self.getConfig()`, `self.redirect()`, server-rendered asset host resolution, and the per-request routing clone) now resolve the host of the request in hand rather than the host of the last proxied request the worker happened to serve. A direct or internal request — and concurrent requests to different public hosts on the same worker — no longer inherit a stale proxied host. Requests without a per-request proxy classification (the Express engine, released responses, and WebSocket-query callers) fall back to the previous worker-global behaviour, so nothing changes for single-public-host-per-worker deployments.'
