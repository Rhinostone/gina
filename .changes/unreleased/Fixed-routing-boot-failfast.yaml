kind: Fixed
body: 'A bundle whose config/routing.json is missing or unreadable at boot now refuses to start with an error naming the bundle and environment (previously it booted silently with only the framework-synthetic routes, so every app route 404''d and cross-bundle route lookups threw hours later with no boot-time signal); an external supervisor restart (an orchestrator liveness/restart or a container restart policy) then retries until the release tree settles, which self-heals mid-deploy races — the gina daemon itself does not retry a startup crash (it reports it once and stops; restart manually) — a deployment that relied on the silent half-boot must fix its release artifact. The route-lookup not-found error now also names the bundle and its rule count, so a degraded or near-empty routing table is tellable from a plain mistyped rule at the call site'
time: 2026-07-20T00:22:00+01:00
