kind: Fixed
body: 'The `settings.json` schema now describes the `session` block, so the session plugin''s configuration gets the same editor support as the rest of the file. The three consumed keys — `session.cookie.sameSite`, `session.cookie.httpOnly` and `session.cookie.secure` — were undeclared, so an editor offered no completion, no type checking and no hover description for a documented configuration surface. The declaration mirrors the plugin''s own factory-time validation (`sameSite` one of lax/strict/none, `httpOnly` boolean, `secure` true, false or "auto") and rejects unread keys — putting `maxAge` or a store `ttl` under `settings.json > session` has never had any effect, and an editor now says so. Runtime behaviour is unchanged; the schemas are editor tooling, never enforced at boot.'
time: 2026-07-27T08:17:21+01:00
