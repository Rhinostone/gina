kind: Added
body: 'The staged upload progress indicator (`data-gina-form-upload-progress`) gains a `processing` lifecycle state, stamped on `data-gina-upload-progress-state` the moment the browser finishes sending the bytes (`xhr.upload.onloadend`) — the window during which the server post-processes the upload (rendering a preview, transcoding, scanning) before it responds. On a fast link the bytes finish in milliseconds while the server window can run for seconds, during which the bar would otherwise sit frozen at a full `uploading` state; the new state advances the state attribute ONLY, leaving the bar full (value/max/the percent attribute untouched) so a styled bar can show a distinct processing affordance via CSS instead of appearing stuck, and a native indeterminate bar keeps its animation running. Purely additive and i18n-neutral (no wording is hardcoded): a consumer that does not style the new state sees the bar stay full, exactly as before. Browser-bundled — re-bake bundles to pick it up.'
