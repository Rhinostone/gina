kind: Security
body: 'Server-side data serialised into the Inspector''s inline `<script>` blocks can no longer be read as template source by the swig renderer. The `__ginaData` and `__ginaLogs` scripts are spliced into the layout before it is compiled (their per-request nonce is a swig conditional), which left every swig delimiter live inside the serialised page data: a stored value such as `A{{ 7*7 }}B` rendered as `A49B`, and a `{% %}` tag inside a value executed with the page''s locals in scope. The shared inline-script helper now also escapes `{` and `}` inside JSON string literals (`\u007b` / `\u007d` are valid JSON escapes, so every value still parses back identical); structural braces are untouched. Same reachability as the 0.6.23 hardening: only pages that emit the Inspector block (development by default, production only when `displayInspector` is enabled). The nunjucks renderer injects after rendering and was not affected. Server-side only: pick it up with a bundle restart, no rebuild needed. Internal reference #B463.'
time: 2026-09-03T14:13:03+01:00
