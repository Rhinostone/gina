kind: Fixed
body: '`lib.archiver` now settles each `compress()` and `decompress()` call on its own completion channel. Every completion used to be signalled by emitting one fixed event name on the process-wide singleton, so two overlapping calls in one process — two queue consumers, or a request handler beside a worker — both received whichever run finished first: the second caller was released early with the first run''s archive path, and its own archive was left at 0 bytes; the array form also kept its output stream in an implicit global, so finishing one run closed another''s stream. Each call now settles exactly once for its own `onComplete` listeners and trailing callback, a listener attached after the run has already settled is still delivered, and the documented `archiver-<method>#complete` event is still emitted on the singleton for observers. Errors on the streams the lib opens itself are now delivered to the caller too: an unreadable input used to either crash the process on an unhandled stream error or hang the run forever — leaving a corrupt partial archive on disk — depending on timing, and an unwritable target crashed both the array and directory forms; all of them now reach `onComplete` as the stream''s error. The synchronous error paths (a missing source, a source that is neither a file nor a directory) reach `onComplete` instead of firing before the handle is returned, and both promisify shapes work — a trailing callback with options lacking `method`, and `compress(src, target, cb)` with options omitted. No configuration change; server-side only, pickup is a bundle restart.'
