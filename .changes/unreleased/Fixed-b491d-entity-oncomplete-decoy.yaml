kind: Fixed
body: 'The empty `onComplete` that was attached to every entity METHOD object has been removed. It was a leftover of the pre-Promise design, when a method returned the entity function itself with the handle hanging off it; since methods began returning a native Promise the supported form has been `entity.method(args).onComplete(cb)`, whose handle lives on the returned promise. Its own comment claimed it would be overridden by that code, which never happened — nothing wrote to it, so a callback registered on the method rather than on the call was swallowed and never fired. Disclosed behaviour change: `entity.method.onComplete(cb)` — the wrong form, and silently dead in every release that had it — now throws `is not a function` at the call site instead of going quiet. The correct `entity.method(args).onComplete(cb)` is untouched. (#B491)'
