kind: Fixed
body: 'Fixed five synchronous controller helpers (isPopinContext, setRequestMethod, setRequestMethodParams, getRequestMethodParams, getFormsRules) crashing the bundle when called after the response was already released. A controller action that keeps running after self.redirect() (which releases the per-request response and lets the middleware chain continue) and then calls one of these helpers dereferenced the released request and threw, escalating to an uncaughtException and a SIGTERM bundle shutdown. Each now returns a safe default (false / null / {}) on a released request, matching the released-response guards already on the query and throwError paths. (#B35)'
time: 2026-06-13T03:50:40.634556+01:00
