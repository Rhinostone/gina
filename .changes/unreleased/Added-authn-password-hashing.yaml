kind: Added
body: '`lib.authn` adds the password primitives that are dangerous to hand-roll. `hashPassword` mints a scrypt hash encoded as a self-describing PHC string (`$scrypt$ln=17,r=8,p=1$<salt>$<key>`), so the cost parameters travel with the hash and can be raised later without a flag day. `verifyPassword` compares in constant time and ALSO verifies existing `$argon2*$` and `$2a/2b/2y$` (bcrypt) hashes through your own project''s `argon2` / `bcrypt` package, so a bundle arriving with credentials already hashed — including one that followed gina''s own published interim guidance — keeps working; gina never mints those formats, so there is one mint path and one set of parameters to reason about. `needsRehash` reports which stored hashes are below current policy, and a successful login can upgrade them transparently — the one moment the plaintext is in hand. `dummyVerify` spends a matching amount of work on the account-not-found branch to close the user-enumeration oracle; always pass `{like: <a stored hash>}` so the cost is read from real data rather than drifting from it. `validatePasswordPolicy` checks length first per NIST SP 800-63B — a 12-character minimum with no mandatory character classes by default — with composition rules and a `deny` substring list available, and returns stable machine-readable error codes. Passwords are normalised to Unicode NFC on both sides, so a user who registers on one device and signs in from another is not locked out by an encoding difference. Gina still owns no user record, credential store or login route: these are helpers, not an identity provider.'
