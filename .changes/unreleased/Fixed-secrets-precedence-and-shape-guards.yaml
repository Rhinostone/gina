kind: Fixed
body: 'The secrets resolver no longer lets a swept framework-environment value beat `process.env`, and three malformed `settings.secrets.file` shapes that used to pass in silence are now caught (#B270, #B271, #B272). **Precedence (#B270):** the two environment tiers were joined with `||`, and `filterArgs()` stores swept `GINA_*`/`VENDOR_*`/`USER_*` values as REAL booleans — so a key whose swept value was boolean `true` satisfied the short-circuit, `process.env` was never consulted, and the file tier won over a perfectly good environment variable. That inverts the precedence the file backend exists to enforce: a stale plaintext file could shadow the credential the platform injected. The tiers are now read independently and only a non-empty STRING from the framework tier wins. **Shape guards (#B271, #B272), all three affecting boot:** an empty array still disables the file tier exactly like `null` — boot is not refused, since an empty list genuinely means "no files" — but it now WARNS, because emptying the array to drop one layer drops the whole tier and used to do so without a word. A whitespace-only entry is now REFUSED rather than building a tier that can never resolve anything: the schema''s `minLength: 1` counts a space, so `[" "]` cleared both layers and failed only as a suppressed debug line. And a path containing an empty segment (`//`) is now REFUSED, which is what a `${...}` token that resolved to an EMPTY value leaves behind — `${homedir}/${scope}/secrets.env` with an empty scope collapses to a read of the file one directory UP, silently, with no unresolved token left for the existing guard to catch. ACTION REQUIRED if a config carries either refused shape, and each error names the offending path. The whitespace-only entry is a typo rather than a working configuration. The empty segment may NOT be: the dangerous cause is a token that resolved to nothing, but a token carrying a trailing slash produces the same `//` and resolves to exactly the intended file — `GINA_HOMEDIR=/opt/gina/` with the documented `"${homedir}/secrets.env"` is the shape to check. That configuration worked before this release and now refuses to boot. The two are indistinguishable by the time the path is assembled, so boot refuses on both rather than risk running a bundle on the wrong credential, and the error names both causes; removing the doubled separator, or the trailing slash from the token, resolves it. Both guards apply only to configs that declared `settings.secrets.file`, which is opt-in and absent by default. The schema gains `minItems: 1` as an editor-facing hint — no runtime validator reads `schema/settings.json`, so the runtime guard is the enforcement.'
