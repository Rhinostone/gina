kind: Security
body: >-
  Restored CVE visibility on vendored deps. `gina@0.3.7-alpha.5` stripped
  `dependencies`/`devDependencies`/`scripts` from `core/deps/busboy-1.6.0/package.json`
  and `core/deps/streamsearch-1.1.0/package.json` to reduce Socket's dep-count
  display — but the strip also removed the dep-graph edge that Socket,
  Dependabot, and `npm audit` follow to associate the vendored copies with
  their CVE records. Vendored copies of upstream packages are supply-chain
  surface exactly like npm-installed ones; stripping the metadata hid them
  from the tools meant to alert on them. Both files are now byte-identical
  to their upstream npm tarballs again. Pinning discipline going forward:
  the vendored `package.json` stays byte-identical to upstream until a local
  patch is applied; on patch, bump `version` to `<upstream>-rhinostone.N`
  (e.g. `1.6.0-rhinostone.1`) so CVE scanners still match the base version
  and readers see at a glance that the copy has diverged. Also adds an
  OSV-based CI scan (`.github/workflows/vendored-cve.yml`) that walks
  every `core/deps/*/package.json` and every `framework/v*/package.json`,
  queries `api.osv.dev` for each `(name, version)` pair, and fails the
  build on any matched vulnerability — belt-and-suspenders, independent
  of whichever third-party scanner happens to be in use. Runs on push
  to `develop`/`master`, weekly Sunday cron, and manual dispatch.
