kind: Fixed
body: 'An HTML request whose custom error page could not be dispatched is answered with the built-in error page instead of ending the bundle. When an error reaches `throwError()` on an HTML request and the bundle has an error page for its status (`templates/html/errors/`), the framework dispatches that page through the router. When building the error-page controller raised, the router''s catch called `throwError()` again for the same request, which dispatched the page again: the cycle repeated until the call stack overflowed, the request got no answer and the bundle exited (code 143) on Node.js 22, 24, 25 and 26. The guard that keeps an error page from rendering twice did not apply: it acts once the page renders, after that point. The error page is now dispatched at most once per request: the dispatch marks the request, and a later `throwError()` call for a marked request answers with the built-in page, which shows the status and the incident ref of that call; its error-level log line pairs the ref with the cause of the failed dispatch, and the line of the first error carries the same request id. A request whose error-page dispatch does not raise gets the custom page as before. No input is known to make that dispatch raise today: it was measured with test doubles over the request-data parse. Both engines. Restart the bundle; nothing to re-bake (#B842).'
