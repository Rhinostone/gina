kind: Fixed
body: 'A submit trigger marked disabled by live form validation (aria-disabled="true" plus the gina-form-submit-disabled class) could still be clicked, and that click ran the entire submit cycle — field collection, validation, the submit latch, and the isValid() send gate. The trigger was inert in appearance only, so a control announced as disabled to assistive technology stayed fully operable. A click on a disabled trigger is now intercepted before the submit dispatch: the submit cycle is never entered and no request can start from it. The click is still answered by a display-only validation pass that renders every invalid field and moves focus to the first one, so the reason the trigger is disabled remains discoverable; that pass also re-syncs the trigger state, so a stale disabled marker on a form that has since become valid now heals itself. The check reads the clicked element rather than the form registered submit trigger, so forms carrying several submit buttons behave correctly.'
