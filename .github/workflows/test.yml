name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: |
          npm install --ignore-scripts
          ln -sf $(pwd) node_modules/gina

      - name: Prepare framework dependencies
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FW_DIR="framework/v${VERSION}"
          if [ ! -f "${FW_DIR}/package.json" ]; then
            cat > "${FW_DIR}/package.json" <<EOF
          {
            "name": "gina-framework",
            "version": "${VERSION}",
            "dependencies": {
              "@rhinostone/swig": "^1.6.0"
            }
          }
          EOF
          fi
          (cd "${FW_DIR}" && npm install --ignore-scripts)

      - name: Run tests
        run: |
          node --test \
            test/core/*.test.js \
            test/lib/*.test.js \
            test/bin/*.test.js \
            test/integration/helper.test.js \
            test/integration/container-boot.test.js \
            framework/v*/test/unit/*.test.js
